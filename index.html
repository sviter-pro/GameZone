<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GameZona - 1.0.1.015</title>
    <!-- Telegram WebApp Script -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* ============================================================
           БАЗОВЫЕ СТИЛИ + ЗАЩИТА ОТ ВЫДЕЛЕНИЯ
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none !important;
            -webkit-user-select: none !important;
            -moz-user-select: none !important;
            -ms-user-select: none !important;
            user-select: none !important;
            -webkit-user-drag: none !important;
            user-drag: none !important;
        }

        html, body {
            overscroll-behavior: none;
            -webkit-overflow-scrolling: touch;
            touch-action: manipulation !important;
        }

        body {
            background: #0a0e1a;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', system-ui, sans-serif;
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 20px 0px;
            padding-top: 110px;
            padding-bottom: 85px;
            overflow-x: hidden;
            overflow-y: auto;
            -webkit-touch-callout: none !important;
            user-select: none !important;
        }

        /* Запрет выделения текста */
        ::selection {
            background: transparent !important;
        }
        ::-moz-selection {
            background: transparent !important;
        }

        /* Запрет контекстного меню */
        img, button, .building, .nav-btn, .caste-info, .settings-btn {
            -webkit-touch-callout: none !important;
            touch-action: manipulation !important;
            -webkit-user-drag: none !important;
            user-drag: none !important;
        }

        /* Скрываем скроллбар */
        ::-webkit-scrollbar {
            width: 0px;
            height: 0px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes toastFadeIn {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        /* ============================================================
           АВТОРИЗАЦИЯ (Telegram + Вход)
           ============================================================ */
        #authScreen {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(ellipse at 50% 30%, rgba(233,69,96,0.15) 0%, #0a0e1a 70%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            animation: fadeIn 0.5s ease;
        }

        #authScreen.hidden {
            display: none;
        }

        .auth-container {
            background: rgba(16, 20, 40, 0.95);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 32px;
            padding: 36px 28px;
            max-width: 400px;
            width: 92%;
            border: 1px solid rgba(233, 69, 96, 0.25);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
        }

        .auth-logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .auth-logo h1 {
            font-size: 38px;
            font-weight: 800;
            background: linear-gradient(135deg, #e94560, #ff6b6b, #e94560);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: gradientShift 3s ease-in-out infinite;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .auth-logo p {
            color: #888;
            font-size: 14px;
            margin-top: 6px;
            letter-spacing: 1px;
        }

        .auth-form h2 {
            color: #e94560;
            font-size: 20px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .auth-input {
            width: 100%;
            padding: 14px 18px;
            margin-bottom: 12px;
            background: rgba(30, 36, 64, 0.8);
            border: 1px solid rgba(233, 69, 96, 0.2);
            border-radius: 40px;
            color: white;
            font-size: 15px;
            transition: border-color 0.3s, box-shadow 0.3s;
            outline: none;
        }

        .auth-input:focus {
            border-color: #e94560;
            box-shadow: 0 0 20px rgba(233, 69, 96, 0.15);
        }

        .auth-input::placeholder {
            color: #666;
        }

        .auth-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #e94560, #c73e54);
            border: none;
            border-radius: 40px;
            font-size: 16px;
            font-weight: 700;
            color: white;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .auth-btn:active {
            transform: scale(0.96);
        }

        .auth-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .auth-btn.telegram {
            background: linear-gradient(135deg, #29aae1, #1c7eb5);
            margin-bottom: 12px;
        }

        .auth-btn.telegram:active {
            transform: scale(0.96);
        }

        .auth-divider {
            display: flex;
            align-items: center;
            margin: 18px 0;
            color: #555;
            font-size: 12px;
            gap: 12px;
        }

        .auth-divider::before,
        .auth-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
        }

        .auth-switch {
            text-align: center;
            margin-top: 16px;
            color: #888;
            font-size: 14px;
        }

        .auth-switch span {
            color: #e94560;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .auth-switch span:active {
            opacity: 0.7;
        }

        .auth-error {
            background: rgba(233, 69, 96, 0.15);
            border: 1px solid rgba(233, 69, 96, 0.4);
            border-radius: 12px;
            padding: 10px 14px;
            color: #e94560;
            font-size: 13px;
            text-align: center;
            margin-bottom: 14px;
            display: none;
        }

        .auth-error.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        /* ============================================================
           ВЕРХНЯЯ ПАНЕЛЬ
           ============================================================ */
        .fixed-top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(10, 14, 26, 0.88);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(233, 69, 96, 0.25);
            padding: 8px 12px;
            padding-top: max(8px, env(safe-area-inset-top));
        }

        .top-bar-content {
            max-width: 412px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
        }

        .left-profile {
            flex-shrink: 0;
        }

        .caste-info {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 56px;
            cursor: pointer;
            background: rgba(30, 36, 64, 0.5);
            border-radius: 40px;
            padding: 4px 8px;
            transition: 0.15s;
            border: 1px solid transparent;
        }

        .caste-info:active {
            transform: scale(0.94);
            background: rgba(233, 69, 96, 0.15);
            border-color: rgba(233, 69, 96, 0.3);
        }

        .caste-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(201, 160, 61, 0.6);
            background: #1a1a2a;
            transition: border-color 0.3s;
        }

        .caste-avatar:hover {
            border-color: #c9a03d;
        }

        .caste-level {
            font-size: 8px;
            color: #888;
            margin-top: 1px;
            font-weight: 600;
        }

        .resources-column {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 3px;
            min-width: 0;
        }

        .resources-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
            flex-wrap: wrap;
        }

        .resource-item {
            background: rgba(30, 36, 64, 0.7);
            border-radius: 30px;
            padding: 2px 8px;
            display: flex;
            align-items: center;
            gap: 3px;
            font-size: 10px;
            font-weight: 600;
            border: 1px solid rgba(233, 69, 96, 0.12);
            white-space: nowrap;
            color: #ccc;
        }

        .resource-item span:first-child {
            font-size: 11px;
        }

        .resource-item .value {
            color: #ffd966;
        }

        .settings-btn {
            background: rgba(30, 36, 64, 0.6);
            border: none;
            padding: 4px 10px;
            border-radius: 40px;
            font-size: 17px;
            cursor: pointer;
            color: white;
            flex-shrink: 0;
            transition: 0.15s;
            border: 1px solid transparent;
        }

        .settings-btn:active {
            transform: scale(0.92);
            background: rgba(233, 69, 96, 0.2);
            border-color: rgba(233, 69, 96, 0.3);
        }

        /* ============================================================
           НИЖНЯЯ ПАНЕЛЬ
           ============================================================ */
        .fixed-bottom-bar {
            position: fixed;
            bottom: -2px;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(10, 14, 26, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(233, 69, 96, 0.2);
            padding: 4px 0;
            padding-bottom: max(4px, env(safe-area-inset-bottom));
        }

        .bottom-nav {
            max-width: 500px;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .nav-btn {
            background: transparent;
            border: none;
            border-radius: 14px;
            padding: 4px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            color: #8e8ea0;
            font-size: 11px;
            font-weight: 500;
            position: relative;
            -webkit-touch-callout: none !important;
            touch-action: manipulation !important;
        }

        .nav-btn img {
            width: 44px;
            height: auto;
            object-fit: contain;
            display: block;
            -webkit-user-select: none;
            user-select: none;
            pointer-events: none;
            -webkit-user-drag: none;
            user-drag: none;
        }

        .nav-btn.active {
            background: rgba(233, 69, 96, 0.12);
            border: 2px solid rgba(233, 69, 96, 0.6);
            box-shadow: 0 0 16px rgba(233, 69, 96, 0.25);
            transform: scale(1.02);
        }

        .nav-btn:active {
            transform: scale(0.92);
            background: rgba(233, 69, 96, 0.2);
        }

        .nav-btn span {
            display: none;
        }

        /* ============================================================
           ГЛАВНЫЙ ЭКРАН (КАРТА)
           ============================================================ */
        .game-container {
            max-width: 412px;
            width: 100%;
            margin: 0 auto;
            padding: 0;
        }

        .map-wrapper {
            position: relative;
            width: 100%;
            max-width: 100%;
            margin: 0 auto;
            margin-top: -30px;
            margin-bottom: -30px;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
        }

        .map-image {
            width: 100%;
            height: auto;
            display: block;
            pointer-events: none;
            user-select: none;
            max-width: 100%;
            -webkit-user-drag: none;
            user-drag: none;
        }

        .building {
            position: absolute;
            border: 2px solid transparent;
            border-radius: 16px;
            cursor: pointer;
            transition: 0.25s;
            -webkit-touch-callout: none !important;
            touch-action: manipulation !important;
        }

        .building.active {
            border: 3px solid #ffb347;
            box-shadow: 0 0 30px rgba(255, 180, 70, 0.6), inset 0 0 30px rgba(255, 180, 70, 0.15);
            background: rgba(255, 180, 70, 0.1);
        }

        .building:active {
            transform: scale(0.96);
        }

        .building-label {
            position: absolute;
            left: 50%;
            top: -34px;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.92);
            border: 1px solid #ffb347;
            color: #ffcf7a;
            padding: 5px 12px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 700;
            opacity: 0;
            pointer-events: none;
            transition: 0.25s;
            white-space: nowrap;
            box-shadow: 0 0 25px rgba(255, 180, 70, 0.3);
            z-index: 100;
            letter-spacing: 0.5px;
        }

        .building:hover .building-label {
            opacity: 0.8;
            top: -42px;
        }

        .building.active .building-label {
            opacity: 1;
            top: -46px;
        }

        .b1 { top: 3%; left: 31%; width: 38%; height: 15%; }
        .b2 { top: 18%; left: 3%; width: 38%; height: 18%; }
        .b3 { top: 19%; right: 3%; width: 38%; height: 18%; }
        .b4 { top: 37%; left: 28%; width: 42%; height: 13%; }
        .b5 { top: 51%; left: 4%; width: 34%; height: 18%; }
        .b6 { top: 51%; right: 4%; width: 34%; height: 18%; }
        .b7 { top: 72%; left: 28%; width: 43%; height: 16%; }

        /* ============================================================
           TOAST
           ============================================================ */
        .game-toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #1a1a2a, #0d0d15);
            border: 2px solid #c9a03d;
            color: #ffd966;
            padding: 12px 22px;
            border-radius: 16px;
            font-size: 14px;
            font-weight: 600;
            z-index: 20000;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.6);
            animation: toastFadeIn 0.3s ease;
            max-width: 92vw;
            text-align: center;
            word-wrap: break-word;
            line-height: 1.4;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .game-toast.error {
            border-color: #e94560;
            color: #e94560;
        }

        .game-toast.success {
            border-color: #4caf50;
            color: #4caf50;
        }

        .game-toast.warning {
            border-color: #ff9800;
            color: #ff9800;
        }

        /* ============================================================
           ЗАГРУЗКА
           ============================================================ */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(10, 14, 26, 0.92);
            backdrop-filter: blur(12px);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 99999;
        }

        .loading-screen.show {
            display: flex;
        }

        .loading-spinner {
            width: 48px;
            height: 48px;
            border: 3px solid rgba(233, 69, 96, 0.2);
            border-top-color: #e94560;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        .loading-text {
            color: #888;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        /* ============================================================
           МОДАЛЬНЫЕ ОКНА (ПРОФИЛЬ, ИНВЕНТАРЬ, НАСТРОЙКИ)
           ============================================================ */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.82);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            z-index: 20000;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.25s ease;
            padding: 16px;
        }

        .modal-window {
            background: linear-gradient(145deg, #0f1327, #1a1e3a);
            border: 1px solid rgba(139, 69, 19, 0.4);
            border-radius: 28px;
            width: 100%;
            max-width: 420px;
            max-height: 85vh;
            overflow-y: auto;
            padding: 24px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.3s ease;
        }

        .modal-window::-webkit-scrollbar {
            width: 0px;
        }

        .modal-window-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(139, 69, 19, 0.3);
            padding-bottom: 14px;
            margin-bottom: 18px;
        }

        .modal-window-title {
            font-size: 20px;
            font-weight: 800;
            background: linear-gradient(135deg, #c9a03d, #8B6914);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 0.5px;
        }

        .modal-window-close {
            background: rgba(139, 69, 19, 0.25);
            border: none;
            border-radius: 50%;
            width: 34px;
            height: 34px;
            cursor: pointer;
            color: white;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .modal-window-close:active {
            transform: scale(0.88);
            background: rgba(233, 69, 96, 0.3);
        }

        /* ============================================================
           ПРОФИЛЬ
           ============================================================ */
        .profile-avatar-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 16px;
        }

        .profile-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #c9a03d;
            box-shadow: 0 0 25px rgba(201, 160, 61, 0.25);
            cursor: pointer;
            transition: all 0.2s;
            background: #1a1a2a;
        }

        .profile-avatar:active {
            transform: scale(0.94);
        }

        .profile-avatar-hint {
            font-size: 11px;
            color: #888;
            margin-top: 6px;
            letter-spacing: 0.5px;
        }

        .profile-username {
            text-align: center;
            font-size: 22px;
            font-weight: 700;
            color: #ffd966;
            margin: 10px 0 16px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .profile-username .edit-icon {
            font-size: 16px;
            background: rgba(139, 69, 19, 0.3);
            padding: 4px 12px;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.2s;
            color: #c9a03d;
            font-weight: 600;
        }

        .profile-username .edit-icon:active {
            transform: scale(0.9);
            background: rgba(139, 69, 19, 0.6);
        }

        .profile-stat-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin: 16px 0;
        }

        .profile-stat-item {
            background: rgba(0, 0, 0, 0.35);
            border-radius: 14px;
            padding: 10px;
            text-align: center;
            border: 1px solid rgba(139, 69, 19, 0.15);
        }

        .profile-stat-label {
            font-size: 9px;
            color: #c9a03d;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .profile-stat-value {
            font-size: 18px;
            font-weight: 700;
            color: #ffd966;
            margin-top: 2px;
        }

        .profile-action-btn {
            width: 100%;
            padding: 12px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 10px;
            border: none;
            letter-spacing: 0.5px;
        }

        .profile-action-btn:active {
            transform: scale(0.96);
        }

        .profile-action-btn.logout {
            background: linear-gradient(135deg, #8B4513, #5a2d0a);
            border: 1px solid #c9a03d;
            color: #ffd966;
        }

        .profile-action-btn.delete {
            background: linear-gradient(135deg, #8B1a1a, #5a0a0a);
            border: 1px solid #e94560;
            color: #e94560;
        }

        .profile-action-btn.avatar {
            background: rgba(30, 36, 64, 0.8);
            border: 1px solid rgba(139, 69, 19, 0.3);
            color: #c9a03d;
        }

        /* ============================================================
           ВЫБОР АВАТАРОВ
           ============================================================ */
        .avatar-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin: 16px 0;
        }

        .avatar-item {
            text-align: center;
            padding: 10px 6px;
            background: rgba(30, 36, 64, 0.5);
            border-radius: 16px;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.2s;
        }

        .avatar-item:active {
            transform: scale(0.94);
        }

        .avatar-item.selected {
            border-color: #c9a03d;
            background: rgba(201, 160, 61, 0.15);
            box-shadow: 0 0 20px rgba(201, 160, 61, 0.2);
        }

        .avatar-item .avatar-img {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(139, 69, 19, 0.3);
        }

        .avatar-item .avatar-name {
            font-size: 10px;
            color: #aaa;
            margin-top: 4px;
        }

        .avatar-item .avatar-status {
            font-size: 9px;
            font-weight: 600;
        }

        .avatar-item .avatar-status.owned {
            color: #4caf50;
        }

        .avatar-item .avatar-status.locked {
            color: #888;
        }

        .avatar-item .avatar-status.selected {
            color: #c9a03d;
        }

        /* ============================================================

async function loadAdminShopItems() {
    console.log('🔄 Начало загрузки товаров из базы данных...');
    
    try {
        if (!db) {
            console.warn('⚠️ База данных не инициализирована');
            window.adminShopItems = getDefaultShopItems();
            return;
        }
        
        // ✅ ПРЯМОЙ ПУТЬ К ТОВАРАМ
        var path = 'config/shop/items';
        console.log('🔍 Проверка пути:', path);
        
        var snapshot = await db.ref(path).once('value');
        
        if (snapshot.exists()) {
            var data = snapshot.val();
            console.log('✅ Данные найдены по пути:', path);
            console.log('📦 Ключи в данных:', Object.keys(data));
            
            var itemsArray = [];
            
            // Проходим по всем ключам
            for (var key in data) {
                if (data.hasOwnProperty(key)) {
                    var item = data[key];
                    
                    // Проверяем, что это товар
                    if (item && typeof item === 'object') {
                        // Если есть name - это товар
                        if (item.name) {
                            item.id = key;
                            itemsArray.push(item);
                            console.log('📦 Добавлен товар:', item.name);
                        }
                        // Если есть поле items - обрабатываем вложенные
                        else if (item.items && typeof item.items === 'object') {
                            for (var subKey in item.items) {
                                if (item.items.hasOwnProperty(subKey)) {
                                    var subItem = item.items[subKey];
                                    if (subItem && typeof subItem === 'object' && subItem.name) {
                                        subItem.id = subKey;
                                        itemsArray.push(subItem);
                                        console.log('📦 Добавлен вложенный товар:', subItem.name);
                                    }
                                }
                            }
                        }
                    }
                }
            }
            
            console.log('📦 Всего найдено товаров:', itemsArray.length);
            
            // Фильтруем валидные товары
            var validItems = itemsArray.filter(function(item) {
                return item && item.name && (item.category || item.type);
            });
            
            console.log('📦 Валидных товаров:', validItems.length);
            
            if (validItems.length > 0) {
                window.adminShopItems = validItems;
                console.log('✅ ЗАГРУЖЕНО ' + validItems.length + ' ТОВАРОВ ИЗ БД');
                console.log('📦 Первые 3 товара:', validItems.slice(0, 3).map(function(i) { 
                    return i.name + ' (' + i.category + ')'; 
                }));
                return;
            } else {
                console.warn('⚠️ Найдены данные, но нет валидных товаров');
            }
        } else {
            console.log('ℹ️ По пути', path, 'данных нет');
        }
        
        // Если товары не найдены - используем стандартные
        console.log('ℹ️ Товары не найдены в базе, используем стандартные');
        window.adminShopItems = getDefaultShopItems();
        console.log('📦 ЗАГРУЖЕНО ' + window.adminShopItems.length + ' СТАНДАРТНЫХ ТОВАРОВ');
        
    } catch (e) {
        console.error('❌ ОШИБКА ПРИ ЗАГРУЗКЕ ТОВАРОВ:', e);
        window.adminShopItems = getDefaultShopItems();
        console.log('📦 Использованы стандартные товары из-за ошибки');
    }
}

            if (data.shopLevel) window.shopLevel = data.shopLevel;
            if (data.shopUpgradeStartTime) window.shopUpgradeStartTime = data.shopUpgradeStartTime;
            if (data.shopUpgradeDuration) window.shopUpgradeDuration = data.shopUpgradeDuration;
        }
    } catch (e) {
        console.warn('⚠️ Ошибка загрузки данных магазина из БД:', e);
    }
}

// ============================================================
// 2.5. СОХРАНЕНИЕ ДАННЫХ В БАЗУ
// ============================================================
async function savePlayerShopData() {
    if (!window.currentPlayer || !window.playerId) return;
    
    try {
        var updateData = {};
        var hasChanges = false;
        
        if (window.purchasedItemsCount && Object.keys(window.purchasedItemsCount).length > 0) {
            updateData.purchasedItemsCount = window.purchasedItemsCount;
            hasChanges = true;
        }
        if (window.currentPlayer.purchasedEquipment && window.currentPlayer.purchasedEquipment.length > 0) {
            updateData.purchasedEquipment = window.currentPlayer.purchasedEquipment;
            hasChanges = true;
        }
        if (window.currentPlayer.tattoos && window.currentPlayer.tattoos.length > 0) {
            updateData.tattoos = window.currentPlayer.tattoos;
            hasChanges = true;
        }
        
        if (hasChanges) {
            await dbUpdate('players/' + window.playerId, updateData);
            console.log('✅ Данные магазина сохранены в БД');
        }
    } catch (e) {
        console.warn('⚠️ Ошибка сохранения данных магазина в БД:', e);
    }
}

// ============================================================
// 2.6. ЗАГРУЗКА ИЗ LOCALSTORAGE
// ============================================================
function loadPurchasedItemsFromStorage() {
    if (window.currentPlayer && window.currentPlayer.id) {
        try {
            var saved = localStorage.getItem('purchasedItemsCount_' + window.currentPlayer.id);
            if (saved) {
                window.purchasedItemsCount = JSON.parse(saved);
            }
            
            var savedEquipment = localStorage.getItem('purchasedEquipment_' + window.currentPlayer.id);
            if (savedEquipment) {
                window.currentPlayer.purchasedEquipment = JSON.parse(savedEquipment);
            }
            
            var savedTattoos = localStorage.getItem('tattoos_' + window.currentPlayer.id);
            if (savedTattoos) {
                window.currentPlayer.tattoos = JSON.parse(savedTattoos);
                console.log('✅ Загружены наколки из localStorage:', window.currentPlayer.tattoos.length);
            }
        } catch(e) {
            console.warn('⚠️ Ошибка загрузки из localStorage:', e);
        }
    }
}

// 2.7. ИНИЦИАЛИЗАЦИЯ МАГАЗИНА
// ============================================================
async function initShop() {
    console.log('🔄 Инициализация магазина...');
    
    await loadAdminShopItems();
    loadPurchasedItemsFromStorage();
    await loadPlayerShopData();
    
    if (!window.adminShopItems || window.adminShopItems.length === 0) {
        window.adminShopItems = getDefaultShopItems();
    }
    
    // Загружаем наколки из localStorage если в БД пусто
    if (window.currentPlayer && (!window.currentPlayer.tattoos || window.currentPlayer.tattoos.length === 0)) {
        try {
            var savedTattoos = localStorage.getItem('tattoos_' + window.currentPlayer.id);
            if (savedTattoos) {
                window.currentPlayer.tattoos = JSON.parse(savedTattoos);
                console.log('💉 Наколки загружены из localStorage при инициализации:', window.currentPlayer.tattoos.length);
            }
        } catch(e) {}
    }
    
    console.log('✅ Магазин инициализирован');
    console.log('📦 Всего товаров:', window.adminShopItems.length);
    console.log('📦 Купленных предметов:', Object.keys(window.purchasedItemsCount || {}).length);
    console.log('💉 Наколок:', window.currentPlayer?.tattoos?.length || 0);
}

// 2.8. ПОДПИСКА НА ИЗМЕНЕНИЯ ПРОКАЧКИ
// ============================================================
function subscribeShopUpgrade() {
    if (!window.playerId) return;
    
    var ref = db.ref('players/' + window.playerId);
    ref.on('value', function(snapshot) {
        if (snapshot.exists()) {
            var data = snapshot.val();
            if (data.shopLevel !== undefined) window.shopLevel = data.shopLevel;
            if (data.shopUpgradeStartTime !== undefined) window.shopUpgradeStartTime = data.shopUpgradeStartTime || 0;
            if (data.shopUpgradeDuration !== undefined) window.shopUpgradeDuration = data.shopUpgradeDuration || 0;
            
            var modal = document.getElementById('shopFullscreen');
            if (modal) {
                updateShopUpgradeUI();
                if (!isShopUpgradeActive() && window.shopUpgradeStartTime === 0) {
                    renderShopItemsContent();
                    updateResources();
                }
            }
        }
    }, function(error) {
        console.warn('⚠️ Ошибка слушателя прокачки:', error);
    });
}

    if (modal) modal.remove();

};

function startShopTimers() {
    if (window.shopTimerInterval) clearInterval(window.shopTimerInterval);
    window.shopTimerInterval = setInterval(function() {
        var modal = document.getElementById('shopFullscreen');
        if (!modal) {
            if (window.shopTimerInterval) {
                clearInterval(window.shopTimerInterval);
                window.shopTimerInterval = null;
            }
            return;
        }
        
        var cigValue = document.getElementById('shopCigarettesValue');
        var rublesValue = document.getElementById('shopRublesValue');
        var woodValue = document.getElementById('shopWoodValue');
        var stoneValue = document.getElementById('shopStoneValue');
        if (cigValue && window.currentPlayer) cigValue.textContent = formatNumberShort(window.currentPlayer.cigarettes || 0);
        if (rublesValue && window.currentPlayer) rublesValue.textContent = formatNumberShort(window.currentPlayer.rubles || 0);
        if (woodValue && window.currentPlayer) woodValue.textContent = formatNumberShort(window.currentPlayer.lumber?.wood || 0);
        if (stoneValue && window.currentPlayer) stoneValue.textContent = formatNumberShort(window.currentPlayer.quarry?.stone || 0);
        
        var timerEl = document.getElementById('randomUpdateTimerValue');
        if (timerEl && window.currentShopTab === 'offers') {
            timerEl.textContent = formatTimeDetailedWithSeconds(getRandomShopUpdateRemaining());
        }
        
        if (isShopUpgradeActive()) {
            var remaining = getShopUpgradeRemaining();
            var upgradeTimer = document.getElementById('shopUpgradeTimer');
            var upgradeProgress = document.getElementById('shopUpgradeProgress');
            if (upgradeTimer) upgradeTimer.textContent = formatTimerMinutes(remaining);
            if (upgradeProgress) {
                var progress = ((window.shopUpgradeDuration - remaining) / window.shopUpgradeDuration) * 100;
                upgradeProgress.style.width = Math.min(100, progress) + '%';
            }
        }
        checkAndCompleteShopUpgrade();
    }, 1000);
}

// ============================================================
// 2.13. ПРОКАЧКА МАГАЗИНА
// ============================================================
async function upgradeShop() {
    if (!window.currentPlayer) {
        showToast('❌ Игрок не найден!', 'error');
        return;
    }
    if (isShopUpgradeActive()) {
        showToast('⏳ Прокачка уже идет! Дождитесь завершения.', 'warning');
        return;
    }
    
    var level = window.shopLevel || 1;
    var costCigarettes = 100 * level;
    var costWood = 50 * level;
    var costStone = 30 * level;
    
    if (window.currentPlayer.cigarettes < costCigarettes) {
        showToast('❌ Не хватает ' + (costCigarettes - window.currentPlayer.cigarettes) + ' 🚬!', 'error');
        return;
    }
    if ((window.currentPlayer.lumber?.wood || 0) < costWood) {
        showToast('❌ Не хватает ' + (costWood - (window.currentPlayer.lumber?.wood || 0)) + ' 🪵!', 'error');
        return;
    }
    if ((window.currentPlayer.quarry?.stone || 0) < costStone) {
        showToast('❌ Не хватает ' + (costStone - (window.currentPlayer.quarry?.stone || 0)) + ' 🪨!', 'error');
        return;
    }
    
    try {
        showLoading(true, 'Начало прокачки...');
        window.currentPlayer.cigarettes -= costCigarettes;
        if (window.currentPlayer.lumber) window.currentPlayer.lumber.wood -= costWood;
        if (window.currentPlayer.quarry) window.currentPlayer.quarry.stone -= costStone;
        
        var upgradeDurationMs = 2 * 60 * 1000;
        upgradeDurationMs = Math.floor(upgradeDurationMs * (1 + (level - 1) * 0.1));
        var upgradeStartTime = Date.now();
        window.shopUpgradeStartTime = upgradeStartTime;
        window.shopUpgradeDuration = upgradeDurationMs;
        
        var updateData = {
            cigarettes: window.currentPlayer.cigarettes,
            lumber: window.currentPlayer.lumber,
            quarry: window.currentPlayer.quarry,
            shopLevel: window.shopLevel,
            shopUpgradeStartTime: upgradeStartTime,
            shopUpgradeDuration: upgradeDurationMs
        };
        await dbUpdate('players/' + window.playerId, updateData);
        
        showToast('⏳ Начата прокачка магазина! Уровень повысится через ' + Math.round(upgradeDurationMs / 60000) + ' мин.', 'success');
        showLoading(false);
        updateShopUpgradeUI();
        switchShopTab('upgrade');
        updateResources();
    } catch (e) {
        showLoading(false);
        showToast('❌ Ошибка: ' + e.message, 'error');
        console.error('Ошибка прокачки магазина:', e);
    }
}

// ============================================================
// 2.14. ЗАВЕРШЕНИЕ ПРОКАЧКИ
// ============================================================
async function checkAndCompleteShopUpgrade() {
    var remaining = getShopUpgradeRemaining();
    if (remaining === 0 && window.shopUpgradeStartTime > 0) {
        var newLevel = (window.shopLevel || 1) + 1;
        await dbUpdate('players/' + window.playerId, {
            shopLevel: newLevel,
            shopUpgradeStartTime: 0,
            shopUpgradeDuration: 0
        });
        window.shopLevel = newLevel;
        window.shopUpgradeStartTime = 0;
        window.shopUpgradeDuration = 0;
        showToast('✅ Уровень магазина повышен до ' + newLevel + '!', 'success');
        updateShopUpgradeUI();
        renderShopItemsContent();
        updateResources();
        if (window.currentShopTab === 'upgrade') {
            switchShopTab('upgrade');
        }
        return true;
    }
    return false;
}

// ============================================================
// 2.15. ФУНКЦИИ СОСТОЯНИЯ ПРОКАЧКИ
// ============================================================
function isShopUpgradeActive() {
    return window.shopUpgradeStartTime > 0 && window.shopUpgradeDuration > 0 && 
           (Date.now() - window.shopUpgradeStartTime) < window.shopUpgradeDuration;
}

function getShopUpgradeRemaining() {
    if (window.shopUpgradeStartTime === 0 || window.shopUpgradeDuration === 0) return 0;
    return Math.max(0, window.shopUpgradeDuration - (Date.now() - window.shopUpgradeStartTime));
}

window.switchShopTab = function(tab) {
    if (!tab) return;
    window.currentShopTab = tab;
    var offersContainer = document.getElementById('shopOffersContainer');
    var upgradeContainer = document.getElementById('shopUpgradeContainer');
    if (offersContainer) offersContainer.style.display = tab === 'offers' ? 'block' : 'none';
    if (upgradeContainer) upgradeContainer.style.display = tab === 'upgrade' ? 'block' : 'none';
    var btns = document.querySelectorAll('.shop-tab-btn2');
    btns.forEach(function(btn, index) {
        if (!btn) return;
        if (index === 0 && tab === 'offers') {
            btn.style.color = '#c9a03d';

            btn.style.color = '#8e8ea0';

        } else if (index === 1 && tab === 'upgrade') {

        }

};

// 2.20. ФУНКЦИИ РАНДОМНЫХ ТОВАРОВ
// ============================================================
function generateRandomShopItems() {
    var items = [];
    var resourceTypes = [
        { type: 'cigarettes', name: 'Папиросы', icon: '🚬', desc: 'Пачка папирос' },
        { type: 'rubles', name: 'Деньги', icon: '💰', desc: 'Пачка рублей' },
        { type: 'paper', name: 'Бумага', icon: '📄', desc: 'Стопка бумаги' },
        { type: 'makhorka', name: 'Махорка', icon: '🌿', desc: 'Самосад' },
        { type: 'wood', name: 'Древесина', icon: '🪵', desc: 'Сосновый брус' },
        { type: 'stone', name: 'Камень', icon: '🪨', desc: 'Гранитная глыба' }
    ];
    var level = window.currentPlayer ? window.currentPlayer.level : 1;
    for (var i = 0; i < 12; i++) {
        var resource = resourceTypes[Math.floor(Math.random() * resourceTypes.length)];
        var priceType = Math.random() > 0.5 ? 'rubles' : 'cigarettes';
        var price = priceType === 'rubles' ? 
            Math.floor(Math.random() * (50 + (level * 10))) + 10 + level * 2 :
            Math.floor(Math.random() * (30 + (level * 8))) + 5 + level;
        var amount = Math.floor(Math.random() * (20 + (level * 3))) + 5 + Math.floor(level / 2);
        items.push({
            id: 'random_' + Date.now() + '_' + i + '_' + Math.random(),
            name: resource.name, desc: resource.desc, price: price,
            currency: priceType, type: 'resource', category: 'random',
            resourceType: resource.type, amount: amount, icon: resource.icon,
            imageUrl: ''
        });
    }
    return items;
}

function loadRandomShopFromStorage() {
    if (window.currentPlayer && window.currentPlayer.id) {
        try {
            var savedItems = localStorage.getItem('randomShopItems_' + window.currentPlayer.id);
            var savedLastUpdate = localStorage.getItem('randomShopLastUpdate_' + window.currentPlayer.id);
            var savedPurchased = localStorage.getItem('purchasedRandomItems_' + window.currentPlayer.id);
            if (savedItems) randomShopItems = JSON.parse(savedItems);
            if (savedLastUpdate) randomShopLastUpdate = parseInt(savedLastUpdate);
            if (savedPurchased) purchasedRandomItems = JSON.parse(savedPurchased);
        } catch(e) {}
        if (!randomShopItems || randomShopItems.length === 0 || (Date.now() - randomShopLastUpdate) >= 7200000) {
            updateRandomShopIfNeeded(false);
        }
    }
}

function updateRandomShopIfNeeded(force) {
    var now = Date.now();
    if (force || !randomShopItems || randomShopItems.length === 0 || now - randomShopLastUpdate >= 7200000) {
        if (force && window.currentPlayer && window.currentPlayer.rubles < 200) {
            showToast('❌ Не хватает 200💰 для принудительного обновления!', 'error');
            return false;
        }
        randomShopItems = generateRandomShopItems();
        randomShopLastUpdate = now;
        purchasedRandomItems = {};
        if (window.currentPlayer && window.currentPlayer.id) {
            localStorage.setItem('randomShopItems_' + window.currentPlayer.id, JSON.stringify(randomShopItems));
            localStorage.setItem('randomShopLastUpdate_' + window.currentPlayer.id, randomShopLastUpdate);
            localStorage.setItem('purchasedRandomItems_' + window.currentPlayer.id, JSON.stringify(purchasedRandomItems));
        }
        if (force && window.currentPlayer) {
            window.currentPlayer.rubles -= 200;
            dbUpdate('players/' + window.playerId, { rubles: window.currentPlayer.rubles });
            showToast('🎲 Ассортимент РАНДОМ обновлён! -200💰', 'success');
        }
        return true;
    }
    return false;
}

function getRandomShopUpdateRemaining() {
    var elapsed = Date.now() - (randomShopLastUpdate || 0);
    return Math.max(0, 7200000 - elapsed);
}

window.forceUpdateRandomShop = function() {
    if (!window.currentPlayer) {
        showToast('❌ Игрок не найден!', 'error');
        return;

// 2.21. ПОКУПКА РАНДОМНОГО ТОВАРА
// ============================================================
window.buyRandomItemFromModal = async function(item) {
    if (!window.currentPlayer || !item) {
        showToast('❌ Ошибка!', 'error');
        return;
    }
    if (purchasedRandomItems[item.id]) {
        showToast('⚠️ Этот товар уже куплен!', 'warning');
        return;
    }
    if (item.currency === 'rubles' && window.currentPlayer.rubles < item.price) {
        showToast('❌ Не хватает ' + (item.price - window.currentPlayer.rubles) + ' 💰!', 'error');
        return;
    }
    if (item.currency === 'cigarettes' && window.currentPlayer.cigarettes < item.price) {
        showToast('❌ Не хватает ' + (item.price - window.currentPlayer.cigarettes) + ' 🚬!', 'error');
        return;
    }
    
    try {
        showLoading(true, 'Покупка...');
        purchasedRandomItems[item.id] = true;
        localStorage.setItem('purchasedRandomItems_' + window.currentPlayer.id, JSON.stringify(purchasedRandomItems));
        var updateData = {};
        if (item.currency === 'rubles') {
            window.currentPlayer.rubles -= item.price;
            updateData.rubles = window.currentPlayer.rubles;
        } else {
            window.currentPlayer.cigarettes -= item.price;
            updateData.cigarettes = window.currentPlayer.cigarettes;
        }
        if (item.resourceType === 'cigarettes') {
            window.currentPlayer.cigarettes += item.amount;
            updateData.cigarettes = window.currentPlayer.cigarettes;
        } else if (item.resourceType === 'rubles') {
            window.currentPlayer.rubles += item.amount;
            updateData.rubles = window.currentPlayer.rubles;
        } else if (item.resourceType === 'paper') {
            if (!window.currentPlayer.mine) window.currentPlayer.mine = { paper: 0 };
            window.currentPlayer.mine.paper += item.amount;
            updateData.mine = window.currentPlayer.mine;
        } else if (item.resourceType === 'makhorka') {
            if (!window.currentPlayer.mine) window.currentPlayer.mine = { makhorka: 0 };
            window.currentPlayer.mine.makhorka += item.amount;
            updateData.mine = window.currentPlayer.mine;
        } else if (item.resourceType === 'wood') {
            if (!window.currentPlayer.lumber) window.currentPlayer.lumber = { wood: 0 };
            window.currentPlayer.lumber.wood += item.amount;
            updateData.lumber = window.currentPlayer.lumber;
        } else if (item.resourceType === 'stone') {
            if (!window.currentPlayer.quarry) window.currentPlayer.quarry = { stone: 0 };
            window.currentPlayer.quarry.stone += item.amount;
            updateData.quarry = window.currentPlayer.quarry;
        }
        await dbUpdate('players/' + window.playerId, updateData);
        showToast('✅ Куплено: ' + (item.name || 'Товар') + '!', 'success');
        showLoading(false);
        renderShopItemsContent();
        updateResources();
    } catch (e) {
        showLoading(false);
        showToast('❌ Ошибка покупки: ' + e.message, 'error');
        console.error('Ошибка покупки:', e);
    }
};

            console.log('💉 СОЗДАЁМ НАКОЛКУ');
            
            // 1. Инициализируем массив
            if (!window.currentPlayer.tattoos) {
                window.currentPlayer.tattoos = [];
                console.log('💉 Массив наколок создан');
            }
            
            // 2. Создаём объект наколки
            var newTattoo = { 
                name: item.name, 
                imageUrl: item.imageUrl || '',
                bonus: item.bonus || 0,
                stat: item.stat || 'strength'
            };
            console.log('💉 Объект наколки:', newTattoo);
            
            // 3. Добавляем в массив
            window.currentPlayer.tattoos.push(newTattoo);
            console.log('💉 Массив наколок после добавления:', window.currentPlayer.tattoos);
            
            // 4. Сохраняем в updateData
            updateData.tattoos = window.currentPlayer.tattoos;
            
            // 5. Сохраняем в localStorage
            try {
                localStorage.setItem('tattoos_' + window.currentPlayer.id, JSON.stringify(window.currentPlayer.tattoos));
                console.log('💉 Наколки сохранены в localStorage');
            } catch(e) {
                console.warn('⚠️ Ошибка сохранения наколок в localStorage:', e);
            }
            
            // 6. Применяем бонусы
            if (item.bonus && item.stat) {
                if (!window.currentPlayer.stats) {
                    window.currentPlayer.stats = { strength: 10, defense: 5, critical: 5 };
                }
                if (typeof window.currentPlayer.stats[item.stat] === 'undefined') {
                    window.currentPlayer.stats[item.stat] = 0;
                }
                window.currentPlayer.stats[item.stat] = (window.currentPlayer.stats[item.stat] || 0) + item.bonus;
                updateData.stats = window.currentPlayer.stats;
                console.log('💉 Применён бонус:', item.stat, '+', item.bonus);
            }
            
            showToast('✅ Куплена наколка "' + (item.name || '') + '"!', 'success');
            
        // ============================================================
        // ОБРАБОТКА ЭКИПИРОВКИ
        // ============================================================
        } else if (item.type === 'equipment') {
            if (!window.currentPlayer.purchasedEquipment) {
                window.currentPlayer.purchasedEquipment = [];
            }
            if (!window.currentPlayer.purchasedEquipment.includes(item.name)) {
                window.currentPlayer.purchasedEquipment.push(item.name);
                updateData.purchasedEquipment = window.currentPlayer.purchasedEquipment;
                localStorage.setItem('purchasedEquipment_' + window.currentPlayer.id, JSON.stringify(window.currentPlayer.purchasedEquipment));
            }
            
            if (!window.purchasedItemsCount) {
                window.purchasedItemsCount = {};
            }
            window.purchasedItemsCount[item.id] = (window.purchasedItemsCount[item.id] || 0) + 1;
            updateData.purchasedItemsCount = window.purchasedItemsCount;
            localStorage.setItem('purchasedItemsCount_' + window.currentPlayer.id, JSON.stringify(window.purchasedItemsCount));
            
            showToast('✅ Куплено: ' + (item.name || '') + '!', 'success');
            
        // ============================================================
        // ОБРАБОТКА РАСХОДНИКОВ
        // ============================================================
        } else if (item.type === 'consumable') {
            if (item.resourceType) {
                if (item.resourceType === 'cigarettes') {
                    window.currentPlayer.cigarettes += item.amount || 0;
                    updateData.cigarettes = window.currentPlayer.cigarettes;
                } else if (item.resourceType === 'rubles') {
                    window.currentPlayer.rubles += item.amount || 0;
                    updateData.rubles = window.currentPlayer.rubles;
                } else if (item.resourceType === 'paper') {
                    if (!window.currentPlayer.mine) window.currentPlayer.mine = { paper: 0 };
                    window.currentPlayer.mine.paper += item.amount || 0;
                    updateData.mine = window.currentPlayer.mine;
                } else if (item.resourceType === 'makhorka') {
                    if (!window.currentPlayer.mine) window.currentPlayer.mine = { makhorka: 0 };
                    window.currentPlayer.mine.makhorka += item.amount || 0;
                    updateData.mine = window.currentPlayer.mine;
                } else if (item.resourceType === 'wood') {
                    if (!window.currentPlayer.lumber) window.currentPlayer.lumber = { wood: 0 };
                    window.currentPlayer.lumber.wood += item.amount || 0;
                    updateData.lumber = window.currentPlayer.lumber;
                } else if (item.resourceType === 'stone') {
                    if (!window.currentPlayer.quarry) window.currentPlayer.quarry = { stone: 0 };
                    window.currentPlayer.quarry.stone += item.amount || 0;
                    updateData.quarry = window.currentPlayer.quarry;
                }
            }
            showToast('✅ Использовано: ' + (item.name || '') + '!', 'success');
        }
        
        // ============================================================
        // ✅ СОХРАНЯЕМ В БАЗУ ДАННЫХ
        // ============================================================
        console.log('📝 Сохраняем в БД:', updateData);
        await dbUpdate('players/' + window.playerId, updateData);
        
        showLoading(false);
        
        // ============================================================
        // ✅ ОБНОВЛЯЕМ ОТОБРАЖЕНИЕ
        // ============================================================
        renderShopItemsContent();
        updateResources();
        
        var inventoryModal = document.getElementById('inventoryFullscreen');
        if (inventoryModal) {
            closeInventoryModal();
            setTimeout(function() { 
                openInventoryModal(); 
            }, 300);
        }
        
        if (item.type === 'tattoo') {
            showToast('💉 Наколка "' + (item.name || '') + '" добавлена в камеру!', 'success');
            setTimeout(function() {
                renderShopItemsContent();
            }, 500);
        }
        
    } catch (e) {
        showLoading(false);
        showToast('❌ Ошибка покупки: ' + e.message, 'error');
        console.error('❌ Ошибка покупки:', e);
    }
};

window.buyAvatarFromShop = async function(avatarId) {
    if (!window.currentPlayer) {
        showToast('❌ Игрок не найден!', 'error');
        return;
    }
    if (isAvatarPurchased(avatarId)) {
        showToast('✅ Этот аватар уже куплен!', 'warning');
        return;
    }
    var price = getAvatarPrice(avatarId);
    var rubles = window.currentPlayer.rubles || 0;
    var avatarName = getAvatarName(avatarId);
    if (rubles < price) {
        var missing = price - rubles;
        showToast('❌ Недостаточно средств! У вас: ' + rubles + '💰, не хватает: ' + missing + '💰', 'error');
        return;
    }
    if (!confirm('Купить аватар "' + avatarName + '" за ' + price + '💰?')) { return; }
    try {
        showLoading(true, 'Покупка аватара...');
        var newRubles = rubles - price;
        var purchased = window.currentPlayer.purchasedAvatars || [];
        if (!purchased.includes(avatarId)) purchased.push(avatarId);
        var updateData = { rubles: newRubles, purchasedAvatars: purchased, currentAvatar: avatarId };
        await dbUpdate('players/' + window.playerId, updateData);
        window.currentPlayer.rubles = newRubles;
        window.currentPlayer.purchasedAvatars = purchased;
        window.currentPlayer.currentAvatar = avatarId;
        updateAvatarEverywhere();
        closeModal('avatarShopModal');
        closeModal('profileModal');
        showToast('✅ Куплен и установлен аватар "' + avatarName + '" за ' + price + '💰!', 'success');
        showLoading(false);
        updateResources();
        setTimeout(function() { openProfileModal(); }, 300);
    } catch (e) {
        showLoading(false);
        showToast('❌ Ошибка покупки: ' + e.message, 'error');
        console.error('Ошибка покупки аватара:', e);
    }
};

function updateShopResources() {
    if (!window.currentPlayer) return;
    var cigValue = document.getElementById('shopCigarettesValue');
    var rublesValue = document.getElementById('shopRublesValue');
    var woodValue = document.getElementById('shopWoodValue');
    var stoneValue = document.getElementById('shopStoneValue');
    if (cigValue) cigValue.textContent = formatNumberShort(window.currentPlayer.cigarettes || 0);
    if (rublesValue) rublesValue.textContent = formatNumberShort(window.currentPlayer.rubles || 0);
    if (woodValue) woodValue.textContent = formatNumberShort(window.currentPlayer.lumber?.wood || 0);
    if (stoneValue) stoneValue.textContent = formatNumberShort(window.currentPlayer.quarry?.stone || 0);
}

function canBuyItem(item) {
    if (!window.currentPlayer || !item) return false;
    if (item.type === 'tattoo') {
        var hasTattoo = window.currentPlayer.tattoos?.some(function(t) { return t && t.name === item.name; });
        if (hasTattoo) return false;
    }
    if (item.currency === 'rubles' && window.currentPlayer.rubles < item.price) return false;
    if (item.currency === 'cigarettes' && window.currentPlayer.cigarettes < item.price) return false;
    if (item.type === 'equipment') {
        var isPurchased = (window.purchasedItemsCount || {})[item.id] > 0;
        if (isPurchased) return false;
    }
    return true;
}

function getItemById(itemId) {
    var shopItems = getShopItemsFromAdmin();
    for (var i = 0; i < shopItems.length; i++) {
        if (shopItems[i].id === itemId) {
            return shopItems[i];
        }
    }
    return null;
}

function getPurchasedCount(itemId) {
    return (window.purchasedItemsCount || {})[itemId] || 0;
}

function clearPurchasedItems() {
    if (!window.currentPlayer) return;
    if (confirm('Очистить все купленные предметы?')) {
        window.purchasedItemsCount = {};
        localStorage.removeItem('purchasedItemsCount_' + window.currentPlayer.id);
        localStorage.removeItem('tattoos_' + window.currentPlayer.id);
        localStorage.removeItem('purchasedEquipment_' + window.currentPlayer.id);
        window.currentPlayer.tattoos = [];
        window.currentPlayer.purchasedEquipment = [];
        showToast('✅ Купленные предметы очищены', 'success');
        renderShopItemsContent();
    }
}

        try {
            await dbUpdate('players/' + window.playerId, {
                shopLevel: 1,

                shopUpgradeDuration: 0
            });

            window.shopUpgradeStartTime = 0;

function getShopStats() {
    var stats = {
        level: window.shopLevel || 1,
        itemsTotal: window.adminShopItems ? window.adminShopItems.length : 0,
        itemsPurchased: Object.keys(window.purchasedItemsCount || {}).length,
        tattoosCount: window.currentPlayer?.tattoos?.length || 0,
        isUpgrading: isShopUpgradeActive(),
        upgradeRemaining: getShopUpgradeRemaining()
    };
    var categories = {};
    if (window.adminShopItems) {
        for (var i = 0; i < window.adminShopItems.length; i++) {
            var item = window.adminShopItems[i];
            if (item && item.category) {
                if (!categories[item.category]) categories[item.category] = 0;
                categories[item.category]++;
            }
        }
    }
    stats.categories = categories;
    return stats;
}

function showShopStats() {
    var stats = getShopStats();
    console.log('📊 СТАТИСТИКА МАГАЗИНА:');
    console.log('  📈 Уровень магазина:', stats.level);
    console.log('  📦 Всего товаров:', stats.itemsTotal);
    console.log('  🛒 Куплено предметов:', stats.itemsPurchased);
    console.log('  💉 Наколок:', stats.tattoosCount);
    console.log('  ⏳ Прокачка активна:', stats.isUpgrading);
    if (stats.isUpgrading) {
        console.log('  ⏱️ Осталось до завершения:', formatTimerMinutes(stats.upgradeRemaining));
    }
    console.log('  📂 Категории:', stats.categories);
}

async function syncTattoos() {
    if (!window.currentPlayer || !window.playerId) {
        showToast('❌ Нет игрока!', 'error');
        return;
    }
    
    console.log('💉 Синхронизация наколок...');
    
    try {
        // Загружаем из БД
        var snapshot = await db.ref('players/' + window.playerId + '/tattoos').once('value');
        
        if (snapshot.exists()) {
            var dbTattoos = snapshot.val();
            if (dbTattoos && Array.isArray(dbTattoos) && dbTattoos.length > 0) {
                window.currentPlayer.tattoos = dbTattoos;
                localStorage.setItem('tattoos_' + window.currentPlayer.id, JSON.stringify(dbTattoos));
                console.log('💉 Наколки синхронизированы из БД:', dbTattoos.length);
                
                renderShopItemsContent();
                showToast('✅ Наколки синхронизированы!', 'success');
                return true;
            }
        }
        
        // Если в БД пусто, проверяем localStorage
        try {
            var saved = localStorage.getItem('tattoos_' + window.currentPlayer.id);
            if (saved) {
                var parsed = JSON.parse(saved);
                if (parsed && Array.isArray(parsed) && parsed.length > 0) {
                    window.currentPlayer.tattoos = parsed;
                    await dbUpdate('players/' + window.playerId, { tattoos: parsed });
                    console.log('💉 Наколки сохранены в БД из localStorage:', parsed.length);
                    renderShopItemsContent();
                    showToast('✅ Наколки синхронизированы!', 'success');
                    return true;
                }
            }
        } catch(e) {}
        
        showToast('ℹ️ Нет сохранённых наколок', 'info');
        return false;
        
    } catch(e) {
        console.error('❌ Ошибка синхронизации наколок:', e);
        showToast('❌ Ошибка синхронизации: ' + e.message, 'error');
        return false;
    }
}

function formatTimeDetailedWithSeconds(ms) {
    if (ms <= 0) return "0:00";
    var totalSeconds = Math.floor(ms / 1000);
    var hours = Math.floor(totalSeconds / 3600);
    var minutes = Math.floor((totalSeconds % 3600) / 60);
    var seconds = totalSeconds % 60;
    if (hours > 0) {
        return hours + ':' + String(minutes).padStart(2, '0') + ':' + String(seconds).padStart(2, '0');
    }
    return String(minutes) + ':' + String(seconds).padStart(2, '0');
}

// Форматирование времени (минуты/секунды) для таймеров
function formatTimerMinutes(ms) {
    if (ms <= 0) return "Готово!";
    var totalSeconds = Math.floor(ms / 1000);
    var minutes = Math.floor(totalSeconds / 60);
    var seconds = totalSeconds % 60;
    if (minutes > 0) {
        return minutes + ' мин ' + seconds + ' сек';
    }
    return seconds + ' сек';
}

// Форматирование времени подробное (для кулдаунов)
function formatTimeDetailed(ms) {
    if (ms <= 0) return "0:00";
    var totalSeconds = Math.floor(ms / 1000);
    var hours = Math.floor(totalSeconds / 3600);
    var minutes = Math.floor((totalSeconds % 3600) / 60);
    var seconds = totalSeconds % 60;
    if (totalSeconds < 60) return seconds + ' сек';
    if (hours === 0) return minutes + ' мин ' + seconds + ' сек';
    return hours + ' ч ' + minutes + ' мин';
}

// Форматирование времени для игр (MM:SS)
function formatGameTime(ms) {
    if (ms <= 0) return "00:00";
    var totalSeconds = Math.floor(ms / 1000);
    var minutes = Math.floor(totalSeconds / 60);
    var seconds = totalSeconds % 60;
    return String(minutes).padStart(2, '0') + ':' + String(seconds).padStart(2, '0');
}

// Форматирование времени для боя
function formatBattleTime(ms) {
    if (ms <= 0) return "00:00";
    var totalSeconds = Math.floor(ms / 1000);
    var minutes = Math.floor(totalSeconds / 60);
    var seconds = totalSeconds % 60;
    return String(minutes).padStart(2, '0') + ':' + String(seconds).padStart(2, '0');

// Форматирование кулдауна
function formatCooldownTime(ms) {

        async function withRetry(fn, context = 'операция', maxRetries = MAX_RETRIES) {
            let lastError = null;
            for (let attempt = 1; attempt <= maxRetries; attempt++) {
                try {
                    if (isOffline) {
                        await new Promise(r => setTimeout(r, 1000));
                        continue;
                    }
                    const result = await fn();
                    retryCount = 0;
                    return result;
                } catch (error) {
                    lastError = error;
                    console.warn(`⚠️ Попытка ${attempt}/${maxRetries} для "${context}" не удалась:`, error);
                    if (attempt < maxRetries) {
                        const delay = RETRY_DELAY * attempt;
                        showToast(`⏳ Повторная попытка... (${attempt}/${maxRetries})`, 'warning');
                        await new Promise(r => setTimeout(r, delay));
                    }
                }
            }
            const msg = `❌ Не удалось выполнить "${context}" после ${maxRetries} попыток`;
            showToast(msg, 'error');
            console.error(msg, lastError);
            throw lastError;
        }

        function dbRef(path) {
            return db.ref(path);
        }

        async function dbOnce(path) {
            return withRetry(async () => {
                const snapshot = await dbRef(path).once('value');
                return snapshot;
            }, `чтение ${path}`);
        }

        async function dbSet(path, data) {
            return withRetry(async () => {
                await dbRef(path).set(data);
                return true;
            }, `запись ${path}`);
        }

        async function dbUpdate(path, data) {
            return withRetry(async () => {
                await dbRef(path).update(data);
                return true;
            }, `обновление ${path}`);
        }

        async function dbRemove(path) {
            return withRetry(async () => {
                await dbRef(path).remove();
                return true;
            }, `удаление ${path}`);
        }

        function dbOn(path, callback) {
            const ref = dbRef(path);
            ref.on('value', (snapshot) => {
                if (isOffline) return;
                try {
                    callback(snapshot);
                } catch (e) {
                    console.error('Ошибка в слушателе:', e);
                }
            }, (error) => {
                console.warn('⚠️ Ошибка слушателя:', error);
                setTimeout(() => {
                    if (!isOffline) {
                        console.log('🔄 Переподключение слушателя...');
                        ref.off();
                        dbOn(path, callback);
                    }
                }, 5000);
            });
            return () => ref.off();
        }

                        window.playerId = savedId;
                        window.currentPlayer = player;
                        document.getElementById('authScreen').classList.add('hidden');
                        showLoading(false);
                        
                        setTimeout(function() {
                            startGame();
                        }, 200);
                        
                        return true;
                    }
                } catch (e) {
                    console.error('❌ Ошибка автовхода:', e);
                }
                showLoading(false);
            }

            if (checkTelegramWebApp()) {
                var tgUser = getTelegramUser();
                if (tgUser) {
                    var result = await loginWithTelegram();
                    if (result) return true;
                }
            }

            document.getElementById('authScreen').classList.remove('hidden');
            showLoading(false);
            return false;
        }

        document.addEventListener('DOMContentLoaded', function() {

            var loginBtn = document.getElementById('loginBtn');
            if (loginBtn) {
                loginBtn.addEventListener('click', async function() {
                    var username = document.getElementById('loginUsername').value.trim();
                    var errorEl = document.getElementById('authError');

                    if (!username || !/^[a-zA-Z0-9]{3,10}$/.test(username)) {

                            if (result.error === 'not_found') {
                                errorEl.textContent = '❌ Игрок не найден!';
                            } else if (result.error === 'banned') {

                        showLoading(false);

                        this.disabled = false;
                        this.textContent = 'Войти';
                        showLoading(false);
                    }
                });
            }
            
            var registerBtn = document.getElementById('registerBtn');
            if (registerBtn) {
                registerBtn.addEventListener('click', async function() {
                    var username = document.getElementById('regUsername').value.trim();
                    var errorEl = document.getElementById('regError');

                    if (!username || !/^[a-zA-Z0-9]{3,10}$/.test(username)) {
                        errorEl.textContent = '⚠️ Ник должен содержать 3-10 латинских букв или цифр';
                        errorEl.className = 'auth-error show';
                        return;
                    }

                    this.disabled = true;
                    this.textContent = '⏳ Создание...';
                    errorEl.className = 'auth-error';
                    showLoading(true, 'Создание аккаунта...');

                    try {
                        var success = await registerUser(username);
                        
                        if (!success) {
                            errorEl.textContent = '❌ Игрок с таким ником уже существует!';
                            errorEl.className = 'auth-error show';
                            this.disabled = false;
                            this.textContent = 'Создать аккаунт';
                            showLoading(false);
                            return;
                        }

                        showLoading(false);
                        document.getElementById('authScreen').classList.add('hidden');
                        this.disabled = false;
                        this.textContent = 'Создать аккаунт';
                        
                        showToast('🎉 Аккаунт создан! Добро пожаловать, ' + username + '!', 'success');
                        
                        setTimeout(function() {
                            startGame();
                        }, 100);

                    } catch (error) {
                        console.error('❌ Ошибка регистрации:', error);
                        errorEl.textContent = '❌ Ошибка регистрации: ' + error.message;
                        errorEl.className = 'auth-error show';
                        this.disabled = false;
                        this.textContent = 'Создать аккаунт';
                        showLoading(false);
                    }
                });
            }
            
            var showRegister = document.getElementById('showRegister');
            if (showRegister) {
                showRegister.addEventListener('click', function() {
                    document.getElementById('loginForm').style.display = 'none';
                    document.getElementById('registerForm').style.display = 'block';
                    document.getElementById('authError').className = 'auth-error';
                    document.getElementById('authError').textContent = '';
                });
            }
            
            var showLogin = document.getElementById('showLogin');
            if (showLogin) {
                showLogin.addEventListener('click', function() {
                    document.getElementById('loginForm').style.display = 'block';
                    document.getElementById('registerForm').style.display = 'none';
                    document.getElementById('regError').className = 'auth-error';
                    document.getElementById('regError').textContent = '';
                });
            }
            
            setTimeout(function() {
                autoLogin();
            }, 300);
        });

        // ============================================================
        function updateResources() {
            if (!window.currentPlayer) {
                console.warn('⚠️ updateResources: нет данных игрока');
                return;
            }
            
            var els = {
                resCigarettes: window.currentPlayer.cigarettes || 0,
                resRubles: window.currentPlayer.rubles || 0,
                resAuthority: window.currentPlayer.authority || 0,
                resEnergy: (window.currentPlayer.energy || 0) + '/' + (window.currentPlayer.maxEnergy || 100),
                resPaper: window.currentPlayer.mine?.paper || 0,
                resMakhorka: window.currentPlayer.mine?.makhorka || 0,
                resWood: window.currentPlayer.lumber?.wood || 0,
                resStone: window.currentPlayer.quarry?.stone || 0
            };
            
            for (var id in els) {
                var el = document.getElementById(id);
                if (el) {
                    el.textContent = typeof els[id] === 'string' ? els[id] : formatNumberShort(els[id]);
                }
            }
        }

        // ============================================================
        // 11. ПОДПИСКА НА ИЗМЕНЕНИЯ
        // ============================================================
        function subscribeToPlayer() {
            if (!window.playerId) return;
            if (unsubscribePlayer) unsubscribePlayer();
            
            var ref = db.ref('players/' + window.playerId);
            ref.on('value', function(snapshot) {
                if (snapshot.exists()) {
                    var data = snapshot.val();
                    var oldId = window.currentPlayer?.id;
                    window.currentPlayer = { id: oldId || window.playerId, ...data };
                    updateResources();
                }
            });
        }

        // ============================================================
        // 12. ВОССТАНОВЛЕНИЕ ЭНЕРГИИ
        // ============================================================
        function restoreEnergy() {
            if (window._energyInterval) {
                clearInterval(window._energyInterval);
            }
            
            window._energyInterval = setInterval(function() {
                if (window.currentPlayer && window.currentPlayer.energy < window.currentPlayer.maxEnergy) {
                    var newEnergy = Math.min(window.currentPlayer.maxEnergy, (window.currentPlayer.energy || 0) + 1);
                    db.ref('players/' + window.playerId + '/energy').set(newEnergy);
                    window.currentPlayer.energy = newEnergy;
                    updateResources();
                }
            }, 60000);
        }

function getChatAvatarUrl() {
    if (!window.currentPlayer) {
        return 'https://cdn-icons-png.flaticon.com/512/3135/3135715.png';
    }
    
    // Если есть функция getAvatarUrl из блока профиля
    if (typeof getAvatarUrl === 'function') {
        return getAvatarUrl(window.currentPlayer.currentAvatar);
    }
    
    // Если есть AVAATARS
    if (window.AVAATARS && window.AVAATARS.length > 0) {
        var avatarId = window.currentPlayer.currentAvatar || 1;
        var avatar = window.AVAATARS.find(function(a) { return a.id === avatarId; });
        return avatar ? avatar.url : window.AVAATARS[0].url;
    }
    
    return 'https://cdn-icons-png.flaticon.com/512/3135/3135715.png';
}
