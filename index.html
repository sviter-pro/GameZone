    function startTreatmentTimer() {
        const timerInterval = setInterval(() => {
            const modal = document.getElementById('hospitalFullscreen');
            if (!modal || !currentPlayer.treatmentEndTime || currentPlayer.treatmentEndTime <= Date.now()) {
                clearInterval(timerInterval);
                if (modal) openHospitalModal();
                return;
            }
            const timerEl = document.getElementById('treatmentTimer');
            if (timerEl) {
                const remaining = Math.max(0, currentPlayer.treatmentEndTime - Date.now());
                timerEl.textContent = `⏱️ Осталось: ${Math.ceil(remaining / 60000)} мин`;
            }
        }, 1000);
    }
    
    async function treatInjured() {
        if (maintenanceMode) { showToast(maintenanceMessage, 'warning'); return; }
        const injured = currentPlayer.injuredFighters || 0;
        if (injured === 0) { showToast('Нет раненых!', 'warning'); return; }
        const cost = injured * 10;
        if (currentPlayer.cigarettes < cost) { showToast(`Не хватает ${cost - currentPlayer.cigarettes} 🚬!`, 'error'); return; }
        
        await playerDocRef.update({
            cigarettes: firebase.firestore.FieldValue.increment(-cost),
            injuredFighters: 0,
            treatmentEndTime: Date.now() + (injured * 60 * 1000)
        });
        currentPlayer.cigarettes -= cost;
        currentPlayer.injuredFighters = 0;
        currentPlayer.treatmentEndTime = Date.now() + (injured * 60 * 1000);
        
        showToast(`💊 Лечение началось! Через ${injured} мин бойцы вернутся в строй.`, 'success');
        startTreatmentTimer();
        setTimeout(() => {
            if (currentPlayer) {
                showToast('🏥 Лечение завершено! Бойцы здоровы!', 'success');
                renderUI();
            }
        }, injured * 60 * 1000);
        closeHospitalModal();
        renderUI();
    }

        const modal = document.getElementById('hospitalFullscreen');
        if (modal) modal.remove();
        if (tg) tg.BackButton.hide();

    function formatTimeDetailed(ms) {
        if (ms <= 0) return "0:00";
        const totalSeconds = Math.floor(ms / 1000);
        const hours = Math.floor(totalSeconds / 3600);
        const minutes = Math.floor((totalSeconds % 3600) / 60);
        const seconds = totalSeconds % 60;
        if (totalSeconds < 60) return `${seconds} сек`;
        if (hours === 0) return `${minutes} мин ${seconds} сек`;
        return `${hours} ч ${minutes} мин`;
    }
    function formatMineTime(ms) {
        if (ms <= 0) return "Готово!";
        const totalSeconds = Math.floor(ms / 1000);
        const hours = Math.floor(totalSeconds / 3600);
        const minutes = Math.floor((totalSeconds % 3600) / 60);
        const seconds = totalSeconds % 60;
        if (hours > 0) return `${hours}ч ${minutes}м`;
        if (minutes > 0) return `${minutes}м ${seconds}с`;
        return `${seconds}с`;
    }
    function calculatePlayerPower(player) {
        let gangPower = 0;
        if (player.gang) {
            gangPower += (player.gang.blats?.fighters || 0) * 2;
            gangPower += (player.gang.muzhiks?.fighters || 0) * 1;
            gangPower += (player.gang.fraers?.fighters || 0) * 1;
        }
        return Math.floor((player.level * 15) + (player.authority / 100) + ((player.stats?.strength || 10) * 2) + ((player.stats?.defense || 5) * 1.5) + (player.stats?.critical || 5) + (player.energy / 20) + gangPower);
    }
    function getMineCooldownHours(level) { return 1 + (level * 0.1667); }
    function getGatherCooldownHours(level) { return 1 + (level * 0.1667); }
    function getExchangeRate(level, type) { return type === 'paper' ? 2 + Math.floor(level / 5) : 1 + Math.floor(level / 10); }

    async function loginWithTelegram() {
        if (!tgUser || !db) return false;
        try {
            showLoadingScreen();
            const telegramId = tgUser.id.toString();
            let username = tgUser.username || tgUser.first_name || `user_${telegramId}`;
            
            // Проверяем реферальный код из URL
            const urlParams = new URLSearchParams(window.location.search);
            const refCode = urlParams.get('ref');
            let inviterId = null;
            let inviterName = null;
            
            if (refCode) {
                const inviterSnapshot = await db.collection('players').where('inviteCode', '==', refCode).get();
                if (!inviterSnapshot.empty) {
                    inviterId = inviterSnapshot.docs[0].id;
                    inviterName = inviterSnapshot.docs[0].data().username;
                }
            }
            
            const snapshot = await db.collection('players').where('telegramId', '==', telegramId).get();
            
            if (!snapshot.empty) {
                const doc = snapshot.docs[0];
                const player = { id: doc.id, ...doc.data() };
                if (player.isBanned) {
                    alert('Аккаунт забанен');
                    hideLoadingScreen();
                    return false;
                }
                localStorage.setItem('playerId', player.id);
                localStorage.setItem('username', player.username);
                await startGame(player.id, player.username);
                return true;
            } else {
                let finalUsername = username.replace(/[^a-zA-Z0-9]/g, '').substring(0, 10);
                if (finalUsername.length < 3) finalUsername = `user${telegramId.substring(0, 5)}`;
                
                const existing = await db.collection('players').where('username', '==', finalUsername).get();
                if (!existing.empty) {
                    finalUsername = `${finalUsername}_${telegramId.substring(0, 3)}`;
                }
                
                const castes = ['Блатные', 'Мужики', 'Фраер'];
                const randomCaste = castes[Math.floor(Math.random() * castes.length)];
                
                const playerData = getDefaultPlayer(finalUsername, randomCaste);
                playerData.telegramId = telegramId;
                playerData.telegramName = tgUser.first_name || '';
                playerData.lumber = { level: 1, lastGatherTime: 0, wood: 0, upgradeStartTime: 0, upgradeDuration: 0 };
                playerData.quarry = { level: 1, lastGatherTime: 0, stone: 0, upgradeStartTime: 0, upgradeDuration: 0 };
                playerData.mine = { paperLevel: 1, makhorkaLevel: 1, lastMineTime: 0, paper: 0, makhorka: 0, paperUpgradeStartTime: 0, paperUpgradeDuration: 0, makhorkaUpgradeStartTime: 0, makhorkaUpgradeDuration: 0 };
                playerData.injuredFighters = 0;
                playerData.gymLevel = 1;
                playerData.gymActive = false;
                playerData.gymStartTime = 0;
                playerData.gymCooldownUntil = 0;
                playerData.cardGameUpgradeStartTime = 0;
                playerData.cardGameUpgradeDuration = 0;
                playerData.gymUpgradeStartTime = 0;
                playerData.gymUpgradeDuration = 0;
                playerData.hasHadWar = false;
                playerData.shopLevel = 1;
                playerData.shopUpgradeStartTime = 0;
                playerData.shopUpgradeDuration = 0;
                
                const docRef = await db.collection('players').add(playerData);
                
                // Награда пригласившему
                if (inviterId && inviterName) {
                    const inviterRef = db.collection('players').doc(inviterId);
                    await inviterRef.update({
                        cigarettes: firebase.firestore.FieldValue.increment(500),
                        rubles: firebase.firestore.FieldValue.increment(250),
                        invitedPlayers: firebase.firestore.FieldValue.arrayUnion(finalUsername)
                    });
                    showToast(`🎉 Вы пришли по реферальной ссылке от ${inviterName}!`, 'success');
                }
                
                localStorage.setItem('playerId', docRef.id);
                localStorage.setItem('username', finalUsername);
                await startGame(docRef.id, finalUsername);
                return true;
            }
        } catch(e) { hideLoadingScreen(); showToast('Ошибка входа: ' + e.message, 'error'); return false; }
    }

        const quarry = currentPlayer.quarry || { level: 1, lastGatherTime: 0, stone: 0, upgradeStartTime: 0, upgradeDuration: 0 };
        
        const isWorkActive = (type) => {
            let lastTime, cooldownMs;
            if (type === 'mine') {
                lastTime = mineData.lastMineTime || 0;
                cooldownMs = 2 * 60 * 1000;
                cooldownMs = Math.floor(cooldownMs * (1 + (mineData.paperLevel - 1) * 0.05));
            } else if (type === 'lumber') {
                lastTime = lumber.lastGatherTime || 0;
                cooldownMs = 2 * 60 * 1000;
                cooldownMs = Math.floor(cooldownMs * (1 + (lumber.level - 1) * 0.05));
            } else {
                lastTime = quarry.lastGatherTime || 0;
                cooldownMs = 2 * 60 * 1000;
                cooldownMs = Math.floor(cooldownMs * (1 + (quarry.level - 1) * 0.05));
            }
            return (Date.now() - lastTime) < cooldownMs;
        };
        
        const getWorkRemainingSec = (type) => {

                lastTime = mineData.lastMineTime || 0;
                cooldownMs = 2 * 60 * 1000;
                cooldownMs = Math.floor(cooldownMs * (1 + (mineData.paperLevel - 1) * 0.05));
