<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Зона 1.0.0.186 - Карта зоны</title>
    <!-- Telegram WebApp Script -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #0a0e1a;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', system-ui, sans-serif;
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 20px 0px;
            padding-top: 110px;
            padding-bottom: 85px;
            overflow-x: hidden;
            overflow-y: auto;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }

            100% {
                transform: scale(1);
            }
        }

        @keyframes logoPulse {
            0% {
                transform: scale(0.95);
                opacity: 0.8;
            }

            50% {
                transform: scale(1.05);
                opacity: 1;
            }

            100% {
                transform: scale(0.95);
                opacity: 0.8;
            }
        }

        @keyframes btnGlow {
            0% {
                box-shadow: 0 0 0 0 rgba(233, 69, 96, 0.4);
            }

            70% {
                box-shadow: 0 0 0 8px rgba(233, 69, 96, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(233, 69, 96, 0);
            }
        }

        ::-webkit-scrollbar {
            width: 4px;
        }

        ::-webkit-scrollbar-track {
            background: #1a1a2e;
        }

        ::-webkit-scrollbar-thumb {
            background: #e94560;
            border-radius: 4px;
        }

        /* НОВЫЙ ЭКРАН ЗАГРУЗКИ С ЛОГОТИПОМ */
        .loading-screen-new {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #0a0e1a;
            background-image: radial-gradient(circle at 25% 40%, rgba(233, 69, 96, 0.15) 0%, rgba(10, 14, 26, 0.95) 90%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            backdrop-filter: blur(4px);
        }

        .loading-logo {
            width: 180px;
            height: auto;
            margin-bottom: 30px;
            animation: logoPulse 1.8s ease-in-out infinite;
            filter: drop-shadow(0 0 20px rgba(233, 69, 96, 0.5));
        }

        .loading-spinner-new {
            width: 48px;
            height: 48px;
            border: 3px solid rgba(233, 69, 96, 0.25);
            border-top-color: #e94560;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 24px;
        }

        .loading-tip-new {
            background: rgba(26, 26, 46, 0.9);
            backdrop-filter: blur(12px);
            padding: 14px 24px;
            border-radius: 60px;
            max-width: 320px;
            text-align: center;
            font-size: 14px;
            color: #ffd93d;
            border: 1px solid rgba(233, 69, 96, 0.4);
            font-weight: 500;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.3);
        }

        .loading-version {
            position: absolute;
            bottom: 30px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 1px;
        }

        /* ========== НЕПОДВИЖНАЯ ВЕРХНЯЯ ПАНЕЛЬ ========== */
        .fixed-top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(10, 14, 26, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(233, 69, 96, 0.3);
            padding: 10px 16px;
        }

        .top-bar-content {
            max-width: 412px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 3px;
        }

        .left-profile {
            flex-shrink: 0;
        }

        .caste-info {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 60px;
            cursor: pointer;
            transition: 0.1s;
            background: rgba(30, 36, 64, 0.6);
            border-radius: 40px;
            padding: 4px 10px;
        }

        .caste-info:active {
            transform: scale(0.96);
        }

        .caste-icon {
            font-size: 24px;
        }

        .caste-level {
            font-size: 9px;
            color: #aaa;
            margin-top: 2px;
        }

        .resources-column {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .resources-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .resource-item {
            background: rgba(30, 36, 64, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 40px;
            padding: 4px 10px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 600;
            border: 1px solid rgba(233, 69, 96, 0.2);
            white-space: nowrap;
        }

        .resource-item span:first-child {
            font-size: 14px;
        }

        .settings-btn {
            background: rgba(30, 36, 64, 0.8);
            border: none;
            padding: 6px 12px;
            border-radius: 40px;
            font-size: 20px;
            cursor: pointer;
            color: white;
            backdrop-filter: blur(10px);
            transition: 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .settings-btn:active {
            transform: scale(0.96);
            background: rgba(233, 69, 96, 0.3);
        }

        /* ========== НЕПОДВИЖНАЯ НИЖНЯЯ ПАНЕЛЬ ========== */
        .fixed-bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(10, 14, 26, 0.95);
            backdrop-filter: blur(16px);
            border-top: 1px solid rgba(233, 69, 96, 0.3);
            padding: 5px 0;
            /* ← 5мм сверху и снизу */
            padding-bottom: max(5px, env(safe-area-inset-bottom));
        }

        .bottom-nav {
            max-width: 500px;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            /* ← центр */
            align-items: center;
            gap: 16px;
            /* ← промежуток между кнопками */
        }

        .nav-btn img {
            width: 55px;
            /* ← чуть уменьшил для компактности */
            height: auto;
            max-height: 70px;
            object-fit: contain;
            display: block;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            pointer-events: auto;
            transition: opacity 0.3s ease;
            opacity: 1;
        }

        .nav-btn img[src=""] {
            opacity: 0;
        }

        .nav-btn {
            background: transparent;
            border: none;
            border-radius: 16px;
            /* ← скругление под размер */
            padding: 6px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            color: #8e8ea0;
            font-size: 12px;
            font-weight: 500;
            min-width: auto;
            /* ← убираем фикс. ширину */
            position: relative;
        }

        .nav-btn span:first-child {
            font-size: 24px;
            transition: transform 0.2s;
        }

        .nav-btn span:last-child {
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .nav-btn.active {
            background: rgba(233, 69, 96, 0.15);
            /* ← полупрозрачный фон */
            border: 2px solid rgba(233, 69, 96, 0.8);
            box-shadow: 0 0 12px rgba(233, 69, 96, 0.5);
            transform: scale(1.02);
        }

        .nav-btn.active span:first-child {
            transform: scale(1.1);
            text-shadow: 0 0 8px rgba(233, 69, 96, 0.8);
        }

        .nav-btn:active {
            outline: none;
            transform: scale(0.94);
            background: rgba(233, 69, 96, 0.25);
        }

        .nav-btn.active img {
            filter: drop-shadow(0 0 8px rgba(233, 69, 96, 0.6));
        }

        /* Текст кнопок делаем невидимым, но оставляем для доступности */
        .nav-btn span:last-child {
            display: none;
        }

        .game-container {
            max-width: 412px;
            width: 412px;
            min-width: auto;
            margin: 0 auto;
            padding: 0;
            position: relative;
        }

        /* ========== СТИЛИ КАРТЫ ========== */
        .map-wrapper {
            position: relative;
            width: 100%;
            max-width: 100%;
            margin: 0 auto;
            margin-top: -30px;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
        }

        .map-image {
            width: 100%;
            height: auto;
            display: block;
            pointer-events: none;
            user-select: none;
            max-width: 100%;
        }

        .building {
            position: absolute;
            border: 2px solid transparent;
            border-radius: 18px;
            cursor: pointer;
            transition: 0.25s;
            /*background: rgba(0,0,0,0.3);*/
        }

        .building:hover {
            background: rgba(255, 180, 70, 0.2);
            border-color: rgba(255, 180, 70, 0.4);
        }

        .building.active {
            border: 3px solid #ffb347;
            box-shadow: 0 0 25px rgba(255, 180, 70, 0.9), inset 0 0 25px rgba(255, 180, 70, 0.3);
            background: rgba(255, 180, 70, 0.2);
        }

        .building-label {
            position: absolute;
            left: 50%;
            top: -36px;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9);
            border: 1px solid #ffb347;
            color: #ffcf7a;
            padding: 6px 12px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: bold;
            opacity: 0;
            pointer-events: none;
            transition: 0.25s;
            white-space: nowrap;
            box-shadow: 0 0 20px rgba(255, 180, 70, 0.5);
            z-index: 100;
        }

        /* Стили для счетчиков на здании РАБОТА (b2) */
        .b2 {
            position: absolute;
            top: 18%;
            left: 3%;
            width: 38%;
            height: 18%;
            overflow: visible !important;
        }

        .b2 .counters-container-work {
            position: absolute;
            top: 4px;
            left: 4px;
            right: 4px;
            display: flex;
            flex-direction: column;
            gap: 3px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(6px);
            padding: 4px 6px;
            border-radius: 12px;
            z-index: 102;
            pointer-events: none;
            font-size: 9px;
            font-weight: bold;
            border: 1px solid rgba(255, 255, 255, 0.25);
            text-align: center;
        }

        .work-counter {
            color: #4caf50;
            text-shadow: 0 0 3px #4caf50;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            font-size: 9px;
            white-space: nowrap;
        }

        .upgrade-work-counter {
            color: #e94560;
            text-shadow: 0 0 3px #e94560;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            font-size: 9px;
            white-space: nowrap;
        }

        /* Стили для счетчиков на здании СИЗО (b7) */
        .b7 {
            position: absolute;
            top: 72%;
            left: 28%;
            width: 43%;
            height: 16%;
            overflow: visible !important;
        }

        .b7 .counters-container {
            position: absolute;
            top: 4px;
            left: 4px;
            right: 4px;
            display: flex;
            flex-direction: column;
            gap: 3px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(6px);
            padding: 4px 6px;
            border-radius: 12px;
            z-index: 102;
            pointer-events: none;
            font-size: 9px;
            font-weight: bold;
            border: 1px solid rgba(255, 255, 255, 0.25);
            text-align: center;
        }

        .recruit-counter {
            color: #4caf50;
            text-shadow: 0 0 3px #4caf50;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            font-size: 9px;
            white-space: nowrap;
        }

        .upgrade-counter {
            color: #e94560;
            text-shadow: 0 0 3px #e94560;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            font-size: 9px;
            white-space: nowrap;
        }

        /* Стили для счетчиков на здании ИГРОВАЯ (b3) */
        .b3 {
            position: absolute;
            top: 19%;
            right: 3%;
            width: 38%;
            height: 18%;
            overflow: visible !important;
        }

        .b3 .counters-container-game {
            position: absolute;
            top: 4px;
            left: 4px;
            right: 4px;
            display: flex;
            flex-direction: column;
            gap: 3px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(6px);
            padding: 4px 6px;
            border-radius: 12px;
            z-index: 102;
            pointer-events: none;
            font-size: 9px;
            font-weight: bold;
            border: 1px solid rgba(255, 255, 255, 0.25);
            text-align: center;
        }

        .game-active-counter {
            color: #4caf50;
            text-shadow: 0 0 3px #4caf50;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            font-size: 9px;
            white-space: nowrap;
        }

        .game-upgrade-counter {
            color: #e94560;
            text-shadow: 0 0 3px #e94560;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            font-size: 9px;
            white-space: nowrap;
        }

        .building:hover .building-label {
            opacity: 0.7;
            top: -44px;
        }

        .building.active .building-label {
            opacity: 1;
            top: -48px;
        }

        .b1 {
            top: 3%;
            left: 31%;
            width: 38%;
            height: 15%;
        }

        .b4 {
            top: 37%;
            left: 28%;
            width: 42%;
            height: 13%;
        }

        .b5 {
            top: 51%;
            left: 4%;
            width: 34%;
            height: 18%;
        }

        .b6 {
            top: 51%;
            right: 4%;
            width: 34%;
            height: 18%;
        }

        /* Стили для бейджа уведомлений */
        .notification-badge {
            position: relative;
        }

        .notification-badge .badge-count {
            position: absolute;
            top: -4px;
            right: -4px;
            background: #e94560;
            color: white;
            border-radius: 50%;
            min-width: 18px;
            height: 18px;
            font-size: 10px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 4px;
            box-shadow: 0 0 5px rgba(233, 69, 96, 0.5);
            z-index: 10;
        }

        @media (max-width: 768px) {
            .bottom-nav {
                gap: 8px;
            }

            .nav-btn img {
                width: 48px;
            }

            .nav-btn {
                padding: 4px 8px;
            }

            .game-container {
                width: 100%;
                max-width: 100%;
            }

            .map-wrapper {
                width: 100%;
            }

            .map-image {
                width: 100%;
            }

            .building-label {
                font-size: 10px;
                padding: 4px 8px;
                top: -30px;
            }

            .building:hover .building-label {
                top: -36px;
            }

            .building.active .building-label {
                top: -38px;
            }

            .resource-item {
                padding: 3px 8px;
                font-size: 10px;
            }

            .resource-item span:first-child {
                font-size: 12px;
            }

            .caste-icon {
                font-size: 20px;
            }

            .nav-btn {
                padding: 8px 10px;
                min-width: 50px;
            }

            .nav-btn span:first-child {
                font-size: 20px;
            }

            .nav-btn span:last-child {
                font-size: 9px;
            }

            body {
                padding-top: 100px;
            }

            .fixed-top-bar .top-bar-content {
                max-width: 412px;
                margin: 0 auto;
            }

            .fixed-bottom-bar .bottom-nav {
                max-width: 412px;
            }

            .b2 .counters-container-work,
            .b7 .counters-container,
            .b3 .counters-container-game {
                padding: 3px 4px;
                gap: 2px;
                font-size: 7px;
                top: 2px;
                left: 2px;
                right: 2px;
            }

            .work-counter,
            .upgrade-work-counter,
            .recruit-counter,
            .upgrade-counter,
            .game-active-counter,
            .game-upgrade-counter {
                font-size: 7px;
                gap: 2px;
            }
        }

        /* ========== СТИЛИ ДЛЯ ОКНА РАБОТЫ ========== */
        .mine-fullscreen,
        .shop-fullscreen,
        .cardgame-fullscreen,
        .treasury-fullscreen,
        .attack-fullscreen,
        .clan-fullscreen,
        .profile-fullscreen,
        .settings-fullscreen,
        .inventory-fullscreen,
        .quests-fullscreen,
        .gang-fullscreen,
        .hospital-fullscreen {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #0a0e1a;
            background-image: radial-gradient(circle at 25% 40%, rgba(233, 69, 96, 0.2) 0%, rgba(10, 14, 26, 0.98) 100%);
            z-index: 10000;
            display: flex;
            flex-direction: column;
            animation: fadeIn 0.25s ease;
        }

        .mine-header-bar,
        .shop-header-bar,
        .cardgame-header-bar,
        .treasury-header-bar,
        .attack-header-bar,
        .clan-header-bar,
        .profile-header-bar,
        .settings-header-bar,
        .inventory-header-bar,
        .quests-header-bar,
        .gang-header-bar,
        .hospital-header-bar {
            background: rgba(10, 14, 26, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(233, 69, 96, 0.3);
            padding: 12px 20px;
            padding-top: max(12px, env(safe-area-inset-top));
        }

        .mine-header-content,
        .shop-header-content,
        .cardgame-header-content,
        .treasury-header-content,
        .attack-header-content,
        .clan-header-content,
        .profile-header-content,
        .settings-header-content,
        .inventory-header-content,
        .quests-header-content,
        .gang-header-content,
        .hospital-header-content {
            max-width: 550px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mine-header-title,
        .shop-header-title,
        .cardgame-header-title,
        .treasury-header-title,
        .attack-header-title,
        .clan-header-title,
        .profile-header-title,
        .settings-header-title,
        .inventory-header-title,
        .quests-header-title,
        .gang-header-title,
        .hospital-header-title {
            font-size: 18px;
            font-weight: 700;
            background: linear-gradient(135deg, #fff, #e94560);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .mine-bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(10, 14, 26, 0.95);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(233, 69, 96, 0.3);
            padding: 10px 20px;
            padding-bottom: max(10px, env(safe-area-inset-bottom));
            z-index: 10001;
        }

        .mine-bottom-nav .bottom-nav {
            max-width: 550px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-around;
            gap: 8px;
        }

        .mine-tab-btn {
            background: transparent;
            border: none;
            border-radius: 50px;
            padding: 10px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            transition: all 0.2s;
            color: #8e8ea0;
            font-size: 12px;
            font-weight: 500;
            min-width: 60px;
        }

        .mine-tab-btn span:first-child {
            font-size: 24px;
            transition: transform 0.2s;
        }

        .mine-tab-btn span:last-child {
            font-size: 10px;
            font-weight: 500;
        }

        .mine-tab-btn.active {
            background: linear-gradient(135deg, rgba(233, 69, 96, 0.25), rgba(199, 62, 84, 0.2));
            color: #fff;
            border: 1px solid rgba(233, 69, 96, 0.5);
        }

        .mine-tab-btn.active span:first-child {
            transform: scale(1.1);
            text-shadow: 0 0 8px rgba(233, 69, 96, 0.8);
        }

        .mine-tab-btn:active {
            transform: scale(0.94);
            background: rgba(233, 69, 96, 0.25);
        }

        .mine-content-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px 16px;
            margin-bottom: 75px;
        }

        .mine-card {
            background: rgba(30, 36, 64, 0.7);
            backdrop-filter: blur(8px);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 16px;
            border: 1px solid rgba(233, 69, 96, 0.2);
        }

        .btn-secondary {
            background: rgba(30, 36, 64, 0.8);
            border: 1px solid rgba(233, 69, 96, 0.3);
            padding: 10px 16px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: 0.1s;

            top: 0;
            left: 0;

            bottom: 0;
            background-color: #ccc;
            transition: 0.3s;

            content: "";

            width: 18px;
            left: 3px;

            transition: 0.3s;

    <script>
        // ========== ПРОСТОЙ КЭШ КАРТИНОК (БЕЗ CANVAS) ==========
        const IMAGE_CACHE_KEY = 'game_images_cache';
        const IMAGE_CACHE_TTL = 24 * 60 * 60 * 1000; // 24 часа

        // Получить кэш
        function getImageCache() {
            try {
                const cached = localStorage.getItem(IMAGE_CACHE_KEY);
                if (cached) {
                    const data = JSON.parse(cached);
                    const now = Date.now();
                    const validEntries = {};
                    for (const [url, entry] of Object.entries(data)) {
                        if (now - entry.timestamp < IMAGE_CACHE_TTL) {
                            validEntries[url] = entry;
                        }
                    }
                    return validEntries;
                }
            } catch (e) { }
            return {};
        }

        // Сохранить URL в кэш (сохраняем сам URL, не dataURL)
        function saveToImageCache(url) {
            try {
                const cache = getImageCache();
                cache[url] = {
                    url: url,
                    timestamp: Date.now()
                };
                const entries = Object.entries(cache);
                if (entries.length > 50) {
                    entries.sort((a, b) => a[1].timestamp - b[1].timestamp);
                    for (let i = 0; i < entries.length - 50; i++) {
                        delete cache[entries[i][0]];
                    }
                }
                localStorage.setItem(IMAGE_CACHE_KEY, JSON.stringify(cache));
            } catch (e) { }
        }

        // Проверить, есть ли URL в кэше
        function isInImageCache(url) {
            const cache = getImageCache();
            return !!cache[url];
        }

        // Загрузить картинку с проверкой кэша (простая версия)
        function loadImageWithCache(imgElement, originalUrl, fallbackUrl) {
            if (!imgElement) return;

            // Если URL уже в кэше или картинка уже загружена
            if (isInImageCache(originalUrl) || imgElement.getAttribute('data-cached') === 'true') {
                imgElement.src = originalUrl;
                imgElement.classList.remove('img-loading');
                imgElement.classList.add('img-loaded');
                return;
            }

            imgElement.classList.add('img-loading');

            const tempImg = new Image();
            tempImg.onload = () => {
                imgElement.src = originalUrl;
                imgElement.classList.remove('img-loading');
                imgElement.classList.add('img-loaded');
                imgElement.setAttribute('data-cached', 'true');
                saveToImageCache(originalUrl);
            };
            tempImg.onerror = () => {
                if (fallbackUrl && fallbackUrl !== originalUrl) {
                    loadImageWithCache(imgElement, fallbackUrl, null);
                } else {
                    imgElement.classList.remove('img-loading');
                    imgElement.classList.add('img-error');
                    imgElement.src = fallbackUrl || originalUrl;
                }
            };
            tempImg.src = originalUrl;
        }

        // Загрузить все картинки на странице
        function loadAllCachedImages() {
            document.querySelectorAll('img[data-src]').forEach(img => {
                const src = img.getAttribute('data-src');
                const fallback = img.getAttribute('data-fallback');
                if (src) {
                    loadImageWithCache(img, src, fallback);
                }
            });
        }

// Отправить заявку
async function sendJoinRequest(clanId) {
    if (!currentPlayer) return;
    if (currentPlayer.clanId) {
        showToast('Вы уже состоите в клане!', 'warning');
        return;
    }
    
    const clan = allClans.find(c => c.id === clanId);
    if (!clan) return;
    
    // Проверяем, не отклонена ли заявка
    const rejectedKey = `rejected_${currentPlayer.id}_${clanId}`;
    if (localStorage.getItem(rejectedKey)) {
        showToast('❌ Ваша заявка была отклонена. Попробуйте позже.', 'warning');
        return;
    }
    
    const requestsRef = db.collection('clanJoinRequests').doc(clanId);
    const requestsDoc = await requestsRef.get();
    let requests = requestsDoc.exists ? requestsDoc.data().requests || [] : [];
    
    if (requests.find(r => r.playerId === currentPlayer.id)) {
        showToast('Вы уже отправили заявку в этот клан!', 'warning');
        return;
    }
    
    const newRequest = {
        playerId: currentPlayer.id,
        playerName: currentPlayer.username,
        playerLevel: currentPlayer.level,
        playerPower: calculatePlayerPower(currentPlayer),
        playerCigarettes: currentPlayer.cigarettes,
        playerRubles: currentPlayer.rubles,
        playerGang: getGangInfoString(currentPlayer),
        playerGangDisplay: getGangDisplayString(currentPlayer),
        status: 'pending',
        timestamp: Date.now()
    };
    
    requests.push(newRequest);
    await requestsRef.set({ requests: requests });
    
    // Сохраняем в localStorage для быстрого отображения
    const sentRequests = JSON.parse(localStorage.getItem(`sentRequests_${currentPlayer.id}`) || '[]');
    sentRequests.push(clanId);
    localStorage.setItem(`sentRequests_${currentPlayer.id}`, JSON.stringify(sentRequests));
    
    showToast(`✅ Заявка отправлена в клан "${clan.name}"!`, 'success');
    renderUI();
}

// Принять заявку
async function acceptJoinRequest(request, clanId) {
    const clan = allClans.find(c => c.id === clanId);
    if (!clan) return;
    
    if (clan.membersIds && clan.membersIds.length >= clanMaxMembers) {
        showToast('В клане нет свободных мест!', 'error');
        return;
    }
    
    // Проверяем, не в клане ли уже игрок
    const playerRef = db.collection('players').doc(request.playerId);
    const playerDoc = await playerRef.get();
    if (playerDoc.exists && playerDoc.data().clanId) {
        showToast(`Игрок ${request.playerName} уже состоит в клане!`, 'warning');
        await removeRequestFromClan(request.playerId, clanId);
        renderUI();
        return;
    }
    
    try {
        await playerRef.update({
            clanId: clanId,
            clanLeader: clan.leader
        });
        
        await db.collection('clans').doc(clanId).update({
            members: firebase.firestore.FieldValue.arrayUnion(request.playerName),
            membersIds: firebase.firestore.FieldValue.arrayUnion(request.playerId)
        });
        
        await removeRequestFromClan(request.playerId, clanId);
        
        // Удаляем все заявки этого игрока из других кланов
        await removeAllPlayerRequests(request.playerId);
        
        showToast(`✅ Игрок ${request.playerName} принят в клан!`, 'success');
        
        if (currentPlayer.id === request.playerId) {
            currentPlayer.clanId = clanId;
            currentPlayer.clanLeader = clan.leader;
            localStorage.removeItem(`sentRequests_${currentPlayer.id}`);
        }
        
        await loadAllClans();
        renderUI();
    } catch(e) {
        showToast('Ошибка при принятии заявки!', 'error');
    }
}

// Отклонить заявку
async function rejectJoinRequest(request, clanId) {
    try {
        await removeRequestFromClan(request.playerId, clanId);
        localStorage.setItem(`rejected_${request.playerId}_${clanId}`, Date.now().toString());
        showToast(`❌ Заявка от ${request.playerName} отклонена`, 'warning');
        
        if (currentPlayer.id === request.playerId) {
            const sentRequests = JSON.parse(localStorage.getItem(`sentRequests_${currentPlayer.id}`) || '[]');
            const newSent = sentRequests.filter(id => id !== clanId);
            localStorage.setItem(`sentRequests_${currentPlayer.id}`, JSON.stringify(newSent));
            renderUI();
        }
    } catch(e) {
        showToast('Ошибка при отклонении заявки!', 'error');
    }
}

// Удалить заявку из клана
async function removeRequestFromClan(playerId, clanId) {
    const requestsRef = db.collection('clanJoinRequests').doc(clanId);
    const requestsDoc = await requestsRef.get();
    if (requestsDoc.exists) {
        let requests = requestsDoc.data().requests || [];
        requests = requests.filter(r => r.playerId !== playerId);
        await requestsRef.set({ requests: requests });
    }
}

// Удалить все заявки игрока
async function removeAllPlayerRequests(playerId) {
    const clansSnapshot = await db.collection('clans').get();
    for (const clanDoc of clansSnapshot.docs) {
        await removeRequestFromClan(playerId, clanDoc.id);
    }
}

// Загрузить заявки для клана (только pending)
async function loadClanJoinRequests(clanId) {
    if (!clanId) return [];
    try {
        const requestsRef = db.collection('clanJoinRequests').doc(clanId);
        const requestsDoc = await requestsRef.get();
        if (requestsDoc.exists) {
            const requests = requestsDoc.data().requests || [];
            return requests.filter(r => r.status === 'pending');
        }
    } catch(e) {}
    return [];
}

// Проверить, отправлял ли игрок заявку в этот клан
function hasSentRequestToClan(clanId) {
    if (!currentPlayer) return false;
    const sentRequests = JSON.parse(localStorage.getItem(`sentRequests_${currentPlayer.id}`) || '[]');
    return sentRequests.includes(clanId);
}

                await playerDocRef.update({

                    return;
                }
                // Сбрасываем счетчик уведомлений при открытии клана

                updateClanNotificationBadge();
                // Сохраняем текущую вкладку, чтобы потом вернуть

                currentBottomTab = tab;
                renderUI();
                // Используем безопасное открытие
                safeOpenModal('clan', () => openClanFullModalWithReset(previousTab));
                return;
            }
            if (tab === 'quests') {
                questNotificationCount = 0;
                updateQuestsNotificationBadge();
                safeOpenModal('quests', () => openQuestsModalWithReset());
                return;
            }
            if (tab === 'treasury') {
                safeOpenModal('treasury', () => openTreasuryModalWithReset());
                return;
            }
            if (tab === 'war') {
                if (currentPlayer && currentPlayer.clanId && currentPlayer.username === currentPlayer.clanLeader) {
                    safeOpenModal('war', () => openAttackMenuWithReset());
                } else if (currentPlayer && currentPlayer.clanId) {

                    showToast('Вступите в клан, чтобы участвовать в войнах!', 'warning');

                return;
            }

                currentBottomTab = tab;
                renderUI();
                showToast('🏙️ Вы в Городе', 'success');
            }
        }

            if (maintenanceMode) { showToast(maintenanceMessage, 'warning'); return; }
            const newName = prompt("Введите новое имя (латиница/цифры, 3-10 символов):", currentPlayer.username);

        async function addWorkExperience(amount) {
            if (!currentPlayer) return;
            let newAuthority = currentPlayer.authority + amount;
            let newLevel = currentPlayer.level;
            let leveledUp = false;
            let newAuthorityToNext = currentPlayer.authorityToNext;
            let newMaxEnergy = currentPlayer.maxEnergy;
            let newStrength = currentPlayer.stats.strength;
            let newDefense = currentPlayer.stats.defense;

            if (newAuthority >= currentPlayer.authorityToNext) {
                newLevel++;
                newAuthority = 0;
                newAuthorityToNext = Math.floor(currentPlayer.authorityToNext * 1.5);
                newMaxEnergy = currentPlayer.maxEnergy + 5;
                newStrength = currentPlayer.stats.strength + 3;
                newDefense = currentPlayer.stats.defense + 2;
                leveledUp = true;
                if (cardGameActive) {
                    cardGameBonusPercent = getCardGameBonusFromLevel(newLevel);
                    await playerDocRef.update({ cardGameBonusPercent: cardGameBonusPercent });
                }
            }

            await playerDocRef.update({
                authority: newAuthority,
                level: newLevel,
                authorityToNext: newAuthorityToNext,
                maxEnergy: newMaxEnergy,
                'stats.strength': newStrength,
                'stats.defense': newDefense
            });

            currentPlayer.authority = newAuthority;
            currentPlayer.level = newLevel;
            currentPlayer.authorityToNext = newAuthorityToNext;
            currentPlayer.maxEnergy = newMaxEnergy;
            currentPlayer.stats.strength = newStrength;
            currentPlayer.stats.defense = newDefense;

            if (leveledUp) {
                showToast(`🎉 УРОВЕНЬ ${newLevel}! +5 энергии, +3 силы, +2 защиты!`, 'success');
            }

            await updateQuestProgress('authority', amount);
            renderUI();
        }

        function isMineUpgradeActive(type) {
            if (type === 'paper') {
                return currentPlayer.mine?.paperUpgradeStartTime > 0 && (Date.now() - currentPlayer.mine.paperUpgradeStartTime) < (currentPlayer.mine.paperUpgradeDuration || 0);
            } else if (type === 'makhorka') {
                return currentPlayer.mine?.makhorkaUpgradeStartTime > 0 && (Date.now() - currentPlayer.mine.makhorkaUpgradeStartTime) < (currentPlayer.mine.makhorkaUpgradeDuration || 0);
            }
            return false;

        function getMineUpgradeRemaining(type) {
            if (type === 'paper') {
                const start = currentPlayer.mine?.paperUpgradeStartTime || 0;
                const duration = currentPlayer.mine?.paperUpgradeDuration || 0;
                if (start === 0 || duration === 0) return 0;
                return Math.max(0, duration - (Date.now() - start));
            } else if (type === 'makhorka') {
                const start = currentPlayer.mine?.makhorkaUpgradeStartTime || 0;
                const duration = currentPlayer.mine?.makhorkaUpgradeDuration || 0;
                if (start === 0 || duration === 0) return 0;
                return Math.max(0, duration - (Date.now() - start));
            }
            return 0;

        function getWorkRemaining(type) {
            if (type === 'mine') {

                let cooldownMs = 2 * 60 * 1000; // База 2 минуты

        function startMineTimers() {

                if (paperUpgradeTimer) paperUpgradeTimer.textContent = formatTimerMinutes(paperUpgradeRemaining);

        async function upgradeMineFromModal(type) {
            if (maintenanceMode) { showToast(maintenanceMessage, 'warning'); return; }

            if (isMineUpgradeActive(type)) {
                showToast('Прокачка уже идет! Дождитесь завершения.', 'warning');
                return;
            }

            if (getWorkRemaining('mine') > 0) {
                showToast('Невозможно улучшить во время работы! Дождитесь окончания работы.', 'warning');
                return;
            }

            const level = currentPlayer.mine[`${type}Level`] || 1;
            const cost = 50 * level;
            if (currentPlayer.cigarettes < cost) { showToast(`Не хватает ${cost - currentPlayer.cigarettes} 🚬!`, 'error'); return; }

            await playerDocRef.update({ cigarettes: firebase.firestore.FieldValue.increment(-cost) });
            currentPlayer.cigarettes -= cost;

            let upgradeDurationMs = 2 * 60 * 1000;
            upgradeDurationMs = Math.floor(upgradeDurationMs * (1 + (level - 1) * 0.1));
            const upgradeStartTime = Date.now();

            const updateObj = {};
            if (type === 'paper') {
                updateObj['mine.paperUpgradeStartTime'] = upgradeStartTime;
                updateObj['mine.paperUpgradeDuration'] = upgradeDurationMs;
            } else {
                updateObj['mine.makhorkaUpgradeStartTime'] = upgradeStartTime;
                updateObj['mine.makhorkaUpgradeDuration'] = upgradeDurationMs;
            }
            await playerDocRef.update(updateObj);

            if (type === 'paper') {
                currentPlayer.mine.paperUpgradeStartTime = upgradeStartTime;
                currentPlayer.mine.paperUpgradeDuration = upgradeDurationMs;
            } else {
                currentPlayer.mine.makhorkaUpgradeStartTime = upgradeStartTime;
                currentPlayer.mine.makhorkaUpgradeDuration = upgradeDurationMs;
            }

            showToast(`⏳ Начата прокачка ${type === 'paper' ? 'бумаги' : 'махорки'}! Уровень повысится через ${Math.round(upgradeDurationMs / 60000)} мин.`, 'success');
            renderMineModal();
            renderUI();
        }

        async function mineResourcesFromModal() {
            if (maintenanceMode) { showToast(maintenanceMessage, 'warning'); return; }

            if (isMineUpgradeActive('paper') || isMineUpgradeActive('makhorka')) {
                showToast('Невозможно работать во время прокачки!', 'warning');
                return;
            }

            const now = Date.now();
            const lastMine = currentPlayer.mine?.lastMineTime || 0;
            const paperLevel = currentPlayer.mine?.paperLevel || 1;
            let cooldownMs = 2 * 60 * 1000;
            cooldownMs = Math.floor(cooldownMs * (1 + (paperLevel - 1) * 0.05));
            if ((now - lastMine) < cooldownMs) { showToast('Работа еще не доступна!', 'warning'); return; }

            // Убираем расход энергии
            // if (!await spendEnergyForWork(energyCost)) return;

            let paperGain = 5 * paperLevel;
            let makhorkaGain = 3 * (currentPlayer.mine?.makhorkaLevel || 1);
            if (currentPlayer.caste === 'Мужики') { paperGain = Math.floor(paperGain * 1.05); makhorkaGain = Math.floor(makhorkaGain * 1.05); }

            await playerDocRef.update({
                'mine.paper': (currentPlayer.mine?.paper || 0) + paperGain,
                'mine.makhorka': (currentPlayer.mine?.makhorka || 0) + makhorkaGain,
                'mine.lastMineTime': now
            });
            currentPlayer.mine.paper += paperGain;
            currentPlayer.mine.makhorka += makhorkaGain;
            currentPlayer.mine.lastMineTime = now;

            const workExp = 25 + (paperLevel * 3) + ((currentPlayer.mine?.makhorkaLevel || 1) * 2);
            await addWorkExperience(workExp);

            await updateQuestProgress('mine', paperGain + makhorkaGain);
            showToast(`⛏️ Работа выполнена! +${paperGain}📄, +${makhorkaGain}🌿, +${workExp}⭐ опыта`, 'success');
            renderMineModal();
            renderUI();
        }

        async function exchangeToCigarettesFromModal() {
            if (maintenanceMode) { showToast(maintenanceMessage, 'warning'); return; }
            const paper = currentPlayer.mine?.paper || 0;
            const makhorka = currentPlayer.mine?.makhorka || 0;
            if (paper === 0 && makhorka === 0) { showToast('Нет ресурсов!', 'warning'); return; }
            const paperRate = getExchangeRate(currentPlayer.mine?.paperLevel || 1, 'paper');
            const makhorkaRate = getExchangeRate(currentPlayer.mine?.makhorkaLevel || 1, 'makhorka');

        // Функция генерации рандомных товаров с новыми типами
        function generateRandomShopItems() {
            const items = [];
            const resourceTypes = [
                { type: 'cigarettes', name: 'Папиросы', icon: '🚬', desc: 'Пачка папирос', stat: null, bonus: 0 },
                { type: 'paper', name: 'Бумага', icon: '📄', desc: 'Стопка бумаги', stat: null, bonus: 0 },
                { type: 'makhorka', name: 'Махорка', icon: '🌿', desc: 'Самосад', stat: null, bonus: 0 },
                { type: 'wood', name: 'Древесина', icon: '🪵', desc: 'Сосновый брус', stat: null, bonus: 0 },
                { type: 'stone', name: 'Камень', icon: '🪨', desc: 'Гранитная глыба', stat: null, bonus: 0 },
                { type: 'rubles', name: 'Деньги', icon: '💰', desc: 'Пачка рублей', stat: null, bonus: 0 },
                { type: 'blats', name: 'Блатной авторитет', icon: '👑', desc: 'Уважение блатных', stat: 'strength', bonus: 1 },
                { type: 'muzhiks', name: 'Мужицкая сила', icon: '🔨', desc: 'Трудовые мозоли', stat: 'strength', bonus: 1 },
                { type: 'fraers', name: 'Фраерская удача', icon: '🐑', desc: 'Везение', stat: 'critical', bonus: 1 }
            ];

            for (let i = 0; i < 12; i++) {
                const resource = resourceTypes[Math.floor(Math.random() * resourceTypes.length)];
                const priceType = Math.random() > 0.5 ? 'rubles' : 'cigarettes';
                let price = 0;
                if (priceType === 'rubles') {
                    price = Math.floor(Math.random() * (50 + currentPlayer.level * 10)) + 10 + currentPlayer.level * 2;
                } else {
                    price = Math.floor(Math.random() * (30 + currentPlayer.level * 8)) + 5 + currentPlayer.level;
                }

                let amount = Math.floor(Math.random() * (20 + currentPlayer.level * 3)) + 5 + Math.floor(currentPlayer.level / 2);

                items.push({
                    id: `random_${Date.now()}_${i}_${Math.random()}`,
                    name: resource.name,
                    desc: resource.desc,
                    price: price,
                    currency: priceType,
                    type: 'resource',
                    category: 'random',
                    resourceType: resource.type,
                    amount: amount,
                    icon: resource.icon,
                    stat: resource.stat,
                    bonus: resource.bonus,
                    imageUrl: ''
                });
            }
            return items;
        }

        // Функция обновления рандомного магазина
        function updateRandomShopIfNeeded(force = false) {
            const now = Date.now();
            if (force || randomShopItems.length === 0 || now - randomShopLastUpdate >= RANDOM_SHOP_UPDATE_INTERVAL) {
                if (force && currentPlayer.rubles < 200) {
                    showToast('Не хватает 200💰 для принудительного обновления!', 'error');
                    return false;
                }
                randomShopItems = generateRandomShopItems();
                randomShopLastUpdate = now;
                purchasedRandomItems = {}; // Сбрасываем покупки при обновлении
                // Сохраняем в localStorage
                localStorage.setItem(`randomShopItems_${currentPlayer.id}`, JSON.stringify(randomShopItems));
                localStorage.setItem(`randomShopLastUpdate_${currentPlayer.id}`, randomShopLastUpdate);
                localStorage.setItem(`purchasedRandomItems_${currentPlayer.id}`, JSON.stringify(purchasedRandomItems));
                if (currentShopCategory === 'random' && document.getElementById('shopFullscreen')) {
                    renderShopModal();
                }
                if (force) {
                    currentPlayer.rubles -= 200;
                    playerDocRef.update({ rubles: currentPlayer.rubles });
                    showToast('🎲 Ассортимент РАНДОМ обновлён! -200💰', 'success');
                } else {
                    showToast('🎲 Ассортимент РАНДОМ обновлён!', 'success');
                }
                renderUI();
                return true;
            }
            return false;
        }

        // Функция загрузки рандомных товаров из localStorage
        function loadRandomShopFromStorage() {
            if (currentPlayer && currentPlayer.id) {
                const savedItems = localStorage.getItem(`randomShopItems_${currentPlayer.id}`);
                const savedLastUpdate = localStorage.getItem(`randomShopLastUpdate_${currentPlayer.id}`);
                const savedPurchased = localStorage.getItem(`purchasedRandomItems_${currentPlayer.id}`);

                if (savedItems) {
                    randomShopItems = JSON.parse(savedItems);
                }
                if (savedLastUpdate) {
                    randomShopLastUpdate = parseInt(savedLastUpdate);
                }
                if (savedPurchased) {
                    purchasedRandomItems = JSON.parse(savedPurchased);
                }

                // Проверяем, не устарели ли товары
                if (randomShopItems.length === 0 || (Date.now() - randomShopLastUpdate) >= RANDOM_SHOP_UPDATE_INTERVAL) {
                    updateRandomShopIfNeeded(false);
                }
            }
        }

        // Функция получения времени до следующего обновления
        function getRandomShopUpdateRemaining() {
            const elapsed = Date.now() - randomShopLastUpdate;
            return Math.max(0, RANDOM_SHOP_UPDATE_INTERVAL - elapsed);
        }

        // Функции прокачки магазина
        function isShopUpgradeActive() {
            return shopUpgradeStartTime > 0 && (Date.now() - shopUpgradeStartTime) < shopUpgradeDuration;
        }

        function getShopUpgradeRemaining() {
            if (shopUpgradeStartTime === 0 || shopUpgradeDuration === 0) return 0;
            return Math.max(0, shopUpgradeDuration - (Date.now() - shopUpgradeStartTime));
        }

        async function checkAndCompleteShopUpgrade() {
            const remaining = getShopUpgradeRemaining();
            if (remaining === 0 && shopUpgradeStartTime > 0) {
                await playerDocRef.update({
                    shopLevel: shopLevel + 1,
                    shopUpgradeStartTime: 0,
                    shopUpgradeDuration: 0
                });
                shopLevel++;
                shopUpgradeStartTime = 0;
                shopUpgradeDuration = 0;
                showToast(`✅ Уровень магазина повышен до ${shopLevel}!`, 'success');
                if (document.getElementById('shopFullscreen')) renderShopModal();
                renderUI();
                return true;
            }
            return false;
        }

        async function upgradeShop() {
            if (maintenanceMode) { showToast(maintenanceMessage, 'warning'); return; }
            if (isShopUpgradeActive()) {
                showToast('Прокачка уже идет! Дождитесь завершения.', 'warning');
                return;
            }
            const costCigarettes = 100 * shopLevel;
            const costWood = 50 * shopLevel;
            const costStone = 30 * shopLevel;

            if (currentPlayer.cigarettes < costCigarettes) { showToast(`Не хватает ${costCigarettes - currentPlayer.cigarettes} 🚬!`, 'error'); return; }
            if ((currentPlayer.lumber?.wood || 0) < costWood) { showToast(`Не хватает ${costWood - (currentPlayer.lumber?.wood || 0)} 🪵!`, 'error'); return; }
            if ((currentPlayer.quarry?.stone || 0) < costStone) { showToast(`Не хватает ${costStone - (currentPlayer.quarry?.stone || 0)} 🪨!`, 'error'); return; }

            await playerDocRef.update({
                cigarettes: firebase.firestore.FieldValue.increment(-costCigarettes),
                'lumber.wood': firebase.firestore.FieldValue.increment(-costWood),
                'quarry.stone': firebase.firestore.FieldValue.increment(-costStone)
            });
            currentPlayer.cigarettes -= costCigarettes;
            if (currentPlayer.lumber) currentPlayer.lumber.wood -= costWood;
            if (currentPlayer.quarry) currentPlayer.quarry.stone -= costStone;

            let upgradeDurationMs = 2 * 60 * 1000;
            upgradeDurationMs = Math.floor(upgradeDurationMs * (1 + (shopLevel - 1) * 0.1));
            const upgradeStartTime = Date.now();

            await playerDocRef.update({
                shopUpgradeStartTime: upgradeStartTime,
                shopUpgradeDuration: upgradeDurationMs
            });
            shopUpgradeStartTime = upgradeStartTime;
            shopUpgradeDuration = upgradeDurationMs;

            showToast(`⏳ Начата прокачка магазина! Уровень повысится через ${Math.round(upgradeDurationMs / 60000)} мин.`, 'success');
            renderShopModal();
            renderUI();
        }

        function switchShopTab(tab) {
            currentShopTab = tab;
            renderShopModal();
        }

        function openShopModal() {
            if (window._opening_modal) { console.log('Блокировка: окно уже открывается'); return; }
            window._opening_modal = true;

            if (maintenanceMode) { showToast(maintenanceMessage, 'warning'); window._opening_modal = false; return; }
            if (!currentPlayer) { window._opening_modal = false; return; }

            loadRandomShopFromStorage();
            currentShopCategory = 'random';
            currentShopTab = 'offers';
            renderShopModal();

            if (window.randomShopTimerInterval) clearInterval(window.randomShopTimerInterval);
            window.randomShopTimerInterval = setInterval(() => {
                const modal = document.getElementById('shopFullscreen');
                if (!modal) {
                    if (window.randomShopTimerInterval) clearInterval(window.randomShopTimerInterval);
                    return;
                }
                if (currentShopTab === 'offers') {
                    const timerEl = document.getElementById('randomUpdateTimer');
                    if (timerEl) {
                        const remaining = getRandomShopUpdateRemaining();
                        timerEl.innerHTML = `<span>🔄 ОБНОВЛЕНИЕ ЧЕРЕЗ: ${formatTimeDetailedWithSeconds(remaining)}</span><button onclick="forceUpdateRandomShop()">🔄 ОБНОВИТЬ (200💰)</button>`;
                    }
                }
                if (currentShopTab === 'upgrade') {
                    const timerEl = document.getElementById('shopUpgradeTimer');
                    if (timerEl && isShopUpgradeActive()) {
                        timerEl.textContent = formatTimerMinutes(getShopUpgradeRemaining());
                    }
                }
            }, 1000);

            if (window.shopUpgradeTimerInterval) clearInterval(window.shopUpgradeTimerInterval);
            window.shopUpgradeTimerInterval = setInterval(() => {
                const modal = document.getElementById('shopFullscreen');
                if (!modal) {
                    if (window.shopUpgradeTimerInterval) clearInterval(window.shopUpgradeTimerInterval);
                    return;
                }
                checkAndCompleteShopUpgrade();
                if (currentShopTab === 'upgrade') {
                    const costCigarettes = 100 * shopLevel;
                    const costWood = 50 * shopLevel;
                    const costStone = 30 * shopLevel;
                    const upgradeBtn = document.getElementById('upgradeShopBtn');
                    const upgradeActive = isShopUpgradeActive();
                    const upgradeRemaining = getShopUpgradeRemaining();
                    const timerEl = document.getElementById('shopUpgradeTimer');

                    if (upgradeActive && timerEl) {
                        timerEl.textContent = formatTimerMinutes(upgradeRemaining);
                        if (upgradeBtn) upgradeBtn.disabled = true;
                    } else if (!upgradeActive) {
                        if (timerEl) timerEl.textContent = 'Готово!';
                        if (upgradeBtn) {
                            upgradeBtn.disabled = (currentPlayer.cigarettes < costCigarettes || (currentPlayer.lumber?.wood || 0) < costWood || (currentPlayer.quarry?.stone || 0) < costStone);
                        }
                    }
                }
            }, 1000);

            setTimeout(() => { window._opening_modal = false; }, 500);
        }

            updateRandomShopIfNeeded(true);
        }

        async function upgradeGymFromModal() {
            if (maintenanceMode) { showToast(maintenanceMessage, 'warning'); return; }
            if (currentPlayer.level < 2) { showToast('Качалка доступна с 2 уровня!', 'warning'); return; }

            if (isGymUpgradeActive()) {
                showToast('Прокачка уже идет! Дождитесь завершения.', 'warning');
                return;
            }

            if (gymActive) {
                showToast('Невозможно улучшить во время тренировки!', 'warning');
                return;
            }

            const cost = getGymUpgradeCost();
            if (currentPlayer.cigarettes < cost.cigarettes) { showToast(`Не хватает ${cost.cigarettes - currentPlayer.cigarettes} 🚬!`, 'error'); return; }
            if ((currentPlayer.lumber?.wood || 0) < cost.wood) { showToast(`Не хватает ${cost.wood - (currentPlayer.lumber?.wood || 0)} 🪵!`, 'error'); return; }
            if ((currentPlayer.quarry?.stone || 0) < cost.stone) { showToast(`Не хватает ${cost.stone - (currentPlayer.quarry?.stone || 0)} 🪨!`, 'error'); return; }

            await playerDocRef.update({
                cigarettes: firebase.firestore.FieldValue.increment(-cost.cigarettes),
                'lumber.wood': firebase.firestore.FieldValue.increment(-cost.wood),
                'quarry.stone': firebase.firestore.FieldValue.increment(-cost.stone)
            });
            currentPlayer.cigarettes -= cost.cigarettes;
            if (currentPlayer.lumber) currentPlayer.lumber.wood -= cost.wood;
            if (currentPlayer.quarry) currentPlayer.quarry.stone -= cost.stone;

            let upgradeDurationMs = 2 * 60 * 1000;
            upgradeDurationMs = Math.floor(upgradeDurationMs * (1 + (gymLevel - 1) * 0.1));
            const upgradeStartTime = Date.now();

            await playerDocRef.update({
                gymUpgradeStartTime: upgradeStartTime,
                gymUpgradeDuration: upgradeDurationMs
            });
            gymUpgradeStartTime = upgradeStartTime;
            gymUpgradeDuration = upgradeDurationMs;

            showToast(`⏳ Начата прокачка качалки! Уровень повысится через ${Math.round(upgradeDurationMs / 60000)} мин.`, 'success');
            renderGameModal();
            renderUI();
        }

        async function startGymTraining() {
            if (maintenanceMode) { showToast(maintenanceMessage, 'warning'); return; }
            if (gymActive) { showToast('Тренировка уже идет!', 'warning'); return; }
            if (currentPlayer.level < 2) { showToast('Качалка доступна с 2 уровня!', 'warning'); return; }

            if (isGymUpgradeActive()) {
                showToast('Невозможно тренироваться во время прокачки качалки!', 'warning');
                return;
            }

            if (gymCooldownUntil > Date.now()) {
                showToast(`Тренировка доступна через ${formatTimerMinutes(gymCooldownUntil - Date.now())}`, 'warning');
                return;
            }

            const totalFighters = (currentPlayer.gang?.blats?.fighters || 0) + (currentPlayer.gang?.muzhiks?.fighters || 0) + (currentPlayer.gang?.fraers?.fighters || 0);
            if (totalFighters === 0) {
                showToast('У вас нет нанятых зеков в СИЗО! Сначала наймите бойцов.', 'warning');
                return;
            }

            gymActive = true;
            gymStartTime = Date.now();
            gymLastUpdateTime = Date.now();
            gymStrengthBonus = 0;
            gymDefenseBonus = 0;

            await playerDocRef.update({
                gymActive: true,
                gymStartTime: gymStartTime,
                gymLevel: gymLevel
            });

            if (gymInterval) clearInterval(gymInterval);
            gymInterval = setInterval(() => updateGymTraining(), 60000);

            showToast(`💪 Начата тренировка! Каждый час ваши бойцы будут увеличивать силу и защиту.`, 'success');
            renderGameModal();
            renderUI();
        }

        async function updateGymTraining() {
            if (!gymActive || !currentPlayer) return;
            const elapsed = Date.now() - gymStartTime;
            const totalDuration = getGymDuration();

            if (elapsed >= totalDuration) {
                await endGymTraining();
                return;
            }

            const minutesPassed = Math.floor((Date.now() - gymLastUpdateTime) / 60000);
            if (minutesPassed >= 1) {
                const totalFighters = (currentPlayer.gang?.blats?.fighters || 0) + (currentPlayer.gang?.muzhiks?.fighters || 0) + (currentPlayer.gang?.fraers?.fighters || 0);
                if (totalFighters === 0) {
                    await endGymTraining();
                    return;
                }

                let strengthIncrease = Math.floor(totalFighters * (0.5 + gymLevel * 0.1));
                let defenseIncrease = Math.floor(totalFighters * (0.3 + gymLevel * 0.05));

                gymStrengthBonus += strengthIncrease;
                gymDefenseBonus += defenseIncrease;

                currentPlayer.stats.strength += strengthIncrease;
                currentPlayer.stats.defense += defenseIncrease;

                await playerDocRef.update({
                    'stats.strength': firebase.firestore.FieldValue.increment(strengthIncrease),
                    'stats.defense': firebase.firestore.FieldValue.increment(defenseIncrease)
                });

                showToast(`💪 +${strengthIncrease} силы, +${defenseIncrease} защиты от тренировки!`, 'success');
                gymLastUpdateTime = Date.now();
                renderGameModal();
                renderUI();
            }
        }

        async function endGymTraining() {
            if (!gymActive) return;
            gymActive = false;
            if (gymInterval) { clearInterval(gymInterval); gymInterval = null; }
            gymCooldownUntil = Date.now() + 2 * 60 * 60 * 1000;
            if (gymCooldownInterval) clearInterval(gymCooldownInterval);
            gymCooldownInterval = setInterval(() => {
                if (gymCooldownUntil > 0 && Date.now() >= gymCooldownUntil) {
                    gymCooldownUntil = 0;
                    if (gymCooldownInterval) clearInterval(gymCooldownInterval);
                    showToast('💪 Тренировка снова доступна!', 'success');
                    renderUI();
                }
            }, 1000);
            await playerDocRef.update({ gymActive: false, gymStartTime: 0, gymCooldownUntil: gymCooldownUntil });
            showToast(`💪 Тренировка завершена! Следующая через 2 часа.`, 'success');
            renderGameModal();
            renderUI();

        async function restoreGym() {
            if (!currentPlayer) return;
            if (currentPlayer.gymActive) {
                const elapsed = Date.now() - (currentPlayer.gymStartTime || 0);
                if (elapsed < getGymDuration()) {
                    gymActive = true;
                    gymStartTime = currentPlayer.gymStartTime;
                    gymLevel = currentPlayer.gymLevel || 1;
                    gymLastUpdateTime = currentPlayer.gymLastUpdateTime || gymStartTime;
                    if (gymInterval) clearInterval(gymInterval);
                    gymInterval = setInterval(() => updateGymTraining(), 60000);
                    showToast('💪 Тренировка восстановлена!', 'success');
                } else {
                    await playerDocRef.update({ gymActive: false, gymStartTime: 0 });
                }
            }
            if (currentPlayer.gymCooldownUntil && currentPlayer.gymCooldownUntil > Date.now()) {
                gymCooldownUntil = currentPlayer.gymCooldownUntil;
                if (gymCooldownInterval) clearInterval(gymCooldownInterval);
                gymCooldownInterval = setInterval(() => {
                    if (gymCooldownUntil > 0 && Date.now() >= gymCooldownUntil) {
                        gymCooldownUntil = 0;
                        if (gymCooldownInterval) clearInterval(gymCooldownInterval);
                        showToast('💪 Тренировка снова доступна!', 'success');
                        renderUI();
                    }
                }, 1000);
            }
            gymLevel = currentPlayer.gymLevel || 1;
            if (currentPlayer.gymUpgradeStartTime && currentPlayer.gymUpgradeDuration) {
                gymUpgradeStartTime = currentPlayer.gymUpgradeStartTime;
                gymUpgradeDuration = currentPlayer.gymUpgradeDuration;
            }
        }

        async function startCardGameFromModal() {
            if (maintenanceMode) { showToast(maintenanceMessage, 'warning'); return; }
            if (cardGameActive) { showToast('Игра уже активна!', 'warning'); return; }
            if (!currentPlayer) return;

            if (isCardGameUpgradeActive()) {
                showToast('Невозможно играть во время прокачки карт!', 'warning');
                return;
            }

            if (cardGameCooldownUntil > Date.now()) {
                showToast(`Игра в карты доступна через ${formatTimerMinutes(cardGameCooldownUntil - Date.now())}`, 'warning');
                return;
            }
            if (currentPlayer.level < 2) {
                showToast(`Игра в карты доступна с 2 уровня! Ваш уровень: ${currentPlayer.level}`, 'warning');
                return;
            }
            const minEnergyRequired = Math.floor(currentPlayer.maxEnergy * 0.7);
            if (currentPlayer.energy < minEnergyRequired) {
                showToast(`Для игры нужно не менее 70% энергии! Сейчас: ${Math.floor(currentPlayer.energy / currentPlayer.maxEnergy * 100)}%`, 'warning');
                return;
            }
            const cigarettesCost = 200;
            if (currentPlayer.cigarettes < cigarettesCost) {
                showToast(`Не хватает ${cigarettesCost - currentPlayer.cigarettes} 🚬 для игры!`, 'error');
                return;
            }
            await playerDocRef.update({ cigarettes: firebase.firestore.FieldValue.increment(-cigarettesCost) });
            currentPlayer.cigarettes -= cigarettesCost;
            cardGameBonusPercent = getCardGameBonusFromLevel(currentPlayer.level);
            cardGameActive = true;
            cardGameStartTime = Date.now();
            currentCardImage = getRandomCardImage();
            await playerDocRef.update({
                cardGameActive: true, cardGameStartTime: cardGameStartTime,
                cardGameBonusPercent: cardGameBonusPercent, cardGameUpgradeLevel: cardGameUpgradeLevel
            });
            showToast(`🎴 Игра началась! Списано ${cigarettesCost}🚬. Бонус опыта: +${cardGameBonusPercent}%`, 'success');
            if (cardGameInterval) clearInterval(cardGameInterval);
            cardGameInterval = setInterval(() => updateCardGameExperience(), 10000);
            showActiveGameBadge();
            renderGameModal();
            renderUI();
        }

        async function upgradeCardGameFromModal() {
            if (maintenanceMode) { showToast(maintenanceMessage, 'warning'); return; }
            if (cardGameUpgradeLevel >= 10) { showToast('Максимальный уровень прокачки!', 'warning'); return; }

            if (isCardGameUpgradeActive()) {
                showToast('Прокачка уже идет! Дождитесь завершения.', 'warning');
                return;
            }

            if (cardGameActive) {
                showToast('Невозможно улучшить во время игры!', 'warning');
                return;
            }

            const upgradeCost = 100 * cardGameUpgradeLevel;
            if (currentPlayer.cigarettes < upgradeCost) { showToast(`Не хватает ${upgradeCost - currentPlayer.cigarettes} 🚬!`, 'error'); return; }

            await playerDocRef.update({ cigarettes: firebase.firestore.FieldValue.increment(-upgradeCost) });
            currentPlayer.cigarettes -= upgradeCost;

            let upgradeDurationMs = 2 * 60 * 1000;
            upgradeDurationMs = Math.floor(upgradeDurationMs * (1 + (cardGameUpgradeLevel - 1) * 0.1));
            const upgradeStartTime = Date.now();

            await playerDocRef.update({
                cardGameUpgradeStartTime: upgradeStartTime,
                cardGameUpgradeDuration: upgradeDurationMs
            });
            cardGameUpgradeStartTime = upgradeStartTime;
            cardGameUpgradeDuration = upgradeDurationMs;

            showToast(`⏳ Начата прокачка карт! Уровень повысится через ${Math.round(upgradeDurationMs / 60000)} мин.`, 'success');
            renderGameModal();
            renderUI();
        }

        async function startWarFromModal(targetClanId) {
            if (maintenanceMode) { showToast(maintenanceMessage, 'warning'); return; }

                showToast('Только главарь клана может начать войну!', 'error');

                return;
            }
            if (activeWar) {
                showToast('Уже идет война!', 'warning');
                closeAttackModal();
                return;
            }
            const now = Date.now();
            if (lastAttackTime && (now - lastAttackTime) < attackCooldownHours * 60 * 60 * 1000) {
                showToast(`Атака доступна раз в ${attackCooldownHours} часов.`, 'warning');
                closeAttackModal();
                return;
            }
            const targetClan = allClans.find(c => c.id === targetClanId);
            if (!targetClan) return;
            if (targetClan.defenseUntil && targetClan.defenseUntil > Date.now()) {
                showToast(`Клан ${targetClan.name} под защитой!`, 'warning');
                closeAttackModal();
                return;
            }
            const myClan = allClans.find(c => c.id === currentPlayer.clanId);
            const myPower = myClan.totalPower || 0;
            const enemyPower = targetClan.totalPower || 0;
            let attackerWon = myPower > enemyPower;
            let stolenCigarettes = Math.floor((targetClan.cigarettes || 0) * (attackerWon ? 0.3 : 0.1));
            let stolenRubles = Math.floor((targetClan.rubles || 0) * (attackerWon ? 0.2 : 0.05));
            activeWar = {
                attackerClanId: currentPlayer.clanId,
                attackerClanName: myClan.name,
                defenderClanId: targetClan.id,
                defenderClanName: targetClan.name,
                attackerWon: attackerWon,
                stolenCigarettes: stolenCigarettes,
                stolenRubles: stolenRubles,
                endTime: Date.now() + warDurationHours * 60 * 60 * 1000
            };
            await db.collection('activeWars').doc('current').set(activeWar);
            await playerDocRef.update({ lastAttackTime: now });
            lastAttackTime = now;
            await notifyClanMembers(targetClan.id, `⚠️ Клан "${myClan.name}" объявил войну вашему клану!`);
            await notifyClanMembers(currentPlayer.clanId, `⚔️ Ваш клан атакует клан "${targetClan.name}"!`);
            showToast(`⚔️ Война объявлена клану ${targetClan.name}!`, 'success');
            closeAttackModal();
            renderUI();
        }
