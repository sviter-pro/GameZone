<!DOCTYPE html>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #0a0e1a;
            background-image: url('https://sviter-pro.github.io/GameZone/src/test/123.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', system-ui, sans-serif;
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            padding-top: 85px;
            padding-bottom: 85px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        @keyframes logoPulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }
        @keyframes btnGlow {
            0% { box-shadow: 0 0 0 0 rgba(233, 69, 96, 0.4); }
            70% { box-shadow: 0 0 0 8px rgba(233, 69, 96, 0); }
            100% { box-shadow: 0 0 0 0 rgba(233, 69, 96, 0); }
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #1a1a2e; }
        ::-webkit-scrollbar-thumb { background: #e94560; border-radius: 4px; }

        /* НОВЫЙ ЭКРАН ЗАГРУЗКИ С ЛОГОТИПОМ */
        .loading-screen-new {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #0a0e1a;
            background-image: radial-gradient(circle at 25% 40%, rgba(233, 69, 96, 0.15) 0%, rgba(10, 14, 26, 0.95) 90%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            backdrop-filter: blur(4px);
        }
        .loading-logo {
            width: 180px;
            height: auto;
            margin-bottom: 30px;
            animation: logoPulse 1.8s ease-in-out infinite;
            filter: drop-shadow(0 0 20px rgba(233, 69, 96, 0.5));
        }
        .loading-spinner-new {
            width: 48px;
            height: 48px;
            border: 3px solid rgba(233, 69, 96, 0.25);
            border-top-color: #e94560;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 24px;
        }
        .loading-tip-new {
            background: rgba(26, 26, 46, 0.9);
            backdrop-filter: blur(12px);
            padding: 14px 24px;
            border-radius: 60px;
            max-width: 320px;
            text-align: center;
            font-size: 14px;
            color: #ffd93d;
            border: 1px solid rgba(233, 69, 96, 0.4);
            font-weight: 500;
            box-shadow: 0 0 15px rgba(0,0,0,0.3);
        }
        .loading-version {
            position: absolute;
            bottom: 30px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 11px;
            color: rgba(255,255,255,0.4);
            letter-spacing: 1px;
        }

        /* ========== НЕПОДВИЖНАЯ ВЕРХНЯЯ ПАНЕЛЬ ========== */
        .fixed-top-bar {
            position: fixed;
            top: 0;
            left: -20px;
            right: 0;
            z-index: 1000;
            background: rgba(10, 14, 26, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(233, 69, 96, 0.3);
            padding: 12px 20px;
        }
        .top-bar-content {
            max-width: 550px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        .caste-info {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 60px;
            cursor: pointer;
            transition: 0.1s;
        }
        .caste-info:active { transform: scale(0.96); }
        .caste-icon { font-size: 32px; }
        .caste-level { font-size: 10px; color: #aaa; margin-top: 2px; }
        .resources-center {
            display: flex;
            gap: 12px;
            flex-wrap: nowrap;
            justify-content: center;
            flex: 1;

        .resource-item {
            background: rgba(30, 36, 64, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 40px;
            padding: 6px 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 600;
            border: 1px solid rgba(233, 69, 96, 0.2);
            white-space: nowrap;
        }
        .resource-item span:first-child { font-size: 14px; }
        .settings-btn {
            background: rgba(30, 36, 64, 0.8);
            border: none;
            padding: 8px 14px;
            border-radius: 40px;
            font-size: 20px;
            cursor: pointer;
            color: white;
            backdrop-filter: blur(10px);
            transition: 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .settings-btn:active { transform: scale(0.96); background: rgba(233,69,96,0.3); }

        /* ========== НЕПОДВИЖНАЯ НИЖНЯЯ ПАНЕЛЬ ========== */
        .fixed-bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 1000;

            border-top: 1px solid rgba(233, 69, 96, 0.3);
            padding: 12px 16px;
            padding-bottom: max(12px, env(safe-area-inset-bottom));
        }
        .bottom-nav {
            max-width: 550px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-around;
            gap: 8px;
        }
        .nav-btn {
            background: transparent;
            border: none;
            border-radius: 50px;
            padding: 10px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            color: #8e8ea0;
            font-size: 12px;
            font-weight: 500;
            min-width: 60px;
        }
        .nav-btn span:first-child {
            font-size: 24px;
            transition: transform 0.2s;
        }
        .nav-btn span:last-child {
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 0.3px;
        }
        .nav-btn.active {
            background: linear-gradient(135deg, rgba(233, 69, 96, 0.25), rgba(199, 62, 84, 0.2));
            color: #fff;
            box-shadow: 0 0 15px rgba(233, 69, 96, 0.4);
            border: 1px solid rgba(233, 69, 96, 0.5);
            animation: btnGlow 1.5s infinite;
        }
        .nav-btn.active span:first-child {
            transform: scale(1.1);
            text-shadow: 0 0 8px rgba(233, 69, 96, 0.8);
        }
        .nav-btn:active {
            transform: scale(0.94);
            background: rgba(233, 69, 96, 0.25);
        }

        .game-container {
            max-width: 550px;
            width: 100%;
            margin: 0 auto;
            border-radius: 48px;
            padding: 20px 16px 24px;
            position: relative;
        }

        /* ========== СТИЛИ КАРТЫ ========== */
        .map-wrapper {
            position: fixed;
            width: 100%;
            max-width: 100%;
            margin: 0px -184px;
            margin-top: -287px;
        }
        .building {
            position: absolute;
            border: 2px solid transparent;
            border-radius: 18px;
            cursor: pointer;
            transition: 0.25s;
            background: rgba(0,0,0,0.3);
        }
        .building:hover { background: rgba(255, 180, 70, 0.2); border-color: rgba(255, 180, 70, 0.4); }
        .building.active {
            border: 3px solid #ffb347;
            box-shadow: 0 0 25px rgba(255, 180, 70, 0.9), inset 0 0 25px rgba(255, 180, 70, 0.3);
            background: rgba(255, 180, 70, 0.2);
        }
        .building-label {
            position: absolute;
            left: 50%;
            top: -36px;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9);
            border: 1px solid #ffb347;
            color: #ffcf7a;
            padding: 6px 12px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: bold;
            opacity: 0;
            pointer-events: none;
            transition: 0.25s;
            white-space: nowrap;
            box-shadow: 0 0 20px rgba(255, 180, 70, 0.5);
            z-index: 100;
        }
        .building:hover .building-label {
            opacity: 0.7;
            top: -44px;
        }
        .building.active .building-label {
            opacity: 1;
            top: -48px;
        }
        /* Оригинальные позиции зданий */
        .b1 { top: 6%; left: 31%; width: 38%; height: 12%; }  /* Камера (Карцер) */
        .b2 { top: 18%; left: 3%; width: 33%; height: 15%; }   /* Шахта */
        .b3 { top: 18%; right: 5%; width: 28%; height: 13%; }  /* Картежка */
        .b4 { top: 33%; left: 28%; width: 42%; height: 14%; }   /* Магазин (Бараки) */
        .b5 { top: 49%; left: 4%; width: 34%; height: 16%; }    /* Общак (Промзона) */
        .b6 { top: 51%; right: 4%; width: 34%; height: 15%; }   /* Сходка */
        .b7 { top: 68%; left: 31%; width: 37%; height: 11%; }   /* Ларек */

        @media (max-width: 768px) {
            .building-label { font-size: 10px; padding: 4px 8px; top: -30px; }
            .building:hover .building-label { top: -36px; }
            .building.active .building-label { top: -38px; }
            .resources-center { gap: 6px; }
            .resource-item { padding: 4px 8px; font-size: 11px; }
            .resource-item span:first-child { font-size: 12px; }
            .caste-icon { font-size: 26px; }
            .nav-btn { padding: 8px 10px; min-width: 50px; }
            .nav-btn span:first-child { font-size: 20px; }
            .nav-btn span:last-child { font-size: 9px; }
            .map-wrapper { min-height: 500px; }
        }

        /* ========== СТИЛИ ДЛЯ ОКНА ИНВЕНТАРЯ ========== */
        .inventory-fullscreen, .mine-fullscreen {

            top: 0;

            right: 0;
            bottom: 0;

        }
        .inventory-tab-btn, .mine-tab-btn {
            background: transparent;

            padding: 10px 16px;

        .inventory-tab-btn span:first-child, .mine-tab-btn span:first-child { font-size: 24px; transition: transform 0.2s; }
        .inventory-tab-btn span:last-child, .mine-tab-btn span:last-child { font-size: 10px; font-weight: 500; }
        .inventory-tab-btn.active, .mine-tab-btn.active {
            background: linear-gradient(135deg, rgba(233, 69, 96, 0.25), rgba(199, 62, 84, 0.2));

        .inventory-tab-btn.active span:first-child, .mine-tab-btn.active span:first-child { transform: scale(1.1); text-shadow: 0 0 8px rgba(233, 69, 96, 0.8); }
        .inventory-tab-btn:active, .mine-tab-btn:active { transform: scale(0.94); background: rgba(233, 69, 96, 0.25); }
        .inventory-content-area, .mine-content-area {
            flex: 1;

        }
        .inventory-card, .mine-card {
            background: rgba(30, 36, 64, 0.7);

        }
        .inventory-row, .mine-row {

        .inventory-row:last-child, .mine-row:last-child {

        .inventory-label, .mine-label {

        }
        .inventory-value, .mine-value {
            font-size: 14px;

            color: #ffd93d;
        }
        .tattoo-item {
            padding: 10px 12px;

        }
        .mine-resource-block {
            background: rgba(30, 36, 64, 0.5);

        }
        .mine-timer-text {

        .btn-secondary {
            background: rgba(30, 36, 64, 0.8);
            border: 1px solid rgba(233, 69, 96, 0.3);

            border-radius: 40px;
            font-size: 13px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: 0.1s;
        }
        .btn-secondary:active { transform: scale(0.96); background: rgba(233,69,96,0.2); }
        .btn-primary {
            background: linear-gradient(135deg, #e94560, #c73e54);
            border: none;
            padding: 10px 16px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: 0.1s;
        }
        .btn-primary:active { transform: scale(0.96); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    function openMineModal() {
        if (maintenanceMode) { showToast(maintenanceMessage, 'warning'); return; }

        const paperLevel = currentPlayer.mine?.paperLevel || 1;
        const makhorkaLevel = currentPlayer.mine?.makhorkaLevel || 1;

        const mineAvailable = timeLeft <= 0;
        const timerText = mineAvailable ? 'Готово!' : formatMineTime(timeLeft);
        
        const upgradeCostPaper = 50 * paperLevel;
        const upgradeCostMakhorka = 50 * makhorkaLevel;
        const needPaper = currentPlayer.cigarettes < upgradeCostPaper ? upgradeCostPaper - currentPlayer.cigarettes : 0;
        const needMakhorka = currentPlayer.cigarettes < upgradeCostMakhorka ? upgradeCostMakhorka - currentPlayer.cigarettes : 0;
        
        const modalHtml = `
            <div class="mine-fullscreen" id="mineFullscreen">
                <div class="mine-header-bar">
                    <div class="mine-header-content">
                        <div class="mine-header-title">⛏️ ШАХТА</div>
                    </div>
                </div>
                <div class="mine-content-area" id="mineContentArea">
                    <div class="mine-card">
                        <div class="mine-resource-block">
                            <div>📄 Бумага: ур.${paperLevel} (добыча: ${5*paperLevel}/час)</div>
                            <button class="btn-secondary" onclick="upgradeMineFromModal('paper')" style="margin-top:10px; width:100%;" ${currentPlayer.cigarettes < upgradeCostPaper ? 'disabled' : ''}>⬆️ Улучшить (${upgradeCostPaper}🚬)${needPaper > 0 ? ` ❌ не хватает ${needPaper}` : ''}</button>
                        </div>
                        <div class="mine-resource-block">
                            <div>🌿 Махорка: ур.${makhorkaLevel} (добыча: ${3*makhorkaLevel}/час)</div>
                            <button class="btn-secondary" onclick="upgradeMineFromModal('makhorka')" style="margin-top:10px; width:100%;" ${currentPlayer.cigarettes < upgradeCostMakhorka ? 'disabled' : ''}>⬆️ Улучшить (${upgradeCostMakhorka}🚬)${needMakhorka > 0 ? ` ❌ не хватает ${needMakhorka}` : ''}</button>
                        </div>
                        <div style="display:flex; justify-content:space-around; margin:15px 0; padding:10px; background:rgba(0,0,0,0.3); border-radius:16px;">
                            <div>📄 Бумаги: ${currentPlayer.mine?.paper || 0}</div>
                            <div>🌿 Махорки: ${currentPlayer.mine?.makhorka || 0}</div>
                        </div>
                        <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:16px 0;">
                            <button id="mineButton" class="btn-primary" onclick="mineResourcesFromModal()" ${!mineAvailable ? 'disabled' : ''}>⛏️ Добыть ${!mineAvailable ? `(${timerText})` : ''}</button>
                            <button class="btn-secondary" onclick="exchangeToCigarettesFromModal()">🔄 Обменять</button>
                        </div>
                        ${!mineAvailable ? `<div class="mine-timer-text">⏳ До следующей добычи: <span id="mineTimerText">${timerText}</span></div>` : ''}

        if (!mineAvailable && mineTimerInterval) clearInterval(mineTimerInterval);

            mineTimerInterval = setInterval(() => {

    async function upgradeMineFromModal(type) {
        if (maintenanceMode) { showToast(maintenanceMessage, 'warning'); return; }
        const level = currentPlayer.mine[`${type}Level`] || 1;
        const cost = 50 * level;
        if (currentPlayer.cigarettes < cost) { showToast(`Не хватает ${cost - currentPlayer.cigarettes} 🚬! Нужно ${cost}`, 'error'); return; }
        await playerDocRef.update({ cigarettes: firebase.firestore.FieldValue.increment(-cost), [`mine.${type}Level`]: level + 1 });
        currentPlayer.cigarettes -= cost;
        currentPlayer.mine[`${type}Level`] = level + 1;
        await updateQuestProgress('mineUpgrade', 1);
        showToast(`✅ Уровень повышен до ${level + 1}!`, 'success');
        closeMineModal();
        renderUI();
    }
    
    async function mineResourcesFromModal() {
        if (maintenanceMode) { showToast(maintenanceMessage, 'warning'); return; }
        const now = Date.now();
        const lastMine = currentPlayer.mine?.lastMineTime || 0;
        const paperLevel = currentPlayer.mine?.paperLevel || 1;
        const cooldownMs = getMineCooldownHours(paperLevel) * 60 * 60 * 1000;
        if ((now - lastMine) < cooldownMs) { showToast('Шахта отдыхает!', 'warning'); return; }
        let paperGain = 5 * paperLevel;
        let makhorkaGain = 3 * (currentPlayer.mine?.makhorkaLevel || 1);
        if (currentPlayer.caste === 'Мужики') { paperGain = Math.floor(paperGain * 1.05); makhorkaGain = Math.floor(makhorkaGain * 1.05); }
        await playerDocRef.update({
            'mine.paper': (currentPlayer.mine?.paper || 0) + paperGain,
            'mine.makhorka': (currentPlayer.mine?.makhorka || 0) + makhorkaGain,
            'mine.lastMineTime': now
        });
        currentPlayer.mine.paper += paperGain;
        currentPlayer.mine.makhorka += makhorkaGain;
        currentPlayer.mine.lastMineTime = now;
        await updateQuestProgress('mine', paperGain + makhorkaGain);
        showToast(`⛏️ Добыто: +${paperGain}📄, +${makhorkaGain}🌿`, 'success');
        closeMineModal();
        renderUI();
    }
    
    async function exchangeToCigarettesFromModal() {
        if (maintenanceMode) { showToast(maintenanceMessage, 'warning'); return; }
        const paper = currentPlayer.mine?.paper || 0;
        const makhorka = currentPlayer.mine?.makhorka || 0;
        if (paper === 0 && makhorka === 0) { showToast('Нет ресурсов!', 'warning'); return; }
        const paperRate = getExchangeRate(currentPlayer.mine?.paperLevel || 1, 'paper');
        const makhorkaRate = getExchangeRate(currentPlayer.mine?.makhorkaLevel || 1, 'makhorka');
        const gain = (paper * paperRate) + (makhorka * makhorkaRate);
        await playerDocRef.update({ cigarettes: firebase.firestore.FieldValue.increment(gain), 'mine.paper': 0, 'mine.makhorka': 0 });
        currentPlayer.cigarettes += gain;
        currentPlayer.mine.paper = 0;
        currentPlayer.mine.makhorka = 0;
        showToast(`🔄 Обмен: +${gain}🚬`, 'success');
        closeMineModal();
        renderUI();
    }

    let currentQuestsTab = 1;

    function initQuestsSlider() {
        const slider = document.querySelector('.quests-slider');
        if (!slider) return;
        slider.style.transform = `translateX(-${(currentQuestsTab - 1) * 100}%)`;
        document.querySelectorAll('.quests-tab-btn').forEach((btn, idx) => {
            if (idx === 0) return;
            if (idx === currentQuestsTab) btn.classList.add('active');
            else btn.classList.remove('active');
        });
    }

    function switchQuestsTab(index) {
        if (index === 0) {
            closeQuestsModal();
            return;
        }
        currentQuestsTab = index;
        const slider = document.querySelector('.quests-slider');
        if (slider) slider.style.transform = `translateX(-${(currentQuestsTab - 1) * 100}%)`;
        document.querySelectorAll('.quests-tab-btn').forEach((btn, idx) => {
            if (idx === 0) return;
            if (idx === currentQuestsTab) btn.classList.add('active');
            else btn.classList.remove('active');
        });
        if (currentQuestsTab === 1) renderStoryPage();
        if (currentQuestsTab === 2) renderDailyPage();
        if (currentQuestsTab === 3) renderPremiumPage();
    }

    function handleTouchStart(e) {
        touchStartX = e.changedTouches[0].screenX;
    }
    function handleTouchEnd(e) {
        touchEndX = e.changedTouches[0].screenX;
        const diff = touchStartX - touchEndX;
        if (Math.abs(diff) < 50) return;
        if (diff > 0 && currentQuestsTab < 3) switchQuestsTab(currentQuestsTab + 1);
        if (diff < 0 && currentQuestsTab > 1) switchQuestsTab(currentQuestsTab - 1);
    }

                </div>

        initQuestsSlider();

    function renderStoryPage() {
        const container = document.getElementById('questsStoryPage');
        if (!container) return;
        
        const storyQuests = [
            { id: 'story_1', title: 'Первые шаги', description: 'Достигните 5 уровня', requirement: 5, current: currentPlayer?.level || 1, reward: 500, type: 'cigarettes' },
            { id: 'story_2', title: 'Сила духа', description: 'Накопите 1000 авторитета', requirement: 1000, current: currentPlayer?.authority || 0, reward: 1000, type: 'cigarettes' },
            { id: 'story_3', title: 'Верный друг', description: 'Вступите в клан', requirement: 1, current: currentPlayer?.clanId ? 1 : 0, reward: 2000, type: 'cigarettes' },
            { id: 'story_4', title: 'Мастер шахты', description: 'Улучшите шахту до 3 уровня', requirement: 3, current: currentPlayer?.mine?.paperLevel || 1, reward: 1500, type: 'rubles' },
            { id: 'story_5', title: 'Легенда зоны', description: 'Достигните 10 уровня', requirement: 10, current: currentPlayer?.level || 1, reward: 3000, type: 'rubles' }
        ];
        
        let html = '';
        storyQuests.forEach(quest => {
            const isCompleted = (quest.current >= quest.requirement);
            const progressPercent = Math.min(100, (quest.current / quest.requirement) * 100);
            const rewardText = quest.type === 'cigarettes' ? `${quest.reward} 🚬` : `${quest.reward} 💰`;
            const isClaimed = completedQuests.includes(quest.id);
            
            html += `
                <div class="quest-card">
                    <div class="quest-card-header">
                        <div class="quest-card-title">${quest.title}</div>
                        <div class="quest-card-reward">🎁 ${rewardText}</div>
                    </div>
                    <div class="quest-card-desc">${quest.description}</div>
                    <div class="quest-progress">
                        <div class="quest-progress-fill" style="width: ${progressPercent}%"></div>
                    </div>
                    <div class="quest-stats">
                        <span>${quest.current}/${quest.requirement}</span>
                        ${isClaimed ? '<span style="color:#28a745;">✓ Получено</span>' : (isCompleted ? `<button class="quest-claim-btn" onclick="claimStoryQuest('${quest.id}', ${quest.reward}, '${quest.type}')">🎁 Забрать</button>` : '<span style="color:#aaa;">Не выполнено</span>')}
                    </div>
                </div>
            `;
        });
        
        container.innerHTML = html || '<div style="text-align:center; padding:40px;">Нет сюжетных заданий</div>';
    }
    
    function renderDailyPage() {
        const container = document.getElementById('questsDailyPage');
        if (!container) return;
        
        const nextBonusTime = getNextBonusTime();
        const canClaim = nextBonusTime <= 0 && (dailyBonus.lastClaimDay || 0) < 30;
        const currentDay = (dailyBonus.lastClaimDay || 0) + 1;
        const bonusAmount = currentDay <= 30 ? getDailyBonusAmount(currentDay) : 0;

    // ========== ФУНКЦИИ ДЛЯ ИГРЫ В КАРТЫ ==========
    function getRandomCardImage() { return cardImages[Math.floor(Math.random() * cardImages.length)]; }
    function getCardGameBonusFromLevel(level) {
        let baseBonus = 10 + Math.floor(level * 2);
        let upgradeBonus = Math.floor(cardGameUpgradeLevel * 5);
        return Math.min(300, baseBonus + upgradeBonus);
    }
    function getCardGameEnergyCost() { return Math.max(2, 5 - Math.floor(cardGameUpgradeLevel / 3)); }
    function getCardGameRewardBonus() {
        return {
            chance: Math.min(50, 10 + cardGameUpgradeLevel * 4),
            cigarettesMin: 10 + cardGameUpgradeLevel * 2,
            cigarettesMax: 30 + cardGameUpgradeLevel * 5,
            rublesMin: 1 + Math.floor(cardGameUpgradeLevel / 2),
            rublesMax: 5 + cardGameUpgradeLevel
        };
    }
    function formatCooldownTime(ms) {
        if (ms <= 0) return "Готово!";
        const hours = Math.floor(ms / 3600000);
        const minutes = Math.floor((ms % 3600000) / 60000);
        const seconds = Math.floor((ms % 60000) / 1000);
        if (hours > 0) return `${hours}ч ${minutes}м`;
        if (minutes > 0) return `${minutes}м ${seconds}с`;
        return `${seconds}с`;
    }
    function formatGameTime(ms) {
        if (ms <= 0) return "00:00";
        const totalSeconds = Math.floor(ms / 1000);
        const minutes = Math.floor(totalSeconds / 60);
        const seconds = totalSeconds % 60;
        return `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
    }
    
    function startCardGameCooldown() {
        if (cardGameCooldownInterval) clearInterval(cardGameCooldownInterval);
        cardGameCooldownInterval = setInterval(() => {
            if (cardGameCooldownUntil > 0 && Date.now() >= cardGameCooldownUntil) {
                cardGameCooldownUntil = 0;
                if (cardGameCooldownInterval) clearInterval(cardGameCooldownInterval);
                renderUI();
                showToast('🃏 Теперь вы снова можете играть в карты!', 'success');
            }
            renderUI();
        }, 1000);
    }

    async function startCardGame() {
        if (maintenanceMode) { showToast(maintenanceMessage, 'warning'); return; }
        if (cardGameActive) { showToast('Игра уже активна!', 'warning'); openCardGameModal(); return; }
        if (!currentPlayer) return;
        if (cardGameCooldownUntil > Date.now()) {
            showToast(`Игра в карты доступна через ${formatCooldownTime(cardGameCooldownUntil - Date.now())}`, 'warning');
            return;
        }
        if (currentPlayer.level < 5) {
            showToast(`Игра в карты доступна с 5 уровня! Ваш уровень: ${currentPlayer.level}`, 'warning');
            return;
        }
        const minEnergyRequired = Math.floor(currentPlayer.maxEnergy * 0.7);
        if (currentPlayer.energy < minEnergyRequired) {
            showToast(`Для игры нужно не менее 70% энергии! Сейчас: ${Math.floor(currentPlayer.energy / currentPlayer.maxEnergy * 100)}%`, 'warning');
            return;
        }
        const cigarettesCost = 200;
        if (currentPlayer.cigarettes < cigarettesCost) {
            showToast(`Не хватает ${cigarettesCost - currentPlayer.cigarettes} 🚬 для игры!`, 'error');
            return;
        }
        await playerDocRef.update({ cigarettes: firebase.firestore.FieldValue.increment(-cigarettesCost) });
        currentPlayer.cigarettes -= cigarettesCost;
        cardGameBonusPercent = getCardGameBonusFromLevel(currentPlayer.level);
        cardGameActive = true;
        cardGameStartTime = Date.now();
        currentCardImage = getRandomCardImage();
        await playerDocRef.update({
            cardGameActive: true, cardGameStartTime: cardGameStartTime,
            cardGameBonusPercent: cardGameBonusPercent, cardGameUpgradeLevel: cardGameUpgradeLevel
        });
        showToast(`🎴 Игра началась! Списано ${cigarettesCost}🚬. Бонус опыта: +${cardGameBonusPercent}%`, 'success');
        openCardGameModal();
        if (cardGameInterval) clearInterval(cardGameInterval);
        cardGameInterval = setInterval(() => updateCardGameExperience(), 10000);
        showActiveGameBadge();
    }

    async function updateCardGameExperience() {
        if (!cardGameActive || !currentPlayer) return;
        const elapsed = Date.now() - cardGameStartTime;
        if (elapsed >= cardGameDuration) { await endCardGame(); return; }
        const energyCost = getCardGameEnergyCost();
        if (currentPlayer.energy >= energyCost) {
            currentPlayer.energy -= energyCost;
            await playerDocRef.update({ energy: currentPlayer.energy });
            let baseExp = 15 + Math.floor(Math.random() * 20);
            let bonusExp = Math.floor(baseExp * (cardGameBonusPercent / 100));
            let totalExp = baseExp + bonusExp;
            const rewardBonus = getCardGameRewardBonus();
            if (Math.random() * 100 < rewardBonus.chance) {
                const isCigarettes = Math.random() > 0.5;
                if (isCigarettes) {
                    const cigGain = Math.floor(Math.random() * (rewardBonus.cigarettesMax - rewardBonus.cigarettesMin + 1) + rewardBonus.cigarettesMin);
                    currentPlayer.cigarettes += cigGain;
                    await playerDocRef.update({ cigarettes: firebase.firestore.FieldValue.increment(cigGain) });
                    showToast(`🎉 ВЫИГРЫШ! +${cigGain}🚬`, 'success');
                } else {
                    const rubGain = Math.floor(Math.random() * (rewardBonus.rublesMax - rewardBonus.rublesMin + 1) + rewardBonus.rublesMin);
                    currentPlayer.rubles += rubGain;
                    await playerDocRef.update({ rubles: firebase.firestore.FieldValue.increment(rubGain) });
                    showToast(`🎉 ВЫИГРЫШ! +${rubGain}💰`, 'success');
                }
            }
            let newAuthority = currentPlayer.authority + totalExp;
            let newLevel = currentPlayer.level;
            let leveledUp = false;
            let newAuthorityToNext = currentPlayer.authorityToNext;
            let newMaxEnergy = currentPlayer.maxEnergy;
            let newStrength = currentPlayer.stats.strength;
            let newDefense = currentPlayer.stats.defense;
            if (newAuthority >= currentPlayer.authorityToNext) {
                newLevel++; newAuthority = 0;
                newAuthorityToNext = Math.floor(currentPlayer.authorityToNext * 1.5);
                newMaxEnergy = currentPlayer.maxEnergy + 5;
                newStrength = currentPlayer.stats.strength + 3;
                newDefense = currentPlayer.stats.defense + 2;
                leveledUp = true;
                cardGameBonusPercent = getCardGameBonusFromLevel(newLevel);
                await playerDocRef.update({ cardGameBonusPercent: cardGameBonusPercent });
            }
            await playerDocRef.update({
                authority: newAuthority, level: newLevel, authorityToNext: newAuthorityToNext,
                maxEnergy: newMaxEnergy, 'stats.strength': newStrength, 'stats.defense': newDefense
            });
            currentPlayer.authority = newAuthority; currentPlayer.level = newLevel;
            currentPlayer.authorityToNext = newAuthorityToNext; currentPlayer.maxEnergy = newMaxEnergy;
            currentPlayer.stats.strength = newStrength; currentPlayer.stats.defense = newDefense;
            if (leveledUp) showToast(`🎉 УРОВЕНЬ ${newLevel}! +5 эн., +3 силы, +2 защиты!`, 'success');
            await updateQuestProgress('authority', totalExp);
            renderUI();
        }
    }

    async function endCardGame() {
        if (!cardGameActive) return;
        cardGameActive = false;
        if (cardGameInterval) { clearInterval(cardGameInterval); cardGameInterval = null; }
        if (cardGameTimerUpdate) { clearInterval(cardGameTimerUpdate); cardGameTimerUpdate = null; }
        cardGameCooldownUntil = Date.now() + 3600000;
        await playerDocRef.update({ cardGameActive: false, cardGameStartTime: 0, cardGameBonusPercent: 0, cardGameCooldownUntil: cardGameCooldownUntil });
        startCardGameCooldown();
        if (cardGameModalOpen) { closeModal(); cardGameModalOpen = false; }
        const badge = document.getElementById('activeGameBadge');
        if (badge) badge.remove();
        showToast('🎴 Игра завершена! Следующая игра доступна через 1 час.', 'success');
        renderUI();
    }

        if (!cardGameActive) return;
        cardGameModalOpen = true;

        const modalHtml = `
            <div class="modal">
                <div class="modal-content" style="text-align:center;">
                    <div class="modal-header">
                        <div class="modal-title">🎴 Игра в карты</div>
                        <button class="close-btn" onclick="closeCardGameModal()">✕</button>
                    </div>
                    <img class="card-game-image" src="${currentCardImage}" alt="Card Game">
                    <div class="game-timer" id="cardGameTimer">${formatGameTime(timeLeft)}</div>
                    <div class="bonus-info">🎯 Бонус опыта от уровня: +${cardGameBonusPercent}%</div>
                    <div class="bonus-info">⚡ Расход энергии за тик: ${getCardGameEnergyCost()}</div>
                    <div class="bonus-info exp-gain">🎴 Игра активна... Опыт начисляется каждые 10 секунд</div>
                    <div class="bonus-info energy-info">⚡ Энергия: ${currentPlayer.energy}/${currentPlayer.maxEnergy}</div>
                    <button class="btn-secondary" onclick="closeCardGameModal()" style="margin-top:15px; width:100%;">🔽 Свернуть (игра продолжится в фоне)</button>
                </div>
            </div>
        `;
        document.body.insertAdjacentHTML('beforeend', modalHtml);
        if (tg) tg.BackButton.show();
        if (cardGameTimerUpdate) clearInterval(cardGameTimerUpdate);
        cardGameTimerUpdate = setInterval(() => {
            const modal = document.querySelector('.modal');
            if (!modal || !cardGameActive) {
                if (cardGameTimerUpdate) clearInterval(cardGameTimerUpdate);
                if (!cardGameActive && cardGameModalOpen) cardGameModalOpen = false;
                return;
            }
            const timerEl = document.getElementById('cardGameTimer');
            if (timerEl) {
                const remaining = Math.max(0, cardGameDuration - (Date.now() - cardGameStartTime));
                timerEl.textContent = formatGameTime(remaining);
                if (remaining <= 0 && cardGameActive) endCardGame();
            }
        }, 1000);
    }

    function closeCardGameModal() {
        closeModal();
        cardGameModalOpen = false;
        if (tg) tg.BackButton.hide();
        showActiveGameBadge();
        showToast('🎴 Игра продолжается в фоне!', 'success');
    }

    async function restoreCardGame() {
        if (!currentPlayer || !currentPlayer.cardGameActive) return;
        const elapsed = Date.now() - (currentPlayer.cardGameStartTime || 0);
        if (elapsed < cardGameDuration) {
            cardGameActive = true;
            cardGameStartTime = currentPlayer.cardGameStartTime;
            cardGameBonusPercent = currentPlayer.cardGameBonusPercent || getCardGameBonusFromLevel(currentPlayer.level);
            cardGameUpgradeLevel = currentPlayer.cardGameUpgradeLevel || 1;
            currentCardImage = getRandomCardImage();
            if (cardGameInterval) clearInterval(cardGameInterval);
            cardGameInterval = setInterval(() => updateCardGameExperience(), 10000);
            showActiveGameBadge();
            showToast('🎴 Игра восстановлена!', 'success');
        } else {
            await playerDocRef.update({ cardGameActive: false, cardGameStartTime: 0, cardGameBonusPercent: 0 });
        }
        if (currentPlayer.cardGameCooldownUntil && currentPlayer.cardGameCooldownUntil > Date.now()) {
            cardGameCooldownUntil = currentPlayer.cardGameCooldownUntil;
            startCardGameCooldown();
        }
    }

    async function sendTelegramNotification(telegramId, message) {
        if (!tg || !telegramId) return false;
        try { tg.sendData(JSON.stringify({ type: 'notification', telegramId: telegramId, message: message })); return true; } catch(e) { return false; }
    }
    async function notifyClanMembers(clanId, message, excludePlayerId = null) {
        if (!clanId) return;
        try {
            const clanDoc = await db.collection('clans').doc(clanId).get();
            if (clanDoc.exists) {
                for (const memberId of clanDoc.data().membersIds || []) {
                    if (excludePlayerId && memberId === excludePlayerId) continue;
                    const memberDoc = await db.collection('players').doc(memberId).get();
                    if (memberDoc.exists && memberDoc.data().telegramId) await sendTelegramNotification(memberDoc.data().telegramId, message);
                }
            }
        } catch(e) { console.error(e); }
    }

    function escapeHtml(text) { if (!text) return ''; const div = document.createElement('div'); div.textContent = text; return div.innerHTML; }
    function showToast(msg, type = 'info') { toast = { show: true, message: msg, type: type }; renderUI(); setTimeout(() => { toast = { show: false, message: '', type: '' }; renderUI(); }, 3000); }
    function closeModal() { const modal = document.querySelector('.modal'); if (modal) modal.remove(); if (chatUnsubscribe) chatUnsubscribe(); if (tg) tg.BackButton.hide(); }
    function formatTimeDetailed(ms) {
        if (ms <= 0) return "0:00";
        const totalSeconds = Math.floor(ms / 1000);
        const hours = Math.floor(totalSeconds / 3600);
        const minutes = Math.floor((totalSeconds % 3600) / 60);
        const seconds = totalSeconds % 60;
        if (totalSeconds < 60) return `${seconds} сек`;
        if (hours === 0) return `${minutes} мин ${seconds} сек`;
        return `${hours} ч ${minutes} мин`;
    }
    function formatMineTime(ms) {
        if (ms <= 0) return "Готово!";
        const totalSeconds = Math.floor(ms / 1000);
        const hours = Math.floor(totalSeconds / 3600);
        const minutes = Math.floor((totalSeconds % 3600) / 60);
        const seconds = totalSeconds % 60;
        if (hours > 0) return `${hours}ч ${minutes}м`;
        if (minutes > 0) return `${minutes}м ${seconds}с`;
        return `${seconds}с`;
    }
    function calculatePlayerPower(player) {
        return Math.floor((player.level * 15) + (player.authority / 100) + ((player.stats?.strength || 10) * 2) + ((player.stats?.defense || 5) * 1.5) + (player.stats?.critical || 5) + (player.energy / 20));
    }
    function getMineCooldownHours(level) { return 1 + (level * 0.1667); }
    function getExchangeRate(level, type) { return type === 'paper' ? 2 + Math.floor(level / 5) : 1 + Math.floor(level / 10); }
    function getRandomTip() { if (!tips || tips.length === 0) return "💡 Удачной игры!"; return tips[Math.floor(Math.random() * tips.length)]; }
    
    function showLoadingScreen() { showLoadingScreenWithLogo(); }
    function hideLoadingScreen() { hideLoadingScreenWithLogo(); }

    // ========== АВТОРИЗАЦИЯ ==========
    async function loginWithTelegram() {
        if (!tgUser || !db) return false;
        try {
            showLoadingScreen();
            const telegramId = tgUser.id.toString();
            let username = tgUser.username || tgUser.first_name || `user_${telegramId}`;
            const snapshot = await db.collection('players').where('telegramId', '==', telegramId).get();
            if (!snapshot.empty) {
                const doc = snapshot.docs[0];
                const player = { id: doc.id, ...doc.data() };
                if (player.isBanned) { alert('Аккаунт забанен'); hideLoadingScreen(); return false; }
                localStorage.setItem('playerId', player.id);
                localStorage.setItem('username', player.username);
                await startGame(player.id, player.username);
                return true;
            } else {
                let finalUsername = username.replace(/[^a-zA-Z0-9]/g, '').substring(0, 10);
                if (finalUsername.length < 3) finalUsername = `user${telegramId.substring(0, 5)}`;
                const existing = await db.collection('players').where('username', '==', finalUsername).get();
                if (!existing.empty) finalUsername = `${finalUsername}_${telegramId.substring(0, 3)}`;
                const castes = ['Блатные', 'Мужики', 'Фраер'];
                const randomCaste = castes[Math.floor(Math.random() * castes.length)];
                const playerData = getDefaultPlayer(finalUsername, randomCaste);
                playerData.telegramId = telegramId;
                playerData.telegramName = tgUser.first_name || '';
                const docRef = await db.collection('players').add(playerData);
                localStorage.setItem('playerId', docRef.id);
                localStorage.setItem('username', finalUsername);
                await startGame(docRef.id, finalUsername);
                return true;
            }
        } catch(e) { hideLoadingScreen(); showToast('Ошибка входа: ' + e.message, 'error'); return false; }
    }

    async function claimDailyBonus() {
        if (maintenanceMode) { showToast(maintenanceMessage, 'warning'); return; }
        const lastClaimDay = dailyBonus.lastClaimDay || 0;
        const nextDay = lastClaimDay + 1;
        if (nextDay > 30) { showToast('Вы получили все 30 бонусов!', 'success'); return; }
        const bonusAmount = getDailyBonusAmount(nextDay);
        await playerDocRef.update({
            cigarettes: firebase.firestore.FieldValue.increment(bonusAmount),
            'dailyBonus.lastClaimDay': nextDay, 'dailyBonus.lastClaimTime': Date.now(),
            'dailyBonus.streak': (dailyBonus.streak || 0) + 1
        });
        currentPlayer.cigarettes += bonusAmount;
        dailyBonus.lastClaimDay = nextDay;
        dailyBonus.lastClaimTime = Date.now();
        dailyBonus.streak = (dailyBonus.streak || 0) + 1;
        showToast(`🎁 Получено ${bonusAmount} 🚬 папирос! День ${nextDay}/30`, 'success');
        renderUI();

    async function loadAllClans() { if (!db) return; try { const snapshot = await db.collection('clans').get(); allClans = []; for (const doc of snapshot.docs) { const clan = { id: doc.id, ...doc.data() }; let totalPower = 0; for (const memberId of clan.membersIds || []) { const memberDoc = await db.collection('players').doc(memberId).get(); if (memberDoc.exists && !memberDoc.data().isBanned) totalPower += calculatePlayerPower(memberDoc.data()); } clan.totalPower = totalPower; allClans.push(clan); } allClans.sort((a,b) => (b.totalPower||0) - (a.totalPower||0)); } catch(e) { console.error(e); } }
    async function loadAllPlayers() { if (!db) return; try { const snapshot = await db.collection('players').get(); allPlayers = []; for (const doc of snapshot.docs) { const p = doc.data(); if (!p.isBanned) allPlayers.push({ id: doc.id, username: p.username, level: p.level, power: calculatePlayerPower(p), authority: p.authority, strength: p.stats?.strength || 10, defense: p.stats?.defense || 5 }); } } catch(e) { console.error(e); } }
    async function loadWarHistory() { if (!currentPlayer?.clanId) { warHistory = []; return; } try { const snapshot1 = await db.collection('warHistory').where('attackerClanId', '==', currentPlayer.clanId).orderBy('timestamp', 'desc').limit(50).get(); const snapshot2 = await db.collection('warHistory').where('defenderClanId', '==', currentPlayer.clanId).orderBy('timestamp', 'desc').limit(50).get(); const history = []; snapshot1.forEach(doc => history.push({ id: doc.id, ...doc.data() })); snapshot2.forEach(doc => history.push({ id: doc.id, ...doc.data() })); history.sort((a,b) => b.timestamp - a.timestamp); warHistory = history.slice(0,50); } catch(e) { console.error(e); } }
    async function loadClan() { if (!currentPlayer.clanId) { clanMembers = []; return; } try { const clanDoc = await db.collection('clans').doc(currentPlayer.clanId).get(); if (clanDoc.exists) { const clan = clanDoc.data(); const members = []; for (const memberId of clan.membersIds || []) { const memberDoc = await db.collection('players').doc(memberId).get(); if (memberDoc.exists) { const m = memberDoc.data(); members.push({ username: m.username, level: m.level, power: calculatePlayerPower(m), strength: m.stats?.strength || 10, defense: m.stats?.defense || 5, critical: m.stats?.critical || 5, energy: m.energy, authority: m.authority, isLeader: m.username === clan.leader, isYou: m.username === currentPlayer.username, telegramId: m.telegramId }); } } clanMembers = members.sort((a,b) => b.power - a.power); } } catch(e) { console.error(e); } }
    async function checkActiveWar() { const warDoc = await db.collection('activeWars').doc('current').get(); if (warDoc.exists) { const war = warDoc.data(); if (war.endTime > Date.now() && (war.attackerClanId === currentPlayer?.clanId || war.defenderClanId === currentPlayer?.clanId)) activeWar = war; else if (war.endTime <= Date.now()) { await executeWarResult(); activeWar = null; } } }
    function startWarTimer() { if (warTimer) clearInterval(warTimer); warTimer = setInterval(async () => { if (activeWar && activeWar.endTime <= Date.now()) await executeWarResult(); renderUI(); }, 1000); }
    async function startWar(targetClanId) { if (maintenanceMode) { showToast(maintenanceMessage, 'warning'); return; } if (!currentPlayer.clanId || currentPlayer.username !== currentPlayer.clanLeader) { showToast('Только главарь клана может начать войну!', 'error'); return; } if (activeWar) { showToast('Уже идет война!', 'warning'); return; } const now = Date.now(); if (lastAttackTime && (now - lastAttackTime) < attackCooldownHours * 60 * 60 * 1000) { showToast(`Атака доступна раз в ${attackCooldownHours} часов.`, 'warning'); return; } const targetClan = allClans.find(c => c.id === targetClanId); if (!targetClan) return; if (targetClan.defenseUntil && targetClan.defenseUntil > Date.now()) { showToast(`Клан ${targetClan.name} под защитой!`, 'warning'); return; } const myClan = allClans.find(c => c.id === currentPlayer.clanId); const myPower = myClan.totalPower || 0; const enemyPower = targetClan.totalPower || 0; let attackerWon = myPower > enemyPower; let stolenCigarettes = Math.floor((targetClan.cigarettes || 0) * (attackerWon ? 0.3 : 0.1)); let stolenRubles = Math.floor((targetClan.rubles || 0) * (attackerWon ? 0.2 : 0.05)); activeWar = { attackerClanId: currentPlayer.clanId, attackerClanName: myClan.name, defenderClanId: targetClan.id, defenderClanName: targetClan.name, attackerWon: attackerWon, stolenCigarettes: stolenCigarettes, stolenRubles: stolenRubles, endTime: Date.now() + warDurationHours * 60 * 60 * 1000 }; await db.collection('activeWars').doc('current').set(activeWar); await playerDocRef.update({ lastAttackTime: now }); lastAttackTime = now; await notifyClanMembers(targetClan.id, `⚠️ Клан "${myClan.name}" объявил войну вашему клану!`); await notifyClanMembers(currentPlayer.clanId, `⚔️ Ваш клан атакует клан "${targetClan.name}"!`); showToast(`⚔️ Война объявлена клану ${targetClan.name}!`, 'success'); renderUI(); }
    async function executeWarResult() { if (!activeWar) return; const { attackerClanId, defenderClanId, attackerWon, stolenCigarettes, stolenRubles, attackerClanName, defenderClanName } = activeWar; await db.collection('clans').doc(attackerClanId).update({ cigarettes: firebase.firestore.FieldValue.increment(stolenCigarettes), rubles: firebase.firestore.FieldValue.increment(stolenRubles) }); await db.collection('clans').doc(defenderClanId).update({ cigarettes: firebase.firestore.FieldValue.increment(-stolenCigarettes), rubles: firebase.firestore.FieldValue.increment(-stolenRubles) }); await db.collection('warHistory').add({ attackerClanId, attackerClanName, defenderClanId, defenderClanName, attackerWon, stolenCigarettes, stolenRubles, timestamp: Date.now() }); await db.collection('activeWars').doc('current').delete(); await notifyClanMembers(attackerClanId, `🏆 Война завершена! ${attackerWon ? 'Победа' : 'Поражение'}. Украдено: ${stolenCigarettes}🚬, ${stolenRubles}💰`); await notifyClanMembers(defenderClanId, `🏆 Война завершена! ${attackerWon ? 'Поражение' : 'Победа'}. Потеряно: ${stolenCigarettes}🚬, ${stolenRubles}💰`); showToast(`⚔️ Война завершена! ${attackerWon ? 'Победа' : 'Поражение'}`, attackerWon ? 'success' : 'error'); activeWar = null; await loadAllClans(); await loadWarHistory(); renderUI(); }
    async function surrender() { if (maintenanceMode) { showToast(maintenanceMessage, 'warning'); return; } if (!currentPlayer.clanId || currentPlayer.username !== currentPlayer.clanLeader) { showToast('Только главарь может сдаться!', 'error'); return; } if (!activeWar || activeWar.attackerClanId !== currentPlayer.clanId) { showToast('Нет активной войны, которую вы начали', 'warning'); return; } if (confirm('Сдаться? ВСЕ ресурсы атакующего клана перейдут защищающемуся!')) { const { defenderClanId, attackerClanName, defenderClanName } = activeWar; const attackerClan = await db.collection('clans').doc(currentPlayer.clanId).get(); const attackerCigarettes = attackerClan.data()?.cigarettes || 0; const attackerRubles = attackerClan.data()?.rubles || 0; await db.collection('clans').doc(currentPlayer.clanId).update({ cigarettes: 0, rubles: 0 }); await db.collection('clans').doc(defenderClanId).update({ cigarettes: firebase.firestore.FieldValue.increment(attackerCigarettes), rubles: firebase.firestore.FieldValue.increment(attackerRubles) }); await db.collection('warHistory').add({ attackerClanId: currentPlayer.clanId, attackerClanName, defenderClanId, defenderClanName, attackerWon: false, stolenCigarettes: attackerCigarettes, stolenRubles: attackerRubles, timestamp: Date.now(), surrendered: true }); await db.collection('activeWars').doc('current').delete(); await notifyClanMembers(defenderClanId, `🏳️ Клан "${attackerClanName}" СДАЛСЯ! Получено: ${attackerCigarettes}🚬, ${attackerRubles}💰`); showToast(`🏳️ Вы сдались! Весь ресурс клана перешел сопернику`, 'warning'); activeWar = null; await loadAllClans(); await loadWarHistory(); renderUI(); } }
    async function createClan() { if (maintenanceMode) { showToast(maintenanceMessage, 'warning'); return; } if (currentPlayer.clanId) { showToast('Вы уже в клане!', 'error'); return; } if (currentPlayer.cigarettes < clanCreationCost) { showToast(`Не хватает ${clanCreationCost - currentPlayer.cigarettes} 🚬! Нужно ${clanCreationCost}`, 'error'); return; } const clanName = prompt('Название клана (латиница, 3-15 символов):'); if (!clanName || !/^[a-zA-Z0-9]{3,15}$/.test(clanName)) { showToast('Латиница/цифры, 3-15 символов', 'error'); return; } if (allClans.find(c => c.name === clanName)) { showToast('Клан существует!', 'error'); return; } try { await playerDocRef.update({ cigarettes: firebase.firestore.FieldValue.increment(-clanCreationCost) }); currentPlayer.cigarettes -= clanCreationCost; const newClan = { name: clanName, leader: currentPlayer.username, leaderId: playerId, members: [currentPlayer.username], membersIds: [playerId], cigarettes: 0, rubles: 0, defenseUntil: 0, createdAt: Date.now(), inviteCode: currentPlayer.inviteCode }; const clanRef = await db.collection('clans').add(newClan); await playerDocRef.update({ clanId: clanRef.id, clanLeader: currentPlayer.username }); currentPlayer.clanId = clanRef.id; currentPlayer.clanLeader = currentPlayer.username; await updateQuestProgress('clan', 1); showToast(`Клан "${clanName}" создан!`, 'success'); await loadAllClans(); await loadClan(); renderUI(); } catch(e) { showToast('Ошибка: ' + e.message, 'error'); } }

    function openCardGameUpgradeModal() { const upgradeCost = 100 * cardGameUpgradeLevel; const modalHtml = `<div class="modal"><div class="modal-content"><div class="modal-header"><div class="modal-title">🎴 Прокачка игры в карты</div><button class="close-btn" onclick="closeModal()">✕</button></div><div style="text-align:center;"><div class="bonus-info">📊 Текущий уровень: ${cardGameUpgradeLevel}/10<br>🎯 Бонус опыта: +${Math.floor(cardGameUpgradeLevel * 5)}%<br>⚡ Расход энергии: ${getCardGameEnergyCost()}<br>🎁 Шанс выигрыша: ${Math.min(50, 10 + cardGameUpgradeLevel * 4)}%</div><div class="bonus-info">⬆️ Следующий уровень: ${cardGameUpgradeLevel + 1}/10<br>🎯 Бонус опыта: +${Math.floor((cardGameUpgradeLevel + 1) * 5)}%<br>⚡ Расход энергии: ${getCardGameEnergyCost() > 2 ? getCardGameEnergyCost() - 1 : 2}<br>🎁 Шанс выигрыша: ${Math.min(50, 10 + (cardGameUpgradeLevel + 1) * 4)}%</div><button class="btn-primary" onclick="upgradeCardGame()" ${currentPlayer.cigarettes < upgradeCost ? 'disabled' : ''}>⬆️ Улучшить (${upgradeCost}🚬)</button></div></div></div>`; document.body.insertAdjacentHTML('beforeend', modalHtml); if (tg) tg.BackButton.show(); }
    
    async function upgradeCardGame() {
        if (maintenanceMode) { showToast(maintenanceMessage, 'warning'); return; }
        if (cardGameUpgradeLevel >= 10) { showToast('Максимальный уровень прокачки!', 'warning'); return; }
        const upgradeCost = 100 * cardGameUpgradeLevel;
        if (currentPlayer.cigarettes < upgradeCost) { showToast(`Не хватает ${upgradeCost - currentPlayer.cigarettes} 🚬!`, 'error'); return; }
        await playerDocRef.update({ cigarettes: firebase.firestore.FieldValue.increment(-upgradeCost), cardGameUpgradeLevel: cardGameUpgradeLevel + 1 });
        currentPlayer.cigarettes -= upgradeCost;
        cardGameUpgradeLevel++;
        if (cardGameActive) cardGameBonusPercent = getCardGameBonusFromLevel(currentPlayer.level);
        showToast(`🎴 Уровень карт повышен до ${cardGameUpgradeLevel}!`, 'success');
        closeModal();
        renderUI();
    }
    
    // ========== ЗАПУСК ИГРЫ ==========
    function startEnergyTimer() { if (energyInterval) clearInterval(energyInterval); energyInterval = setInterval(async () => { if (currentPlayer && currentPlayer.energy < currentPlayer.maxEnergy) { const newEnergy = Math.min(currentPlayer.maxEnergy, currentPlayer.energy + 1); currentPlayer.energy = newEnergy; if (playerDocRef) await playerDocRef.update({ energy: newEnergy }); renderUI(); } }, 60000); }
    
    async function startGame(id, name) {
        showLoadingScreen();
        try {
            if (!db) throw new Error('Нет подключения к базе данных');
            await loadGameSettings();
            await checkMaintenanceMode();
            await loadAdminShopItems();
            await loadAdminQuests();
            const doc = await db.collection('players').doc(id).get();
            if (!doc.exists) { localStorage.clear(); showLoginForm(); hideLoadingScreen(); return; }
            let player = { id: doc.id, ...doc.data() };
            if (!player.mine) player.mine = { paperLevel: 1, makhorkaLevel: 1, lastMineTime: 0, paper: 0, makhorka: 0 };
            if (!player.dailyBonus) player.dailyBonus = { lastClaimDay: 0, lastClaimTime: 0, streak: 0 };
            if (!player.questsProgress) player.questsProgress = {};
            if (!player.completedQuests) player.completedQuests = [];
            if (!player.purchasedItemsCount) player.purchasedItemsCount = {};
            if (!player.cardGameUpgradeLevel) player.cardGameUpgradeLevel = 1;
            if (player.clanId) { const clanDoc = await db.collection('clans').doc(player.clanId).get(); if (clanDoc.exists) player.clanLeader = clanDoc.data().leader; }
            const minutesPassed = Math.floor((Date.now() - (player.lastActive || Date.now())) / 60000);
            if (minutesPassed > 0) { const newEnergy = Math.min(player.maxEnergy || 100, (player.energy || 100) + minutesPassed); await db.collection('players').doc(id).update({ energy: newEnergy, lastActive: Date.now() }); player.energy = newEnergy; } else { await db.collection('players').doc(id).update({ lastActive: Date.now() }); }
            currentPlayer = player; playerId = id; playerDocRef = db.collection('players').doc(id);
            questsProgress = player.questsProgress; completedQuests = player.completedQuests || []; dailyBonus = player.dailyBonus;
            lastAttackTime = player.lastAttackTime || 0; purchasedItemsCount = player.purchasedItemsCount || {};
            cardGameUpgradeLevel = player.cardGameUpgradeLevel || 1; cardGameCooldownUntil = player.cardGameCooldownUntil || 0;
            if (cardGameCooldownUntil > Date.now()) startCardGameCooldown();
            await loadAllClans(); await loadAllPlayers(); await loadWarHistory();
            if (currentPlayer.clanId) await loadClan();
            await checkActiveWar();
            generateDynamicQuests(); startEnergyTimer(); startWarTimer();
            if (currentPlayer.cardGameActive) await restoreCardGame();
            hideLoadingScreen(); renderUI();
        } catch(e) { console.error(e); hideLoadingScreen(); alert('Ошибка загрузки игры: ' + e.message); showLoginForm(); }
    }

        }
        
        document.getElementById('app').innerHTML = `
            <div class="fixed-top-bar">
                <div class="top-bar-content">
                    <div class="caste-info" onclick="openProfileModal()">
                        <div class="caste-icon">${casteIcon}</div>
                        <div class="caste-level">Ур. ${currentPlayer.level}</div>
                    </div>
                    <div class="resources-center">
                        <div class="resource-item"><span>🚬</span><span>${currentPlayer.cigarettes}</span></div>
                        <div class="resource-item"><span>💰</span><span>${currentPlayer.rubles}</span></div>
                        <div class="resource-item"><span>📄</span><span>${currentPlayer.mine?.paper || 0}</span></div>
                        <div class="resource-item"><span>🌿</span><span>${currentPlayer.mine?.makhorka || 0}</span></div>
                    </div>
                    <button class="settings-btn" onclick="openSettingsModal()">⚙️</button>
                </div>
            </div>
            <div class="game-container">
                ${warStatusBlock}
                <div class="map-wrapper">
                    <div class="building b1" data-building="b1" onclick="openInventoryModal()"><div class="building-label">Камера</div></div>
                    <div class="building b2" data-building="b2" onclick="openMineModal()"><div class="building-label">Шахта</div></div>
                    <div class="building b3" data-building="b3" onclick="startCardGame()"><div class="building-label">Картежка</div></div>
                    <div class="building b4" data-building="b4" onclick="openShopModal()"><div class="building-label">Магазин</div></div>
                    <div class="building b5" data-building="b5" onclick="openTreasuryModal()"><div class="building-label">Общак</div></div>
                    <div class="building b6" data-building="b6" onclick="openAttackMenu()"><div class="building-label">Сходка</div></div>
                    <div class="building b7" data-building="b7" onclick="showToast('Ларек скоро откроется!', 'info')"><div class="building-label">Ларек</div></div>
                </div>
            </div>
            <div class="fixed-bottom-bar">
                <div class="bottom-nav">
                    <button class="nav-btn ${currentBottomTab === 'city' ? 'active' : ''}" onclick="switchBottomTab('city')"><span>🏙️</span><span>Город</span></button>
                    <button class="nav-btn ${currentBottomTab === 'fights' ? 'active' : ''}" onclick="switchBottomTab('fights')"><span>⚔️</span><span>Бои</span></button>
                    <button class="nav-btn ${currentBottomTab === 'clan' ? 'active' : ''}" onclick="switchBottomTab('clan')"><span>👥</span><span>Клан</span></button>
                    <button class="nav-btn ${currentBottomTab === 'war' ? 'active' : ''}" onclick="switchBottomTab('war')"><span>⚡</span><span>Война</span></button>
                    <button class="nav-btn ${currentBottomTab === 'quests' ? 'active' : ''}" onclick="switchBottomTab('quests')"><span>📋</span><span>Задания</span></button>
                </div>
            </div>
            ${toast.show ? `<div class="toast ${toast.type === 'error' ? 'error' : (toast.type === 'success' ? 'success' : 'warning')}">${toast.message}</div>` : ''}
        `;
        
        document.querySelectorAll('.building').forEach(building => {
            building.addEventListener('click', (e) => {
                e.stopPropagation();
                document.querySelectorAll('.building').forEach(el => el.classList.remove('active'));
                building.classList.add('active');
                setTimeout(() => {
                    building.classList.remove('active');
                }, 1000);
            });
        });
    }

        if (!isTelegramWebApp) {

    function showCasteSelection(username, inviteCode, callback) {
        let selectedCaste = null;
        document.getElementById('app').innerHTML = `
            <div class="game-container">
                <div class="card" style="text-align:center; background: linear-gradient(135deg, #13172b, #0f1425); border-radius: 28px; padding: 24px;">
                    <div style="font-size:24px; font-weight:700; margin-bottom:20px">Выбери свою касту</div>
                    <div class="caste-select" style="display:flex; gap:15px; justify-content:center; margin:20px 0; flex-wrap:wrap;">
                        <div class="caste-card" data-caste="Блатные" style="background:transparent; border-radius:16px; cursor:pointer; width:200px; height:300px; transition:0.2s; border:2px solid transparent; overflow:hidden; padding:0;">
                            <img src="https://sviter-pro.github.io/GameZone/src/bl1.png" style="width:100%; object-fit:cover; display:block;" alt="Блатные">
                        </div>
                        <div class="caste-card" data-caste="Мужики" style="background:transparent; border-radius:16px; cursor:pointer; width:200px; height:300px; transition:0.2s; border:2px solid transparent; overflow:hidden; padding:0;">
                            <img src="https://sviter-pro.github.io/GameZone/src/mzh1.png" style="width:100%; object-fit:cover; display:block;" alt="Мужики">
                        </div>
                        <div class="caste-card" data-caste="Фраер" style="background:transparent; border-radius:16px; cursor:pointer; width:200px; height:300px; transition:0.2s; border:2px solid transparent; overflow:hidden; padding:0;">
                            <img src="https://sviter-pro.github.io/GameZone/src/fr1.png" style="width:100%; object-fit:cover; display:block;" alt="Фраер">
                        </div>
                    </div>
                    <div id="casteInfo" style="background:#1e2440; padding:12px; border-radius:20px; margin:15px 0; font-size:13px; color:#aaa"></div>
                    <button id="confirmCasteBtn" class="btn-primary" disabled style="width:100%">Подтвердить выбор</button>
                </div>
            </div>
        `;
        const style = document.createElement('style');
        style.textContent = `.caste-card.selected { border-color: #e94560 !important; transform: scale(1.02); } .caste-card:hover { transform: translateY(-5px); }`;
        document.head.appendChild(style);
        document.querySelectorAll('.caste-card').forEach(card => {
            card.onclick = () => {
                selectedCaste = card.getAttribute('data-caste');
                document.querySelectorAll('.caste-card').forEach(c => c.classList.remove('selected'));
                card.classList.add('selected');
                document.getElementById('confirmCasteBtn').disabled = false;
                let info = '';
                if (selectedCaste === 'Блатные') info = '👑 Блатные — +10% к силе в бою';
                else if (selectedCaste === 'Мужики') info = '🔨 Мужики — +5% к добыче в шахте';
                else info = '🐑 Фраер — +5% к авторитету';
                document.getElementById('casteInfo').innerHTML = info;
            };
        });
        document.getElementById('confirmCasteBtn').onclick = () => { if (selectedCaste) callback(selectedCaste); };
    }
    
    async function doRegisterFull() {
        const username = document.getElementById('regUsername')?.value.trim();
        const urlParams = new URLSearchParams(window.location.search);
        const inviteCode = urlParams.get('ref') || document.getElementById('inviteCode')?.value.trim();
        if (!username) { alert('Введите ник'); return; }
        if (!/^[a-zA-Z0-9]{3,10}$/.test(username)) { alert('Ник 3-10 символов, латиница/цифры'); return; }
        try {
            const existing = await db.collection('players').where('username', '==', username).get();
            if (!existing.empty) { alert('Ник уже занят!'); return; }
            showCasteSelection(username, inviteCode, async (caste) => {
                let clanId = null;
                if (inviteCode) {
                    const inviterSnapshot = await db.collection('players').where('inviteCode', '==', inviteCode).get();
                    if (!inviterSnapshot.empty) clanId = inviterSnapshot.docs[0].data().clanId;
                }
                const playerData = getDefaultPlayer(username, caste);
                playerData.clanId = clanId;
                const docRef = await db.collection('players').add(playerData);
                if (clanId) { await db.collection('clans').doc(clanId).update({ members: firebase.firestore.FieldValue.arrayUnion(username), membersIds: firebase.firestore.FieldValue.arrayUnion(docRef.id) }); }
                localStorage.setItem('playerId', docRef.id);
                localStorage.setItem('username', username);
                await startGame(docRef.id, username);
            });
        } catch(e) { alert('Ошибка регистрации: ' + e.message); }
    }
    
    function logout() {
        if (confirm('Вы уверены, что хотите выйти из аккаунта?')) {
            localStorage.clear();
            if (energyInterval) clearInterval(energyInterval);
            if (chatUnsubscribe) chatUnsubscribe();
            if (warTimer) clearInterval(warTimer);
            if (mineTimerInterval) clearInterval(mineTimerInterval);
            if (cardGameInterval) clearInterval(cardGameInterval);
            if (cardGameTimerUpdate) clearInterval(cardGameTimerUpdate);
            if (cardGameCooldownInterval) clearInterval(cardGameCooldownInterval);
            const badge = document.getElementById('activeGameBadge');
            if (badge) badge.remove();
            currentPlayer = null;
            if (tgUser) loginWithTelegram();
            else showLoginForm();
        }
    }
