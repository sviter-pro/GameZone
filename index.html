    function saveClanQuests() {
        if (currentPlayer && currentPlayer.clanId) {
            localStorage.setItem(`clanQuests_${currentPlayer.clanId}`, JSON.stringify(clanQuests));
        }
    }
    
    function loadClanQuests() {
        if (currentPlayer && currentPlayer.clanId) {
            const saved = localStorage.getItem(`clanQuests_${currentPlayer.clanId}`);
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    if (parsed && parsed.length === 12) {
                        clanQuests = parsed;
                    }
                } catch(e) {}
            }
        }
    }
    
    function generateRandomReward() {
        const levelBonus = Math.floor(currentPlayer.level / 2);
        const rewards = [
            { type: 'cigarettes', min: 10 + levelBonus * 2, max: 30 + levelBonus * 4, icon: '🚬', name: 'папирос' },
            { type: 'rubles', min: 5 + levelBonus, max: 20 + levelBonus * 2, icon: '💰', name: 'рублей' },
            { type: 'wood', min: 5 + levelBonus, max: 25 + levelBonus * 3, icon: '🪵', name: 'дерева' },
            { type: 'stone', min: 3 + levelBonus, max: 15 + levelBonus * 2, icon: '🪨', name: 'камня' },
            { type: 'paper', min: 5 + levelBonus, max: 20 + levelBonus * 3, icon: '📄', name: 'бумаги' },
            { type: 'makhorka', min: 3 + levelBonus, max: 12 + levelBonus * 2, icon: '🌿', name: 'махорки' }
        ];
        const randomReward = rewards[Math.floor(Math.random() * rewards.length)];
        const amount = Math.floor(Math.random() * (randomReward.max - randomReward.min + 1) + randomReward.min);
        return { ...randomReward, amount };
    }
    
    function startClanQuests(clanLevel) {
        const now = Date.now();
        let changed = false;
        for (let i = 0; i < clanQuests.length; i++) {
            const questId = i + 1;
            if (questId <= clanLevel && clanQuests[i].startTime === 0 && !clanQuests[i].ready && !clanQuests[i].claimed) {
                clanQuests[i].reward = generateRandomReward();
                clanQuests[i].startTime = now;
                clanQuests[i].ready = false;
                clanQuests[i].claimed = false;
                changed = true;
            }
        }
        if (changed) saveClanQuests();
    }
    
    function checkClanQuestsReady() {
        let readyCount = 0;
        const now = Date.now();
        for (let i = 0; i < clanQuests.length; i++) {
            const quest = clanQuests[i];
            if (quest.startTime > 0 && !quest.ready && !quest.claimed) {
                const endTime = quest.startTime + (quest.hours * 60 * 60 * 1000);
                if (now >= endTime) {
                    if (!quest.ready) {
                        quest.ready = true;
                        readyCount++;
                        saveClanQuests();
                        if (settingsNotifications) {
                            sendTelegramNotification(`🏆 В клане выполнено задание на ${quest.hours} час(а)! Забери награду!`);
                        }
                    } else {
                        readyCount++;
                    }
                }
            }
        }
        return readyCount;
    }
    
    function claimClanQuestInternal(questId, clanLevel) {
        const quest = clanQuests.find(q => q.id === questId);
        if (!quest) return false;
        if (questId > clanLevel) {
            showToast(`Задание требует уровень клана ${questId}!`, 'warning');
            return false;
        }
        if (!quest.ready) {
            showToast('Задание ещё не выполнено!', 'warning');
            return false;
        }
        
        const reward = quest.reward;
        if (!reward) return false;
        
        let updateObj = {};
        if (reward.type === 'cigarettes') {
            currentPlayer.cigarettes += reward.amount;
            updateObj = { cigarettes: firebase.firestore.FieldValue.increment(reward.amount) };
        } else if (reward.type === 'rubles') {
            currentPlayer.rubles += reward.amount;
            updateObj = { rubles: firebase.firestore.FieldValue.increment(reward.amount) };
        } else if (reward.type === 'wood') {
            if (!currentPlayer.lumber) currentPlayer.lumber = { wood: 0 };
            currentPlayer.lumber.wood += reward.amount;
            updateObj = { 'lumber.wood': currentPlayer.lumber.wood };
        } else if (reward.type === 'stone') {
            if (!currentPlayer.quarry) currentPlayer.quarry = { stone: 0 };
            currentPlayer.quarry.stone += reward.amount;
            updateObj = { 'quarry.stone': currentPlayer.quarry.stone };
        } else if (reward.type === 'paper') {
            if (!currentPlayer.mine) currentPlayer.mine = { paper: 0 };
            currentPlayer.mine.paper += reward.amount;
            updateObj = { 'mine.paper': currentPlayer.mine.paper };
        } else if (reward.type === 'makhorka') {
            if (!currentPlayer.mine) currentPlayer.mine = { makhorka: 0 };
            currentPlayer.mine.makhorka += reward.amount;
            updateObj = { 'mine.makhorka': currentPlayer.mine.makhorka };
        }
        if (Object.keys(updateObj).length > 0) {
            playerDocRef.update(updateObj);
        }
        
        showToast(`🎁 Задание ${quest.hours}ч выполнено! +${reward.amount} ${reward.icon} ${reward.name}`, 'success');
        
        // Перезапускаем задание
        quest.reward = generateRandomReward();
        quest.startTime = Date.now();
        quest.ready = false;
        quest.claimed = false;
        saveClanQuests();
        
        // Обновляем счетчик
        clanQuestReadyCount = checkClanQuestsReady();
        updateClanNotificationBadge();
        
        if (document.getElementById('clanFullscreen') && currentClanTab === 'quests') {
            renderClanQuestsHTML(clanLevel);
        }
        renderUI();
        return true;
    }
    
    function renderClanQuestsHTML(clanLevel) {
        const container = document.getElementById('clanQuestsContainer');
        if (!container) return;
        
        clanQuestReadyCount = 0;
        for (let i = 0; i < clanQuests.length; i++) {
            if (clanQuests[i].ready && (i + 1) <= clanLevel) {
                clanQuestReadyCount++;
            }
        }
        updateClanNotificationBadge();
        
        let html = '<h3 style="margin-bottom:15px;">📋 Задания клана</h3><div style="display:flex; flex-direction:column; gap:12px;">';
        
        for (let i = 0; i < clanQuests.length; i++) {
            const quest = clanQuests[i];
            const questId = i + 1;
            const isActive = questId <= clanLevel;
            
            let remainingMs = 0;
            let isRunning = false;
            let canClaim = false;
            
            if (isActive && quest.startTime > 0 && !quest.ready && !quest.claimed) {
                const endTime = quest.startTime + (quest.hours * 60 * 60 * 1000);
                remainingMs = Math.max(0, endTime - Date.now());
                isRunning = true;
            }
            
            if (isActive && quest.ready && !quest.claimed) {
                canClaim = true;
            }
            
            const formattedTime = isRunning ? formatTimeDetailedWithSeconds(remainingMs) : (quest.ready ? 'Готов к получению!' : (quest.startTime === 0 ? 'Не начато' : 'Завершено'));
            const progressPercent = isRunning ? Math.min(100, ((quest.hours * 60 * 60 * 1000 - remainingMs) / (quest.hours * 60 * 60 * 1000)) * 100) : (quest.ready ? 100 : 0);
            
            let rewardHtml = '';
            if (quest.reward && quest.ready) {
                rewardHtml = `<div class="clan-quest-reward">🎁 Награда готова: ${quest.reward.amount} ${quest.reward.icon} ${quest.reward.name}</div>`;
            } else if (quest.reward && isRunning) {
                rewardHtml = `<div class="clan-quest-reward">🎲 Награда: ${quest.reward.amount} ${quest.reward.icon} ${quest.reward.name}</div>`;
            } else if (quest.reward && quest.startTime > 0) {
                rewardHtml = `<div class="clan-quest-reward">🎁 Награда: ${quest.reward.amount} ${quest.reward.icon} ${quest.reward.name}</div>`;
            }
            
            html += `
                <div class="clan-quest-card" style="opacity: ${isActive ? 1 : 0.6}; filter: ${isActive ? 'none' : 'grayscale(0.5)'};">
                    <div class="clan-quest-header">
                        <div class="clan-quest-title">🔰 Задание ${quest.hours} час(а)</div>
                        <div class="clan-quest-timer">${formattedTime}</div>
                    </div>
                    ${rewardHtml}
                    ${isRunning ? `<div class="quest-progress" style="margin:8px 0;"><div class="quest-progress-fill" style="width: ${progressPercent}%"></div></div>` : ''}
                    ${!isActive ? `<div class="bonus-info" style="background:#e94560; padding:8px; border-radius:16px; margin-top:10px;">🔒 Требуется уровень клана ${questId}</div>` : ''}
                    ${canClaim ? `<button class="clan-claim-btn" onclick="claimClanQuestExternal(${questId})">🎁 Забрать награду</button>` : ''}
                </div>
            `;
        }
        
        html += '</div>';
        container.innerHTML = html;
    }
    
    function claimClanQuestExternal(questId) {
        const clan = allClans.find(c => c.id === currentPlayer.clanId);
        const clanLevel = clan?.level || 1;
        claimClanQuestInternal(questId, clanLevel);
    }
    
    function startClanQuestsTimer() {
        if (clanQuestsTimer) clearInterval(clanQuestsTimer);
        clanQuestsTimer = setInterval(() => {
            if (!currentPlayer || !currentPlayer.clanId) return;
            const clan = allClans.find(c => c.id === currentPlayer.clanId);
            const clanLevel = clan?.level || 1;
            const newReadyCount = checkClanQuestsReady();
            if (newReadyCount !== clanQuestReadyCount) {
                clanQuestReadyCount = newReadyCount;
                updateClanNotificationBadge();
            }
            if (document.getElementById('clanFullscreen') && currentClanTab === 'quests') {
                renderClanQuestsHTML(clanLevel);
            }
        }, 1000);
    }

    async function addWorkExperience(amount) {
        if (!currentPlayer) return;
        let newAuthority = currentPlayer.authority + amount;
        let newLevel = currentPlayer.level;
        let leveledUp = false;
        let newAuthorityToNext = currentPlayer.authorityToNext;
        let newMaxEnergy = currentPlayer.maxEnergy;
        let newStrength = currentPlayer.stats.strength;
        let newDefense = currentPlayer.stats.defense;
        
        if (newAuthority >= currentPlayer.authorityToNext) {
            newLevel++;
            newAuthority = 0;
            newAuthorityToNext = Math.floor(currentPlayer.authorityToNext * 1.5);
            newMaxEnergy = currentPlayer.maxEnergy + 5;
            newStrength = currentPlayer.stats.strength + 3;
            newDefense = currentPlayer.stats.defense + 2;
            leveledUp = true;
            if (cardGameActive) {
                cardGameBonusPercent = getCardGameBonusFromLevel(newLevel);
                await playerDocRef.update({ cardGameBonusPercent: cardGameBonusPercent });
            }
        }
        
        await playerDocRef.update({
            authority: newAuthority,
            level: newLevel,
            authorityToNext: newAuthorityToNext,
            maxEnergy: newMaxEnergy,
            'stats.strength': newStrength,
            'stats.defense': newDefense
        });
        
        currentPlayer.authority = newAuthority;
        currentPlayer.level = newLevel;
        currentPlayer.authorityToNext = newAuthorityToNext;
        currentPlayer.maxEnergy = newMaxEnergy;
        currentPlayer.stats.strength = newStrength;
        currentPlayer.stats.defense = newDefense;
        
        if (leveledUp) {
            showToast(`🎉 УРОВЕНЬ ${newLevel}! +5 энергии, +3 силы, +2 защиты!`, 'success');
        }
        
        renderUI();
    }
    
    // Функции для СИЗО (новая версия)
    function getGangUpgradeCost(gangType) {
        const level = currentPlayer.gang?.[gangType]?.level || 1;
        return {
            cigarettes: 50 * level,
            wood: 30 * level,
            stone: 20 * level
        };
    }
    
    function getGangRecruitCost(gangType) {
        const level = currentPlayer.gang?.[gangType]?.level || 1;
        return {
            cigarettes: 30 * level,
            wood: 20 * level,
            stone: 15 * level
        };
    }
    
    function getGangRecruitGain(gangType) {
        const level = currentPlayer.gang?.[gangType]?.level || 1;
        if (gangType === 'blats') return Math.floor(1 + (level - 1) * 0.5);
        if (gangType === 'muzhiks') return Math.floor(1 + (level - 1) * 0.6);
        return Math.floor(1 + (level - 1) * 0.4);
    }
    
    function isGangUpgradeActive(gangType) {
        const upgradeStart = currentPlayer.gang?.[gangType]?.upgradeStartTime || 0;
        const upgradeDuration = currentPlayer.gang?.[gangType]?.upgradeDuration || 0;
        return upgradeStart > 0 && (Date.now() - upgradeStart) < upgradeDuration;
    }
    
    function getGangUpgradeRemaining(gangType) {
        const upgradeStart = currentPlayer.gang?.[gangType]?.upgradeStartTime || 0;
        const upgradeDuration = currentPlayer.gang?.[gangType]?.upgradeDuration || 0;
        if (upgradeStart === 0 || upgradeDuration === 0) return 0;
        return Math.max(0, upgradeDuration - (Date.now() - upgradeStart));
    }
    
    function getGangRecruitRemaining(gangType) {
        const lastRecruit = currentPlayer.gang?.[gangType]?.lastRecruitTime || 0;
        const level = currentPlayer.gang?.[gangType]?.level || 1;
        let cooldownMs = 2 * 60 * 1000;
        cooldownMs = Math.floor(cooldownMs * (1 + (level - 1) * 0.05));
        return Math.max(0, cooldownMs - (Date.now() - lastRecruit));
    }
    
    async function checkAndCompleteGangUpgrade(gangType) {
        const remaining = getGangUpgradeRemaining(gangType);
        if (remaining === 0 && isGangUpgradeActive(gangType)) {
            const newLevel = (currentPlayer.gang?.[gangType]?.level || 1) + 1;
            await playerDocRef.update({
                [`gang.${gangType}.level`]: newLevel,
                [`gang.${gangType}.upgradeStartTime`]: 0,
                [`gang.${gangType}.upgradeDuration`]: 0
            });
            if (!currentPlayer.gang) currentPlayer.gang = {};
            if (!currentPlayer.gang[gangType]) currentPlayer.gang[gangType] = {};
            currentPlayer.gang[gangType].level = newLevel;
            currentPlayer.gang[gangType].upgradeStartTime = 0;
            currentPlayer.gang[gangType].upgradeDuration = 0;
            showToast(`✅ ${gangType === 'blats' ? 'Блатные' : gangType === 'muzhiks' ? 'Мужики' : 'Фраера'} улучшены до ${newLevel} уровня!`, 'success');
            renderGangModal();
            renderUI();
            return true;
        }
        return false;
    }
    
    async function upgradeGangCaste(gangType) {
        if (maintenanceMode) { showToast(maintenanceMessage, 'warning'); return; }
        
        if (isGangUpgradeActive(gangType)) {
            showToast('Прокачка уже идет! Дождитесь завершения.', 'warning');
            return;
        }
        
        const recruitRemaining = getGangRecruitRemaining(gangType);
        if (recruitRemaining > 0) {
            showToast('Невозможно улучшить во время найма! Дождитесь окончания.', 'warning');
            return;
        }
        
        const cost = getGangUpgradeCost(gangType);
        if (currentPlayer.cigarettes < cost.cigarettes) {
            showToast(`Не хватает ${cost.cigarettes - currentPlayer.cigarettes} 🚬!`, 'error');
            return;
        }
        if ((currentPlayer.lumber?.wood || 0) < cost.wood) {
            showToast(`Не хватает ${cost.wood - (currentPlayer.lumber?.wood || 0)} 🪵!`, 'error');
            return;
        }
        if ((currentPlayer.quarry?.stone || 0) < cost.stone) {
            showToast(`Не хватает ${cost.stone - (currentPlayer.quarry?.stone || 0)} 🪨!`, 'error');
            return;
        }
        
        await playerDocRef.update({
            cigarettes: firebase.firestore.FieldValue.increment(-cost.cigarettes),
            'lumber.wood': firebase.firestore.FieldValue.increment(-cost.wood),
            'quarry.stone': firebase.firestore.FieldValue.increment(-cost.stone)
        });
        currentPlayer.cigarettes -= cost.cigarettes;
        if (currentPlayer.lumber) currentPlayer.lumber.wood -= cost.wood;
        if (currentPlayer.quarry) currentPlayer.quarry.stone -= cost.stone;
        
        let upgradeDurationMs = 2 * 60 * 1000;
        const currentLevel = currentPlayer.gang?.[gangType]?.level || 1;
        upgradeDurationMs = Math.floor(upgradeDurationMs * (1 + (currentLevel - 1) * 0.1));
        const upgradeStartTime = Date.now();
        
        await playerDocRef.update({
            [`gang.${gangType}.upgradeStartTime`]: upgradeStartTime,
            [`gang.${gangType}.upgradeDuration`]: upgradeDurationMs
        });
        
        if (!currentPlayer.gang) currentPlayer.gang = {};
        if (!currentPlayer.gang[gangType]) currentPlayer.gang[gangType] = {};
        currentPlayer.gang[gangType].upgradeStartTime = upgradeStartTime;
        currentPlayer.gang[gangType].upgradeDuration = upgradeDurationMs;
        
        showToast(`⏳ Начата прокачка ${gangType === 'blats' ? 'Блатных' : gangType === 'muzhiks' ? 'Мужиков' : 'Фраеров'}! Уровень повысится через ${Math.round(upgradeDurationMs / 60000)} мин.`, 'success');
        renderGangModal();
        renderUI();
    }

        if (isGangUpgradeActive(gangType)) {
            showToast('Невозможно нанимать во время прокачки!', 'warning');

            return;
        }
        if ((currentPlayer.lumber?.wood || 0) < cost.wood) {
            showToast(`Не хватает ${cost.wood - (currentPlayer.lumber?.wood || 0)} 🪵!`, 'error');
            return;
        }
        if ((currentPlayer.quarry?.stone || 0) < cost.stone) {

            return;
        }
        
        await playerDocRef.update({
            cigarettes: firebase.firestore.FieldValue.increment(-cost.cigarettes),

            'quarry.stone': firebase.firestore.FieldValue.increment(-cost.stone)
        });
        currentPlayer.cigarettes -= cost.cigarettes;
        if (currentPlayer.lumber) currentPlayer.lumber.wood -= cost.wood;
        if (currentPlayer.quarry) currentPlayer.quarry.stone -= cost.stone;
        
        const gain = getGangRecruitGain(gangType);

        await playerDocRef.update({

        });

        showToast(`👥 +${gain} ${gangType === 'blats' ? 'блатных' : gangType === 'muzhiks' ? 'мужиков' : 'фраеров'}! (-${cost.cigarettes}🚬 -${cost.wood}🪵 -${cost.stone}🪨) Теперь в команде: ${currentFighters + gain}. +${authorityGain}⭐ опыта`, 'success');
        renderGangModal();
        renderUI();
    }

    let gangSubTouchStartX = 0;
    let gangSubTouchEndX = 0;
    
    function handleGangSubTouchStart(e) {
        gangSubTouchStartX = e.changedTouches[0].screenX;
    }
    function handleGangSubTouchEnd(e) {
        gangSubTouchEndX = e.changedTouches[0].screenX;
        const diff = gangSubTouchStartX - gangSubTouchEndX;
        if (Math.abs(diff) < 50) return;
        if (diff > 0 && currentGangTab === 'recruit') switchGangTab('upgrade');
        if (diff < 0 && currentGangTab === 'upgrade') switchGangTab('recruit');
    }
    
    function renderGangModal() {
        const gang = currentPlayer.gang;
        
        checkAndCompleteGangUpgrade('blats');
        checkAndCompleteGangUpgrade('muzhiks');
        checkAndCompleteGangUpgrade('fraers');
        
        const getGain = (type) => {

            if (blatsFightersSpan) blatsFightersSpan.textContent = currentPlayer.gang?.blats?.fighters || 0;
            if (muzhiksFightersSpan) muzhiksFightersSpan.textContent = currentPlayer.gang?.muzhiks?.fighters || 0;

    async function autoUpgradeClanLevel() {
        if (!currentPlayer.clanId) return;
        
        const clanRef = db.collection('clans').doc(currentPlayer.clanId);
        const clanDoc = await clanRef.get();
        if (!clanDoc.exists) return;
        
        const clan = clanDoc.data();
        let currentLevel = clan.level || 1;
        const requiredRubles = 1000 * currentLevel;
        const clanRubles = clan.rubles || 0;
        
        let upgraded = false;
        while (clanRubles >= requiredRubles) {
            await clanRef.update({
                rubles: firebase.firestore.FieldValue.increment(-requiredRubles),
                level: currentLevel + 1
            });
            currentLevel++;
            upgraded = true;
            const updatedClanDoc = await clanRef.get();
            const updatedClan = updatedClanDoc.data();
            if (updatedClan.rubles < (1000 * updatedClan.level)) break;
        }
        
        if (upgraded) {
            showToast(`🏆 Уровень клана повышен до ${currentLevel}!`, 'success');
            await loadClanDataFast();
            if (document.getElementById('clanFullscreen')) {
                openClanFullModal();
            }
            renderUI();
        }
    }

        if (minutes > 0) return `${minutes} мин ${seconds} сек`;
        return `${seconds} сек`;

    function formatTimeDetailedWithSeconds(ms) {
        if (ms <= 0) return "Готово!";
        const totalSeconds = Math.floor(ms / 1000);
        const hours = Math.floor(totalSeconds / 3600);
        const minutes = Math.floor((totalSeconds % 3600) / 60);
        const seconds = totalSeconds % 60;
        if (hours > 0) {
            return `${hours}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }
        return `${minutes}:${seconds.toString().padStart(2, '0')}`;
    }

    function calculatePlayerPower(player) {
        let gangPower = 0;
        if (player.gang) {
            gangPower += (player.gang.blats?.fighters || 0) * 2;
            gangPower += (player.gang.muzhiks?.fighters || 0) * 1;
            gangPower += (player.gang.fraers?.fighters || 0) * 1;
        }
        return Math.floor((player.level * 15) + (player.authority / 100) + ((player.stats?.strength || 10) * 2) + ((player.stats?.defense || 5) * 1.5) + (player.stats?.critical || 5) + (player.energy / 20) + gangPower);
    }

                    currentPlayer.caste = selectedCaste;
                    await playerDocRef.update({ cigarettes: firebase.firestore.FieldValue.increment(1000) });
                    currentPlayer.cigarettes += 1000;
                    showToast(`Ты выбрал касту: ${selectedCaste}! +1000🚬 бонус!`, 'success');
                    renderUI();
                });
            }
        } catch(e) { console.error(e); hideLoadingScreen(); alert('Ошибка загрузки игры: ' + e.message); showLoginForm(); }
    }
    
    function renderUI() {
        if (!currentPlayer) return;
        let casteIcon = currentPlayer.caste === 'Блатные' ? '👑' : (currentPlayer.caste === 'Мужики' ? '🔨' : '🐑');
        const paper = currentPlayer.mine?.paper || 0;
        const makhorka = currentPlayer.mine?.makhorka || 0;
        const wood = currentPlayer.lumber?.wood || 0;
        const stone = currentPlayer.quarry?.stone || 0;
        
        const formatMapTimer = (ms) => {
            if (ms <= 0) return '';
            const totalSeconds = Math.floor(ms / 1000);
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;
            if (minutes > 0) return `${minutes}м ${seconds}с`;
            return `${seconds}с`;
        };
        
        let recruitTimers = [];
        let upgradeTimers = [];
        const gangTypes = ['blats', 'muzhiks', 'fraers'];
        gangTypes.forEach(type => {
            const recruitRemaining = getGangRecruitRemaining(type);
            if (recruitRemaining > 0) recruitTimers.push(formatMapTimer(recruitRemaining));
            const upgradeRemaining = getGangUpgradeRemaining(type);
            if (upgradeRemaining > 0) upgradeTimers.push(formatMapTimer(upgradeRemaining));
        });
        
        let countersHtml = '';
        if (recruitTimers.length > 0 || upgradeTimers.length > 0) {
            countersHtml = `<div class="counters-container">`;
            if (recruitTimers.length > 0) {
                for (let timer of recruitTimers) {
                    countersHtml += `<div class="recruit-counter">👥 ${timer}</div>`;
                }
            }
            if (upgradeTimers.length > 0) {
                for (let timer of upgradeTimers) {
                    countersHtml += `<div class="upgrade-counter">⬆️ ${timer}</div>`;
                }
            }
            countersHtml += `</div>`;
        }
        
        // Обновляем счетчик уведомлений клана
        if (currentPlayer.clanId) {
            const newReadyCount = checkClanQuestsReady();
            if (newReadyCount !== clanQuestReadyCount) {
                clanQuestReadyCount = newReadyCount;
                updateClanNotificationBadge();
            }
        }
        
        document.getElementById('app').innerHTML = `
            <div class="fixed-top-bar">
                <div class="top-bar-content">
                    <div class="left-profile">
                        <div class="caste-info" onclick="openProfileModal()">
                            <div class="caste-icon">${casteIcon}</div>
                            <div class="caste-level">Ур. ${currentPlayer.level}</div>
                        </div>
                    </div>
                    <div class="resources-column">
                        <div class="resources-row">
                            <div class="resource-item"><span>🚬</span><span>${currentPlayer.cigarettes}</span></div>
                            <div class="resource-item"><span>💰</span><span>${currentPlayer.rubles}</span></div>
                            <div class="resource-item"><span>⭐</span><span>${currentPlayer.authority}</span></div>
                            <div class="resource-item"><span>⚡</span><span>${currentPlayer.energy}/${currentPlayer.maxEnergy}</span></div>
                        </div>
                        <div class="resources-row">
                            <div class="resource-item"><span>📄</span><span>${paper}</span></div>
                            <div class="resource-item"><span>🌿</span><span>${makhorka}</span></div>
                            <div class="resource-item"><span>🪵</span><span>${wood}</span></div>
                            <div class="resource-item"><span>🪨</span><span>${stone}</span></div>
                        </div>
                    </div>
                    <button class="settings-btn" onclick="openSettingsModal()">⚙️</button>
                </div>
            </div>
            <div class="game-container">
                <div class="map-wrapper">
                    <img class="map-image" src="https://sviter-pro.github.io/GameZone/src/test/123.png" alt="Карта зоны">
                    <div class="building b1" data-building="b1" onclick="openInventoryModal()"><div class="building-label">Камера</div></div>
                    <div class="building b2" data-building="b2" onclick="openMineModal()"><div class="building-label">Работа</div></div>
                    <div class="building b3" data-building="b3" onclick="openCardGameFullModal()"><div class="building-label">Игровая</div></div>
                    <div class="building b4" data-building="b4" onclick="openShopModal()"><div class="building-label">Магазин</div></div>
                    <div class="building b5" data-building="b5" onclick="openHospitalModal()"><div class="building-label">Больница</div></div>
                    <div class="building b6" data-building="b6" onclick="openAttackModal()"><div class="building-label">Сходка</div></div>
                    <div class="building b7" data-building="b7" onclick="openGangModal()">
                        <div class="building-label">СИЗО</div>
                        ${countersHtml}
                    </div>
                </div>
            </div>
            <div class="fixed-bottom-bar">
                <div class="bottom-nav">
                    <button class="nav-btn ${currentBottomTab === 'city' ? 'active' : ''}" onclick="switchBottomTab('city')"><span>🏙️</span><span>Город</span></button>
                    <button class="nav-btn ${currentBottomTab === 'treasury' ? 'active' : ''}" onclick="switchBottomTab('treasury')"><span>💰</span><span>Общак</span></button>
                    <button class="nav-btn notification-badge ${currentBottomTab === 'clan' ? 'active' : ''}" onclick="switchBottomTab('clan')">
                        <span>👥</span><span>Клан</span>
                        ${clanQuestReadyCount > 0 ? `<span class="badge-count">${clanQuestReadyCount}</span>` : ''}
                    </button>
                    <button class="nav-btn ${currentBottomTab === 'war' ? 'active' : ''}" onclick="switchBottomTab('war')"><span>⚡</span><span>Война</span></button>
                    <button class="nav-btn notification-badge ${currentBottomTab === 'quests' ? 'active' : ''}" onclick="switchBottomTab('quests')">
                        <span>📋</span><span>Задания</span>
                        ${questNotificationCount > 0 ? `<span class="badge-count">${questNotificationCount}</span>` : ''}
                    </button>
                </div>
            </div>
            ${toast.show ? `<div class="toast ${toast.type === 'error' ? 'error' : (toast.type === 'success' ? 'success' : 'warning')}">${toast.message}</div>` : ''}
        `;
        
        if (window.mapCountersInterval) clearInterval(window.mapCountersInterval);
        window.mapCountersInterval = setInterval(() => {
            if (!currentPlayer) { if (window.mapCountersInterval) clearInterval(window.mapCountersInterval); return; }
            renderUI();
        }, 1000);
    }
    
    async function loginWithTelegram() {
        if (!tgUser || !db) return false;
        try {
            showLoadingScreen();
            const telegramId = tgUser.id.toString();
            let username = tgUser.username || tgUser.first_name || `user_${telegramId}`;
            
            const urlParams = new URLSearchParams(window.location.search);
            const refCode = urlParams.get('ref');
            let inviterId = null;
            
            if (refCode) {
                const inviterSnapshot = await db.collection('players').where('inviteCode', '==', refCode).get();
                if (!inviterSnapshot.empty) inviterId = inviterSnapshot.docs[0].id;
            }
            
            const snapshot = await db.collection('players').where('telegramId', '==', telegramId).get();
            
            if (!snapshot.empty) {
                const doc = snapshot.docs[0];
                const player = { id: doc.id, ...doc.data() };
                if (player.isBanned) { alert('Аккаунт забанен'); hideLoadingScreen(); return false; }
                localStorage.setItem('playerId', player.id);
                localStorage.setItem('username', player.username);
                await startGame(player.id, player.username);
                return true;
            } else {
                let finalUsername = username.replace(/[^a-zA-Z0-9]/g, '').substring(0, 10);
                if (finalUsername.length < 3) finalUsername = `user${telegramId.substring(0, 5)}`;
                
                const existing = await db.collection('players').where('username', '==', finalUsername).get();
                if (!existing.empty) finalUsername = `${finalUsername}_${telegramId.substring(0, 3)}`;
                
                const castes = ['Блатные', 'Мужики', 'Фраер'];
                const randomCaste = castes[Math.floor(Math.random() * castes.length)];
                
                const playerData = getDefaultPlayer(finalUsername, randomCaste);
                playerData.telegramId = telegramId;
                playerData.telegramName = tgUser.first_name || '';
                
                const docRef = await db.collection('players').add(playerData);
                
                if (inviterId) {
                    const inviterRef = db.collection('players').doc(inviterId);
                    await inviterRef.update({
                        cigarettes: firebase.firestore.FieldValue.increment(500),
                        rubles: firebase.firestore.FieldValue.increment(250),
                        invitedPlayers: firebase.firestore.FieldValue.arrayUnion(finalUsername)
                    });
                }
                
                localStorage.setItem('playerId', docRef.id);
                localStorage.setItem('username', finalUsername);
                await startGame(docRef.id, finalUsername);
                return true;
            }
        } catch(e) { hideLoadingScreen(); showToast('Ошибка входа: ' + e.message, 'error'); return false; }
    }
    
    function showLoginForm() {
        document.getElementById('app').innerHTML = `
            <div class="game-container">
                <div style="text-align:center; background:linear-gradient(135deg,#13172b,#0f1425); border-radius:28px; padding:30px; margin-top:20px;">
                    <div style="font-size:48px; margin-bottom:16px">🔒🏢🔒</div>
                    <div style="font-size:24px; font-weight:700; margin-bottom:8px">ТЮРЯГА 2.0</div>
                    <p style="color:#aaa; margin-bottom:24px">Клановые войны | Бесконечная прокачка</p>
                    ${tg ? `<button onclick="loginWithTelegram()" class="btn-primary" style="width:100%; margin-bottom:12px; background:linear-gradient(135deg,#29aae1,#1c7eb5);">📱 Войти через Telegram</button>
                    <hr style="margin:15px 0; border-color:#333">` : ''}
                    <input type="text" id="loginUsername" placeholder="Ник (3-10 символов, латиница/цифры)" style="width:100%; padding:14px; margin:12px 0; background:#1e2440; border:none; border-radius:30px; color:white; text-align:center">
                    <button onclick="doLogin()" class="btn-primary" style="width:100%; margin-top:8px;">🔑 Войти</button>
                </div>
            </div>
        `;
    }
    
    async function doLogin() {
        const username = document.getElementById('loginUsername')?.value.trim();
        if (!username) { alert('Введите ник'); return; }
        if (!/^[a-zA-Z0-9]{3,10}$/.test(username)) { alert('Ник 3-10 символов, латиница/цифры'); return; }
        try {
            showLoadingScreen();
            const snapshot = await db.collection('players').where('username', '==', username).get();
            if (snapshot.empty) { alert('Игрок не найден!'); hideLoadingScreen(); return; }
            const doc = snapshot.docs[0];
            const player = { id: doc.id, ...doc.data() };
            if (player.isBanned) { alert('Аккаунт забанен'); hideLoadingScreen(); return; }
            localStorage.setItem('playerId', player.id);
            localStorage.setItem('username', username);
            await startGame(player.id, username);
        } catch (error) { alert('Ошибка входа: ' + error.message); hideLoadingScreen(); }
    }
    
    function getDefaultPlayer(username, caste) {
        return {
            username: username, level: 1, authority: 0, authorityToNext: 1000, energy: 100, maxEnergy: 100,
            rubles: 0, cigarettes: 50, tattoos: [], equipped: { weapon: 'камень', armor: 'роба', accessory: 'чифирная кружка' },
            stats: { strength: 10, defense: 5, critical: 5 }, clanId: null, inviteCode: Math.random().toString(36).substring(2, 8).toUpperCase(),
            invitedPlayers: [], createdAt: Date.now(), lastActive: Date.now(), totalCrimes: 0, isBanned: false,
            mine: { paperLevel: 1, makhorkaLevel: 1, lastMineTime: 0, paper: 0, makhorka: 0 },
            lumber: { level: 1, lastGatherTime: 0, wood: 0 },
            quarry: { level: 1, lastGatherTime: 0, stone: 0 },
            dailyBonus: { lastClaimDay: 0, lastClaimTime: 0, streak: 0 }, caste: caste,
            completedQuests: [], purchasedItemsCount: {},
            cardGameActive: false, cardGameStartTime: 0, cardGameBonusPercent: 0, cardGameUpgradeLevel: 1,
            gymLevel: 1, gymActive: false,
            gang: {
                blats: { level: 1, fighters: 0, upgradeStartTime: 0, upgradeDuration: 0, lastRecruitTime: 0 },
                muzhiks: { level: 1, fighters: 0, upgradeStartTime: 0, upgradeDuration: 0, lastRecruitTime: 0 },
                fraers: { level: 1, fighters: 0, upgradeStartTime: 0, upgradeDuration: 0, lastRecruitTime: 0 }
            },
            shopLevel: 1
        };
    }
    
    const savedId = localStorage.getItem('playerId');
    (async function init() {
        await loadTips();
        await checkMaintenanceMode();
        if (savedId && db) {
            const doc = await db.collection('players').doc(savedId).get();
            if (doc.exists) await startGame(savedId, '');
            else if (tgUser) await loginWithTelegram();
            else showLoginForm();
        } else if (tgUser) await loginWithTelegram();
        else showLoginForm();
    })();

    window.joinClanFromModal = joinClanFromModal;
    window.leaveClanFromModal = leaveClanFromModal;
    window.toggleDefenseFromModal = toggleDefenseFromModal;
    window.donateToClanFromModal = donateToClanFromModal;
    window.claimClanQuestExternal = claimClanQuestExternal;
    window.switchBottomTab = switchBottomTab;
    window.openProfileModal = openProfileModal;
    window.closeProfileModal = closeProfileModal;
    window.openSettingsModal = openSettingsModal;
    window.closeSettingsModal = closeSettingsModal;
    window.toggleNotifications = toggleNotifications;
    window.openInventoryModal = openInventoryModal;

    window.changeUsername = changeUsername;
    window.logoutAccount = logoutAccount;
    window.deleteAccount = deleteAccount;
    window.loginWithTelegram = loginWithTelegram;
    window.doLogin = doLogin;
    window.showToast = showToast;
    window.copyInviteCode = copyInviteCode;
    window.copyToClipboard = copyToClipboard;
    window.closeModal = closeModal;
</script>
