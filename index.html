<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GameZona - 1.0.1.012</title>
    <!-- Telegram WebApp Script -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* ============================================================
           БАЗОВЫЕ СТИЛИ + ЗАЩИТА ОТ ВЫДЕЛЕНИЯ
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none !important;
            -webkit-user-select: none !important;
            -moz-user-select: none !important;
            -ms-user-select: none !important;
            user-select: none !important;
            -webkit-user-drag: none !important;
            user-drag: none !important;
        }

        html, body {
            overscroll-behavior: none;
            -webkit-overflow-scrolling: touch;
            touch-action: manipulation !important;
        }

        body {
            background: #0a0e1a;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', system-ui, sans-serif;
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 20px 0px;
            padding-top: 110px;
            padding-bottom: 85px;
            overflow-x: hidden;
            overflow-y: auto;
            -webkit-touch-callout: none !important;
            user-select: none !important;
        }

        /* Запрет выделения текста */
        ::selection {
            background: transparent !important;
        }
        ::-moz-selection {
            background: transparent !important;
        }

        /* Запрет контекстного меню */
        img, button, .building, .nav-btn, .caste-info, .settings-btn {
            -webkit-touch-callout: none !important;
            touch-action: manipulation !important;
            -webkit-user-drag: none !important;
            user-drag: none !important;
        }

        /* Скрываем скроллбар */
        ::-webkit-scrollbar {
            width: 0px;
            height: 0px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes toastFadeIn {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        /* ============================================================
           АВТОРИЗАЦИЯ (Telegram + Вход)
           ============================================================ */
        #authScreen {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(ellipse at 50% 30%, rgba(233,69,96,0.15) 0%, #0a0e1a 70%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            animation: fadeIn 0.5s ease;
        }

        #authScreen.hidden {
            display: none;
        }

        .auth-container {
            background: rgba(16, 20, 40, 0.95);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 32px;
            padding: 36px 28px;
            max-width: 400px;
            width: 92%;
            border: 1px solid rgba(233, 69, 96, 0.25);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
        }

        .auth-logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .auth-logo h1 {
            font-size: 38px;
            font-weight: 800;
            background: linear-gradient(135deg, #e94560, #ff6b6b, #e94560);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: gradientShift 3s ease-in-out infinite;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .auth-logo p {
            color: #888;
            font-size: 14px;
            margin-top: 6px;
            letter-spacing: 1px;
        }

        .auth-form h2 {
            color: #e94560;
            font-size: 20px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .auth-input {
            width: 100%;
            padding: 14px 18px;
            margin-bottom: 12px;
            background: rgba(30, 36, 64, 0.8);
            border: 1px solid rgba(233, 69, 96, 0.2);
            border-radius: 40px;
            color: white;
            font-size: 15px;
            transition: border-color 0.3s, box-shadow 0.3s;
            outline: none;
        }

        .auth-input:focus {
            border-color: #e94560;
            box-shadow: 0 0 20px rgba(233, 69, 96, 0.15);
        }

        .auth-input::placeholder {
            color: #666;
        }

        .auth-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #e94560, #c73e54);
            border: none;
            border-radius: 40px;
            font-size: 16px;
            font-weight: 700;
            color: white;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .auth-btn:active {
            transform: scale(0.96);
        }

        .auth-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .auth-btn.telegram {
            background: linear-gradient(135deg, #29aae1, #1c7eb5);
            margin-bottom: 12px;
        }

        .auth-btn.telegram:active {
            transform: scale(0.96);
        }

        .auth-divider {
            display: flex;
            align-items: center;
            margin: 18px 0;
            color: #555;
            font-size: 12px;
            gap: 12px;
        }

        .auth-divider::before,
        .auth-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
        }

        .auth-switch {
            text-align: center;
            margin-top: 16px;
            color: #888;
            font-size: 14px;
        }

        .auth-switch span {
            color: #e94560;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .auth-switch span:active {
            opacity: 0.7;
        }

        .auth-error {
            background: rgba(233, 69, 96, 0.15);
            border: 1px solid rgba(233, 69, 96, 0.4);
            border-radius: 12px;
            padding: 10px 14px;
            color: #e94560;
            font-size: 13px;
            text-align: center;
            margin-bottom: 14px;
            display: none;
        }

        .auth-error.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        /* ============================================================
           ВЕРХНЯЯ ПАНЕЛЬ
           ============================================================ */
        .fixed-top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(10, 14, 26, 0.88);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(233, 69, 96, 0.25);
            padding: 8px 12px;
            padding-top: max(8px, env(safe-area-inset-top));
        }

        .top-bar-content {
            max-width: 412px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
        }

        .left-profile {
            flex-shrink: 0;
        }

        .caste-info {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 56px;
            cursor: pointer;
            background: rgba(30, 36, 64, 0.5);
            border-radius: 40px;
            padding: 4px 8px;
            transition: 0.15s;
            border: 1px solid transparent;
        }

        .caste-info:active {
            transform: scale(0.94);
            background: rgba(233, 69, 96, 0.15);
            border-color: rgba(233, 69, 96, 0.3);
        }

        .caste-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(201, 160, 61, 0.6);
            background: #1a1a2a;
            transition: border-color 0.3s;
        }

        .caste-avatar:hover {
            border-color: #c9a03d;
        }

        .caste-level {
            font-size: 8px;
            color: #888;
            margin-top: 1px;
            font-weight: 600;
        }

        .resources-column {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 3px;
            min-width: 0;
        }

        .resources-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
            flex-wrap: wrap;
        }

        .resource-item {
            background: rgba(30, 36, 64, 0.7);
            border-radius: 30px;
            padding: 2px 8px;
            display: flex;
            align-items: center;
            gap: 3px;
            font-size: 10px;
            font-weight: 600;
            border: 1px solid rgba(233, 69, 96, 0.12);
            white-space: nowrap;
            color: #ccc;
        }

        .resource-item span:first-child {
            font-size: 11px;
        }

        .resource-item .value {
            color: #ffd966;
        }

        .settings-btn {
            background: rgba(30, 36, 64, 0.6);
            border: none;
            padding: 4px 10px;
            border-radius: 40px;
            font-size: 17px;
            cursor: pointer;
            color: white;
            flex-shrink: 0;
            transition: 0.15s;
            border: 1px solid transparent;
        }

        .settings-btn:active {
            transform: scale(0.92);
            background: rgba(233, 69, 96, 0.2);
            border-color: rgba(233, 69, 96, 0.3);
        }

        /* ============================================================
           НИЖНЯЯ ПАНЕЛЬ
           ============================================================ */
        .fixed-bottom-bar {
            position: fixed;
            bottom: -2px;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(10, 14, 26, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(233, 69, 96, 0.2);
            padding: 4px 0;
            padding-bottom: max(4px, env(safe-area-inset-bottom));
        }

        .bottom-nav {
            max-width: 500px;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .nav-btn {
            background: transparent;
            border: none;
            border-radius: 14px;
            padding: 4px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            color: #8e8ea0;
            font-size: 11px;
            font-weight: 500;
            position: relative;
            -webkit-touch-callout: none !important;
            touch-action: manipulation !important;
        }

        .nav-btn img {
            width: 44px;
            height: auto;
            object-fit: contain;
            display: block;
            -webkit-user-select: none;
            user-select: none;
            pointer-events: none;
            -webkit-user-drag: none;
            user-drag: none;
        }

        .nav-btn.active {
            background: rgba(233, 69, 96, 0.12);
            border: 2px solid rgba(233, 69, 96, 0.6);
            box-shadow: 0 0 16px rgba(233, 69, 96, 0.25);
            transform: scale(1.02);
        }

        .nav-btn:active {
            transform: scale(0.92);
            background: rgba(233, 69, 96, 0.2);
        }

        .nav-btn span {
            display: none;
        }

        /* ============================================================
           ГЛАВНЫЙ ЭКРАН (КАРТА)
           ============================================================ */
        .game-container {
            max-width: 412px;
            width: 100%;
            margin: 0 auto;
            padding: 0;
        }

        .map-wrapper {
            position: relative;
            width: 100%;
            max-width: 100%;
            margin: 0 auto;
            margin-top: -30px;
            margin-bottom: -30px;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
        }

        .map-image {
            width: 100%;
            height: auto;
            display: block;
            pointer-events: none;
            user-select: none;
            max-width: 100%;
            -webkit-user-drag: none;
            user-drag: none;
        }

        .building {
            position: absolute;
            border: 2px solid transparent;
            border-radius: 16px;
            cursor: pointer;
            transition: 0.25s;
            -webkit-touch-callout: none !important;
            touch-action: manipulation !important;
        }

        .building.active {
            border: 3px solid #ffb347;
            box-shadow: 0 0 30px rgba(255, 180, 70, 0.6), inset 0 0 30px rgba(255, 180, 70, 0.15);
            background: rgba(255, 180, 70, 0.1);
        }

        .building:active {
            transform: scale(0.96);
        }

        .building-label {
            position: absolute;
            left: 50%;
            top: -34px;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.92);
            border: 1px solid #ffb347;
            color: #ffcf7a;
            padding: 5px 12px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 700;
            opacity: 0;
            pointer-events: none;
            transition: 0.25s;
            white-space: nowrap;
            box-shadow: 0 0 25px rgba(255, 180, 70, 0.3);
            z-index: 100;
            letter-spacing: 0.5px;
        }

        .building:hover .building-label {
            opacity: 0.8;
            top: -42px;
        }

        .building.active .building-label {
            opacity: 1;
            top: -46px;
        }

        .b1 { top: 3%; left: 31%; width: 38%; height: 15%; }
        .b2 { top: 18%; left: 3%; width: 38%; height: 18%; }
        .b3 { top: 19%; right: 3%; width: 38%; height: 18%; }
        .b4 { top: 37%; left: 28%; width: 42%; height: 13%; }
        .b5 { top: 51%; left: 4%; width: 34%; height: 18%; }
        .b6 { top: 51%; right: 4%; width: 34%; height: 18%; }
        .b7 { top: 72%; left: 28%; width: 43%; height: 16%; }

        /* ============================================================
           TOAST
           ============================================================ */
        .game-toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #1a1a2a, #0d0d15);
            border: 2px solid #c9a03d;
            color: #ffd966;
            padding: 12px 22px;
            border-radius: 16px;
            font-size: 14px;
            font-weight: 600;
            z-index: 20000;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.6);
            animation: toastFadeIn 0.3s ease;
            max-width: 92vw;
            text-align: center;
            word-wrap: break-word;
            line-height: 1.4;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .game-toast.error {
            border-color: #e94560;
            color: #e94560;
        }

        .game-toast.success {
            border-color: #4caf50;
            color: #4caf50;
        }

        .game-toast.warning {
            border-color: #ff9800;
            color: #ff9800;
        }

        /* ============================================================
           ЗАГРУЗКА
           ============================================================ */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(10, 14, 26, 0.92);
            backdrop-filter: blur(12px);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 99999;
        }

        .loading-screen.show {
            display: flex;
        }

        .loading-spinner {
            width: 48px;
            height: 48px;
            border: 3px solid rgba(233, 69, 96, 0.2);
            border-top-color: #e94560;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        .loading-text {
            color: #888;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        /* ============================================================
           МОДАЛЬНЫЕ ОКНА (ПРОФИЛЬ, ИНВЕНТАРЬ, НАСТРОЙКИ)
           ============================================================ */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.82);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            z-index: 20000;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.25s ease;
            padding: 16px;
        }

        .modal-window {
            background: linear-gradient(145deg, #0f1327, #1a1e3a);
            border: 1px solid rgba(139, 69, 19, 0.4);
            border-radius: 28px;
            width: 100%;
            max-width: 420px;
            max-height: 85vh;
            overflow-y: auto;
            padding: 24px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.3s ease;
        }

        .modal-window::-webkit-scrollbar {
            width: 0px;
        }

        .modal-window-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(139, 69, 19, 0.3);
            padding-bottom: 14px;
            margin-bottom: 18px;
        }

        .modal-window-title {
            font-size: 20px;
            font-weight: 800;
            background: linear-gradient(135deg, #c9a03d, #8B6914);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 0.5px;
        }

        .modal-window-close {
            background: rgba(139, 69, 19, 0.25);
            border: none;
            border-radius: 50%;
            width: 34px;
            height: 34px;
            cursor: pointer;
            color: white;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .modal-window-close:active {
            transform: scale(0.88);
            background: rgba(233, 69, 96, 0.3);
        }

        /* ============================================================
           ПРОФИЛЬ
           ============================================================ */
        .profile-avatar-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 16px;
        }

        .profile-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #c9a03d;
            box-shadow: 0 0 25px rgba(201, 160, 61, 0.25);
            cursor: pointer;
            transition: all 0.2s;
            background: #1a1a2a;
        }

        .profile-avatar:active {
            transform: scale(0.94);
        }

        .profile-avatar-hint {
            font-size: 11px;
            color: #888;
            margin-top: 6px;
            letter-spacing: 0.5px;
        }

        .profile-username {
            text-align: center;
            font-size: 22px;
            font-weight: 700;
            color: #ffd966;
            margin: 10px 0 16px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .profile-username .edit-icon {
            font-size: 16px;
            background: rgba(139, 69, 19, 0.3);
            padding: 4px 12px;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.2s;
            color: #c9a03d;
            font-weight: 600;
        }

        .profile-username .edit-icon:active {
            transform: scale(0.9);
            background: rgba(139, 69, 19, 0.6);
        }

        .profile-stat-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin: 16px 0;
        }

        .profile-stat-item {
            background: rgba(0, 0, 0, 0.35);
            border-radius: 14px;
            padding: 10px;
            text-align: center;
            border: 1px solid rgba(139, 69, 19, 0.15);
        }

        .profile-stat-label {
            font-size: 9px;
            color: #c9a03d;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .profile-stat-value {
            font-size: 18px;
            font-weight: 700;
            color: #ffd966;
            margin-top: 2px;
        }

        .profile-action-btn {
            width: 100%;
            padding: 12px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 10px;
            border: none;
            letter-spacing: 0.5px;
        }

        .profile-action-btn:active {
            transform: scale(0.96);
        }

        .profile-action-btn.logout {
            background: linear-gradient(135deg, #8B4513, #5a2d0a);
            border: 1px solid #c9a03d;
            color: #ffd966;
        }

        .profile-action-btn.delete {
            background: linear-gradient(135deg, #8B1a1a, #5a0a0a);
            border: 1px solid #e94560;
            color: #e94560;
        }

        .profile-action-btn.avatar {
            background: rgba(30, 36, 64, 0.8);
            border: 1px solid rgba(139, 69, 19, 0.3);
            color: #c9a03d;
        }

        /* ============================================================
           ВЫБОР АВАТАРОВ
           ============================================================ */
        .avatar-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin: 16px 0;
        }

        .avatar-item {
            text-align: center;
            padding: 10px 6px;
            background: rgba(30, 36, 64, 0.5);
            border-radius: 16px;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.2s;
        }

        .avatar-item:active {
            transform: scale(0.94);
        }

        .avatar-item.selected {
            border-color: #c9a03d;
            background: rgba(201, 160, 61, 0.15);
            box-shadow: 0 0 20px rgba(201, 160, 61, 0.2);
        }

        .avatar-item .avatar-img {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(139, 69, 19, 0.3);
        }

        .avatar-item .avatar-name {
            font-size: 10px;
            color: #aaa;
            margin-top: 4px;
        }

        .avatar-item .avatar-status {
            font-size: 9px;
            font-weight: 600;
        }

        .avatar-item .avatar-status.owned {
            color: #4caf50;
        }

        .avatar-item .avatar-status.locked {
            color: #888;
        }

        .avatar-item .avatar-status.selected {
            color: #c9a03d;
        }

        /* ============================================================

// ============================================================
function subscribeShopUpgrade() {
    if (!window.playerId) return;
    
    var ref = db.ref('players/' + window.playerId);
    ref.on('value', function(snapshot) {
        if (snapshot.exists()) {
            var data = snapshot.val();
            
            // Обновляем данные прокачки
            if (data.shopLevel !== undefined) {
                window.shopLevel = data.shopLevel;
            }
            if (data.shopUpgradeStartTime !== undefined) {
                window.shopUpgradeStartTime = data.shopUpgradeStartTime || 0;
            }
            if (data.shopUpgradeDuration !== undefined) {
                window.shopUpgradeDuration = data.shopUpgradeDuration || 0;
            }
            
            // Если окно магазина открыто - обновляем UI
            var modal = document.getElementById('shopFullscreen');
            if (modal) {
                updateShopUpgradeUI();
                
                // Если прокачка завершилась - обновляем товары
                if (!isShopUpgradeActive() && window.shopUpgradeStartTime === 0) {
                    renderShopItemsContent();
                    updateResources();
                }
            }
        }
    }, function(error) {
        console.warn('⚠️ Ошибка слушателя прокачки:', error);
    });
}

// ============================================================
// 2.2. ОБНОВЛЕНИЕ UI ПРОКАЧКИ
// ============================================================
function updateShopUpgradeUI() {
    var levelSpan = document.getElementById('shopLevelValue');
    var availableSpan = document.getElementById('shopAvailableItems');
    var upgradeTimer = document.getElementById('shopUpgradeTimer');
    var upgradeProgress = document.getElementById('shopUpgradeProgress');
    var upgradeContainer = document.getElementById('shopUpgradeContainer');
    
    if (levelSpan) levelSpan.textContent = window.shopLevel || 1;
    if (availableSpan) availableSpan.textContent = 1 + (window.shopLevel || 1);
    
    var isActive = isShopUpgradeActive();
    
    if (isActive) {
        var remaining = getShopUpgradeRemaining();
        if (upgradeTimer) upgradeTimer.textContent = formatTimerMinutes(remaining);
        
        if (upgradeProgress) {
            var progress = ((window.shopUpgradeDuration - remaining) / window.shopUpgradeDuration) * 100;
            upgradeProgress.style.width = Math.min(100, progress) + '%';
        }
    }
    
    // Если прокачка завершилась - обновляем контейнер
    if (!isActive && window.shopUpgradeStartTime === 0 && upgradeContainer) {
        // Перерисовываем контейнер прокачки
        var currentTab = window.currentShopTab;
        if (currentTab === 'upgrade') {
            switchShopTab('upgrade');
        }
    }
}

// 2.4. ПРОКАЧКА МАГАЗИНА (С ОНЛАЙН-ОБНОВЛЕНИЕМ)
// ============================================================
async function upgradeShop() {
    if (!window.currentPlayer) {
        showToast('❌ Игрок не найден!', 'error');
        return;
    }
    
    if (isShopUpgradeActive()) {
        showToast('⏳ Прокачка уже идет! Дождитесь завершения.', 'warning');
        return;
    }
    
    var level = window.shopLevel || 1;
    var costCigarettes = 100 * level;
    var costWood = 50 * level;
    var costStone = 30 * level;
    
    if (window.currentPlayer.cigarettes < costCigarettes) {
        showToast('❌ Не хватает ' + (costCigarettes - window.currentPlayer.cigarettes) + ' 🚬!', 'error');
        return;
    }
    if ((window.currentPlayer.lumber?.wood || 0) < costWood) {
        showToast('❌ Не хватает ' + (costWood - (window.currentPlayer.lumber?.wood || 0)) + ' 🪵!', 'error');
        return;
    }
    if ((window.currentPlayer.quarry?.stone || 0) < costStone) {
        showToast('❌ Не хватает ' + (costStone - (window.currentPlayer.quarry?.stone || 0)) + ' 🪨!', 'error');
        return;
    }
    
    try {
        showLoading(true, 'Начало прокачки...');
        
        // Списываем ресурсы
        window.currentPlayer.cigarettes -= costCigarettes;
        if (window.currentPlayer.lumber) window.currentPlayer.lumber.wood -= costWood;
        if (window.currentPlayer.quarry) window.currentPlayer.quarry.stone -= costStone;
        
        var upgradeDurationMs = 2 * 60 * 1000;
        upgradeDurationMs = Math.floor(upgradeDurationMs * (1 + (level - 1) * 0.1));
        var upgradeStartTime = Date.now();
        
        window.shopUpgradeStartTime = upgradeStartTime;
        window.shopUpgradeDuration = upgradeDurationMs;
        
        // Сохраняем в БД
        var updateData = {
            cigarettes: window.currentPlayer.cigarettes,
            lumber: window.currentPlayer.lumber,
            quarry: window.currentPlayer.quarry,
            shopLevel: window.shopLevel,
            shopUpgradeStartTime: upgradeStartTime,
            shopUpgradeDuration: upgradeDurationMs
        };
        
        await dbUpdate('players/' + window.playerId, updateData);
        
        showToast('⏳ Начата прокачка магазина! Уровень повысится через ' + Math.round(upgradeDurationMs / 60000) + ' мин.', 'success');
        showLoading(false);
        
        // ✅ МГНОВЕННО ОБНОВЛЯЕМ UI ПРОКАЧКИ
        updateShopUpgradeUI();
        
        // Переключаемся на вкладку прокачки, чтобы показать прогресс
        switchShopTab('upgrade');
        updateResources();
        
    } catch (e) {
        showLoading(false);
        showToast('❌ Ошибка: ' + e.message, 'error');
        console.error('Ошибка прокачки магазина:', e);
    }
}

// 2.5. ЗАВЕРШЕНИЕ ПРОКАЧКИ (АВТОМАТИЧЕСКОЕ)
// ============================================================
async function checkAndCompleteShopUpgrade() {
    var remaining = getShopUpgradeRemaining();
    
    // Если прокачка завершена
    if (remaining === 0 && window.shopUpgradeStartTime > 0) {
        var newLevel = (window.shopLevel || 1) + 1;
        
        // Обновляем данные в БД
        await dbUpdate('players/' + window.playerId, {
            shopLevel: newLevel,
            shopUpgradeStartTime: 0,
            shopUpgradeDuration: 0
        });
        
        // Обновляем локальные данные
        window.shopLevel = newLevel;
        window.shopUpgradeStartTime = 0;
        window.shopUpgradeDuration = 0;
        
        showToast('✅ Уровень магазина повышен до ' + newLevel + '!', 'success');
        
        // ✅ МГНОВЕННО ОБНОВЛЯЕМ ВЕСЬ UI
        updateShopUpgradeUI();
        renderShopItemsContent();
        updateResources();
        
        // Если вкладка прокачки открыта - обновляем её
        if (window.currentShopTab === 'upgrade') {
            switchShopTab('upgrade');
        }
        
        return true;
    }
    return false;
}

window.closeShopModal = function() {
    if (window.shopTimerInterval) {

        window.shopTimerInterval = null;
    }
    
    var modal = document.getElementById('shopFullscreen');
    if (modal) modal.remove();

};

// ТАЙМЕРЫ МАГАЗИНА
function startShopTimers() {
    if (window.shopTimerInterval) clearInterval(window.shopTimerInterval);
    
    window.shopTimerInterval = setInterval(function() {
        var modal = document.getElementById('shopFullscreen');
        if (!modal) {
            if (window.shopTimerInterval) {
                clearInterval(window.shopTimerInterval);
                window.shopTimerInterval = null;
            }
            return;
        }
        
        // Обновляем ресурсы
        var cigValue = document.getElementById('shopCigarettesValue');
        var rublesValue = document.getElementById('shopRublesValue');
        var woodValue = document.getElementById('shopWoodValue');
        var stoneValue = document.getElementById('shopStoneValue');
        
        if (cigValue && window.currentPlayer) cigValue.textContent = formatNumberShort(window.currentPlayer.cigarettes || 0);
        if (rublesValue && window.currentPlayer) rublesValue.textContent = formatNumberShort(window.currentPlayer.rubles || 0);
        if (woodValue && window.currentPlayer) woodValue.textContent = formatNumberShort(window.currentPlayer.lumber?.wood || 0);
        if (stoneValue && window.currentPlayer) stoneValue.textContent = formatNumberShort(window.currentPlayer.quarry?.stone || 0);
        
        // Обновляем таймер обновления
        var timerEl = document.getElementById('randomUpdateTimerValue');
        if (timerEl && window.currentShopTab === 'offers') {
            timerEl.textContent = formatTimeDetailedWithSeconds(getRandomShopUpdateRemaining());
        }
        
        // ✅ ОБНОВЛЯЕМ UI ПРОКАЧКИ (если активна)
        if (isShopUpgradeActive()) {
            var remaining = getShopUpgradeRemaining();
            var upgradeTimer = document.getElementById('shopUpgradeTimer');
            var upgradeProgress = document.getElementById('shopUpgradeProgress');
            
            if (upgradeTimer) upgradeTimer.textContent = formatTimerMinutes(remaining);
            
            if (upgradeProgress) {
                var progress = ((window.shopUpgradeDuration - remaining) / window.shopUpgradeDuration) * 100;
                upgradeProgress.style.width = Math.min(100, progress) + '%';
            }
        }
        
        // ✅ ПРОВЕРЯЕМ ЗАВЕРШЕНИЕ ПРОКАЧКИ
        checkAndCompleteShopUpgrade();
    }, 1000);
}

window.switchShopTab = function(tab) {
    if (!tab) return;
    window.currentShopTab = tab;
    
    var offersContainer = document.getElementById('shopOffersContainer');
    var upgradeContainer = document.getElementById('shopUpgradeContainer');
    
    if (offersContainer) offersContainer.style.display = tab === 'offers' ? 'block' : 'none';
    if (upgradeContainer) upgradeContainer.style.display = tab === 'upgrade' ? 'block' : 'none';
    
    // Обновляем кнопки
    var btns = document.querySelectorAll('.shop-tab-btn2');
    btns.forEach(function(btn, index) {
        if (!btn) return;
        if (index === 0 && tab === 'offers') {
            btn.style.color = '#c9a03d';
            btn.style.background = 'rgba(139,69,19,0.3)';
        } else if (index === 0) {
            btn.style.color = '#8e8ea0';
            btn.style.background = 'transparent';
        } else if (index === 1 && tab === 'upgrade') {
            btn.style.color = '#c9a03d';
            btn.style.background = 'rgba(139,69,19,0.3)';
        } else if (index === 1) {
            btn.style.color = '#8e8ea0';
            btn.style.background = 'transparent';
        }
    });
    
    // Если переключились на прокачку - обновляем UI
    if (tab === 'upgrade') {
        updateShopUpgradeUI();
    }
};

// Функции для рандомных товаров
function generateRandomShopItems() {
    var items = [];
    var resourceTypes = [
        { type: 'cigarettes', name: 'Папиросы', icon: '🚬', desc: 'Пачка папирос', stat: null, bonus: 0 },
        { type: 'rubles', name: 'Деньги', icon: '💰', desc: 'Пачка рублей', stat: null, bonus: 0 },
        { type: 'paper', name: 'Бумага', icon: '📄', desc: 'Стопка бумаги', stat: null, bonus: 0 },
        { type: 'makhorka', name: 'Махорка', icon: '🌿', desc: 'Самосад', stat: null, bonus: 0 },
        { type: 'wood', name: 'Древесина', icon: '🪵', desc: 'Сосновый брус', stat: null, bonus: 0 },
        { type: 'stone', name: 'Камень', icon: '🪨', desc: 'Гранитная глыба', stat: null, bonus: 0 }
    ];
    
    var level = window.currentPlayer ? window.currentPlayer.level : 1;
    
    for (var i = 0; i < 12; i++) {
        var resource = resourceTypes[Math.floor(Math.random() * resourceTypes.length)];
        var priceType = Math.random() > 0.5 ? 'rubles' : 'cigarettes';
        var price = 0;
        if (priceType === 'rubles') {
            price = Math.floor(Math.random() * (50 + (level * 10))) + 10 + level * 2;
        } else {
            price = Math.floor(Math.random() * (30 + (level * 8))) + 5 + level;
        }
        var amount = Math.floor(Math.random() * (20 + (level * 3))) + 5 + Math.floor(level / 2);
        
        items.push({
            id: 'random_' + Date.now() + '_' + i + '_' + Math.random(),
            name: resource.name,
            desc: resource.desc,
            price: price,
            currency: priceType,
            type: 'resource',
            category: 'random',
            resourceType: resource.type,
            amount: amount,
            icon: resource.icon,
            stat: resource.stat,
            bonus: resource.bonus,
            imageUrl: ''
        });
    }
    return items;
}

function loadRandomShopFromStorage() {
    if (window.currentPlayer && window.currentPlayer.id) {
        var savedItems = localStorage.getItem('randomShopItems_' + window.currentPlayer.id);
        var savedLastUpdate = localStorage.getItem('randomShopLastUpdate_' + window.currentPlayer.id);
        var savedPurchased = localStorage.getItem('purchasedRandomItems_' + window.currentPlayer.id);
        
        if (savedItems) {
            try { randomShopItems = JSON.parse(savedItems); } catch(e) { randomShopItems = []; }
        }
        if (savedLastUpdate) {
            try { randomShopLastUpdate = parseInt(savedLastUpdate); } catch(e) { randomShopLastUpdate = 0; }
        }
        if (savedPurchased) {
            try { purchasedRandomItems = JSON.parse(savedPurchased); } catch(e) { purchasedRandomItems = {}; }
        }
        
        if (!randomShopItems || randomShopItems.length === 0 || (Date.now() - randomShopLastUpdate) >= 7200000) {
            updateRandomShopIfNeeded(false);
        }
    }
}

function updateRandomShopIfNeeded(force) {
    var now = Date.now();
    if (force || !randomShopItems || randomShopItems.length === 0 || now - randomShopLastUpdate >= 7200000) {
        if (force && window.currentPlayer && window.currentPlayer.rubles < 200) {
            showToast('❌ Не хватает 200💰 для принудительного обновления!', 'error');
            return false;
        }
        randomShopItems = generateRandomShopItems();
        randomShopLastUpdate = now;
        purchasedRandomItems = {};
        
        if (window.currentPlayer && window.currentPlayer.id) {
            localStorage.setItem('randomShopItems_' + window.currentPlayer.id, JSON.stringify(randomShopItems));
            localStorage.setItem('randomShopLastUpdate_' + window.currentPlayer.id, randomShopLastUpdate);
            localStorage.setItem('purchasedRandomItems_' + window.currentPlayer.id, JSON.stringify(purchasedRandomItems));
        }
        
        if (force && window.currentPlayer) {
            window.currentPlayer.rubles -= 200;
            dbUpdate('players/' + window.playerId, { rubles: window.currentPlayer.rubles });
            showToast('🎲 Ассортимент РАНДОМ обновлён! -200💰', 'success');
        }
        return true;
    }
    return false;
}

function getRandomShopUpdateRemaining() {
    var elapsed = Date.now() - (randomShopLastUpdate || 0);
    return Math.max(0, 7200000 - elapsed);
}

// Функции для состояния прокачки
function isShopUpgradeActive() {
    return window.shopUpgradeStartTime > 0 && window.shopUpgradeDuration > 0 && 
           (Date.now() - window.shopUpgradeStartTime) < window.shopUpgradeDuration;
}

function getShopUpgradeRemaining() {
    if (window.shopUpgradeStartTime === 0 || window.shopUpgradeDuration === 0) return 0;
    return Math.max(0, window.shopUpgradeDuration - (Date.now() - window.shopUpgradeStartTime));
}

        // 4. СЕТЬ: ОБРАБОТКА ОШИБОК И СЛАБОГО ИНТЕРНЕТА

        function checkNetworkStatus() {
            if (!navigator.onLine) {
                isOffline = true;
                showToast('📡 Нет подключения к интернету!', 'error');
                return false;
            }
            isOffline = false;
            return true;
        }

        window.addEventListener('online', () => {
            isOffline = false;
            showToast('✅ Интернет восстановлен!', 'success');
            if (window.currentPlayer && window.playerId) {
                refreshPlayerData();
            }
        });

        window.addEventListener('offline', () => {
            isOffline = true;
            showToast('📡 Потеряно подключение к интернету!', 'error');
        });

        async function withRetry(fn, context = 'операция', maxRetries = MAX_RETRIES) {
            let lastError = null;
            for (let attempt = 1; attempt <= maxRetries; attempt++) {
                try {
                    if (isOffline) {
                        await new Promise(r => setTimeout(r, 1000));
                        continue;
                    }
                    const result = await fn();
                    retryCount = 0;
                    return result;
                } catch (error) {
                    lastError = error;
                    console.warn(`⚠️ Попытка ${attempt}/${maxRetries} для "${context}" не удалась:`, error);
                    if (attempt < maxRetries) {
                        const delay = RETRY_DELAY * attempt;
                        showToast(`⏳ Повторная попытка... (${attempt}/${maxRetries})`, 'warning');
                        await new Promise(r => setTimeout(r, delay));
                    }
                }
            }
            const msg = `❌ Не удалось выполнить "${context}" после ${maxRetries} попыток`;
            showToast(msg, 'error');
            console.error(msg, lastError);
            throw lastError;
        }

        function dbRef(path) {
            return db.ref(path);
        }

        async function dbOnce(path) {
            return withRetry(async () => {
                const snapshot = await dbRef(path).once('value');
                return snapshot;
            }, `чтение ${path}`);
        }

        async function dbSet(path, data) {
            return withRetry(async () => {
                await dbRef(path).set(data);
                return true;
            }, `запись ${path}`);
        }

        async function dbUpdate(path, data) {
            return withRetry(async () => {
                await dbRef(path).update(data);
                return true;
            }, `обновление ${path}`);
        }

        async function dbRemove(path) {
            return withRetry(async () => {
                await dbRef(path).remove();
                return true;
            }, `удаление ${path}`);
        }

        function dbOn(path, callback) {
            const ref = dbRef(path);
            ref.on('value', (snapshot) => {
                if (isOffline) return;
                try {
                    callback(snapshot);
                } catch (e) {
                    console.error('Ошибка в слушателе:', e);
                }
            }, (error) => {
                console.warn('⚠️ Ошибка слушателя:', error);
                setTimeout(() => {
                    if (!isOffline) {
                        console.log('🔄 Переподключение слушателя...');
                        ref.off();
                        dbOn(path, callback);
                    }
                }, 5000);
            });
            return () => ref.off();
        }

        function showToast(msg, type = 'info') {
            const oldToast = document.querySelector('.game-toast');
            if (oldToast) oldToast.remove();

            const toast = document.createElement('div');
            toast.className = `game-toast ${type}`;
            toast.textContent = msg;
            document.body.appendChild(toast);

            if (msg.length > 40) {
                toast.style.fontSize = '12px';
                toast.style.padding = '10px 16px';
            }
            if (msg.length > 60) {
                toast.style.fontSize = '11px';
            }

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s ease';
                setTimeout(() => {

                }, 300);

        function formatNumberShort(num) {
            if (num === undefined || num === null) return '0';
            if (num >= 1000000000) return (num / 1000000000).toFixed(1).replace(/\.0$/, '') + 'B';
            if (num >= 1000000) return (num / 1000000).toFixed(1).replace(/\.0$/, '') + 'M';
            if (num >= 1000) return (num / 1000).toFixed(1).replace(/\.0$/, '') + 'K';
            return num.toString();
        }

        // 7.4. РАБОТА С БАЗОЙ ДАННЫХ
        async function savePlayerToDatabase(playerData) {
            try {
                var newRef = db.ref('players').push();
                var newKey = newRef.key;
                await newRef.set(playerData);
                console.log('✅ Игрок сохранён: players/' + newKey);
                return newKey;
            } catch (e) {
                console.error('❌ Ошибка сохранения:', e);
                throw e;
            }
        }

        async function getPlayerFromDatabase(playerId) {
            try {
                var snapshot = await db.ref('players/' + playerId).once('value');
                if (snapshot.exists()) {
                    return { id: playerId, ...snapshot.val() };
                }
                return null;
            } catch (e) {
                console.error('❌ Ошибка получения:', e);
                return null;
            }
        }

        async function findUserByUsername(username) {
            try {
                var snapshot = await db.ref('players').orderByChild('username').equalTo(username).once('value');
                var found = null;
                snapshot.forEach(function(child) {
                    found = { id: child.key, ...child.val() };
                });
                return found;
            } catch (e) {
                console.error('❌ Ошибка поиска по username:', e);
                return null;
            }
        }

        async function findUserByTelegramId(telegramId) {
            try {
                var snapshot = await db.ref('players').orderByChild('telegramId').equalTo(telegramId).once('value');
                var found = null;
                snapshot.forEach(function(child) {
                    found = { id: child.key, ...child.val() };
                });
                return found;
            } catch (e) {
                console.error('❌ Ошибка поиска по telegramId:', e);
                return null;
            }
        }

        async function checkUserExists(username) {
            try {
                var user = await findUserByUsername(username);
                return user !== null;
            } catch (e) {
                return false;
            }
        }

                if (!user) return { success: false, error: 'not_found' };
                if (user.isBanned) return { success: false, error: 'banned' };
                return { success: true, player: user };
            } catch (e) {
                return { success: false, error: 'error' };
            }
        }

        // 7.7. ВХОД ЧЕРЕЗ TELEGRAM
        async function loginWithTelegram() {
            var tgUser = getTelegramUser();
            
            if (!tgUser || !db) {
                showToast('❌ Ошибка: не удалось получить данные Telegram', 'error');
                return false;
            }
            
            var btn = document.getElementById('telegramLoginBtn');
            if (btn) {
                btn.disabled = true;
                btn.textContent = '⏳ Подключение...';
            }
            showLoading(true, 'Вход через Telegram...');

            try {
                var telegramId = tgUser.id.toString();
                var username = tgUser.username || tgUser.first_name || 'user_' + telegramId;
                username = username.replace(/[^a-zA-Z0-9]/g, '').substring(0, 10);
                if (username.length < 3) username = 'user' + telegramId.substring(0, 5);

                var user = await findUserByTelegramId(telegramId);

                if (user) {
                    if (user.isBanned) {
                        showToast('🚫 Аккаунт забанен!', 'error');
                        if (btn) { btn.disabled = false; btn.textContent = '📱 Войти через Telegram'; }
                        showLoading(false);
                        return false;
                    }

                    window.playerId = user.id;
                    window.currentPlayer = user;
                    localStorage.setItem('playerId', window.playerId);
                    localStorage.setItem('username', window.currentPlayer.username);

                    showLoading(false);
                    document.getElementById('authScreen').classList.add('hidden');
                    if (btn) { btn.disabled = false; btn.textContent = '📱 Войти через Telegram'; }
                    
                    showToast('👋 Добро пожаловать, ' + window.currentPlayer.username + '!', 'success');
                    
                    setTimeout(function() {
                        startGame();
                    }, 100);
                    
                    return true;
                }

                // НОВЫЙ ПОЛЬЗОВАТЕЛЬ
                var finalUsername = username;
                var isUnique = false;
                var counter = 0;
                
                while (!isUnique && counter < 10) {
                    var exists = await checkUserExists(finalUsername);
                    if (!exists) {
                        isUnique = true;
                    } else {
                        counter++;
                        finalUsername = username + counter;
                    }
                }
                
                if (!isUnique) {
                    finalUsername = 'user_' + telegramId.substring(0, 6);
                }

                var playerData = getDefaultPlayerData(
                    finalUsername,
                    telegramId,
                    tgUser.first_name || tgUser.username || 'Telegram User'
                );

                var playerId = await savePlayerToDatabase(playerData);

                window.playerId = playerId;
                window.currentPlayer = { id: playerId, ...playerData };
                localStorage.setItem('playerId', window.playerId);
                localStorage.setItem('username', finalUsername);

                showLoading(false);
                document.getElementById('authScreen').classList.add('hidden');
                if (btn) {
                    btn.disabled = false;
                    btn.textContent = '📱 Войти через Telegram';
                }
                
                showToast('🎉 Аккаунт создан через Telegram! Добро пожаловать, ' + finalUsername + '!', 'success');
                
                setTimeout(function() {
                    startGame();
                }, 100);
                
                return true;

            } catch (error) {
                console.error('❌ Ошибка входа через Telegram:', error);
                showToast('❌ Ошибка: ' + error.message, 'error');
                if (btn) {
                    btn.disabled = false;
                    btn.textContent = '📱 Войти через Telegram';
                }
                showLoading(false);
                return false;
            }
        }

                return;
            }
            
            if (!window.currentPlayer || !window.currentPlayer.username) {
                console.error('❌ Нет данных игрока или username = null');
                console.log('currentPlayer:', window.currentPlayer);
                document.getElementById('authScreen').classList.remove('hidden');
                return;
            }
            
            var app = document.getElementById('app');
            if (app && app.querySelector('.fixed-top-bar')) {
                console.log('⚠️ UI уже существует, обновляем только ресурсы');
                gameStarted = true;
                updateResources();
                return;
            }
            
            gameStarted = true;
            console.log('🚀 Запуск игры для:', window.currentPlayer.username);
            
            renderUI();
            subscribeToPlayer();
            restoreEnergy();
            
            showToast('🎮 Добро пожаловать, ' + window.currentPlayer.username + '!', 'success');
            console.log('✅ Игра запущена успешно!');
        }

                return;
            }
            
            var els = {

                resWood: window.currentPlayer.lumber?.wood || 0,
                resStone: window.currentPlayer.quarry?.stone || 0
            };

                var el = document.getElementById(id);
                if (el) {
                    el.textContent = typeof els[id] === 'string' ? els[id] : formatNumberShort(els[id]);
                }
            }
        }

        // 11. ПОДПИСКА НА ИЗМЕНЕНИЯ
        // ============================================================
        function subscribeToPlayer() {
            if (!window.playerId) return;
            if (unsubscribePlayer) unsubscribePlayer();
            
            var ref = db.ref('players/' + window.playerId);
            ref.on('value', function(snapshot) {
                if (snapshot.exists()) {
                    var data = snapshot.val();
                    var oldId = window.currentPlayer?.id;
                    window.currentPlayer = { id: oldId || window.playerId, ...data };
                    updateResources();
                }
            });
        }

        // ============================================================
        // 12. ВОССТАНОВЛЕНИЕ ЭНЕРГИИ
        // ============================================================
        function restoreEnergy() {
            if (window._energyInterval) {
                clearInterval(window._energyInterval);
            }
            
            window._energyInterval = setInterval(function() {
                if (window.currentPlayer && window.currentPlayer.energy < window.currentPlayer.maxEnergy) {
                    var newEnergy = Math.min(window.currentPlayer.maxEnergy, (window.currentPlayer.energy || 0) + 1);
                    db.ref('players/' + window.playerId + '/energy').set(newEnergy);
                    window.currentPlayer.energy = newEnergy;
                    updateResources();
                }
            }, 60000);
        }

window.toggleInventorySection = function(section) {
    const element = document.getElementById(`inventory${section.charAt(0).toUpperCase() + section.slice(1)}Section`);
    if (element) {
        if (element.style.display === 'none' || !element.style.display) {
            element.style.display = 'block';
            // Меняем стрелку
            const parent = element.previousElementSibling;
            if (parent) {
                const arrow = parent.querySelector('span:last-child span');
                if (arrow) arrow.textContent = '▲';
            }
        } else {
            element.style.display = 'none';
            const parent = element.previousElementSibling;
            if (parent) {
                const arrow = parent.querySelector('span:last-child span');
                if (arrow) arrow.textContent = '▼';
            }
        }
    }
};

window.changeEquipment = async function(slot, itemName, stat, bonus) {
    if (!window.currentPlayer) {
        showToast('❌ Игрок не найден!', 'error');
        return;
    }
    
    const oldItemName = window.currentPlayer.equipped[slot];
    
    if (oldItemName === itemName) {
        showToast('ℹ️ Этот предмет уже надет!', 'info');
        return;
    }
    
    const shopItems = getShopItemsFromAdmin();
    const oldItemData = shopItems.find(i => i.name === oldItemName && i.type === 'equipment' && i.slot === slot);
    const newItemData = shopItems.find(i => i.name === itemName && i.type === 'equipment' && i.slot === slot);
    
    if (!newItemData) {
        showToast('❌ Ошибка: предмет не найден!', 'error');
        return;
    }
    
    try {
        showLoading(true, 'Смена экипировки...');
        
        // Снимаем бонусы старого предмета
        if (oldItemData && oldItemData.stat && oldItemData.bonus) {
            window.currentPlayer.stats[oldItemData.stat] = (window.currentPlayer.stats[oldItemData.stat] || 0) - oldItemData.bonus;
            await dbUpdate('players/' + window.playerId, {
                [`stats.${oldItemData.stat}`]: firebase.database.ServerValue.increment(-oldItemData.bonus)
            });
        }
        
        // Надеваем новый предмет
        window.currentPlayer.equipped[slot] = itemName;
        if (stat && bonus) {
            window.currentPlayer.stats[stat] = (window.currentPlayer.stats[stat] || 0) + bonus;
            await dbUpdate('players/' + window.playerId, {
                [`equipped.${slot}`]: itemName,
                [`stats.${stat}`]: firebase.database.ServerValue.increment(bonus)
            });
        } else {
            await dbUpdate('players/' + window.playerId, {
                [`equipped.${slot}`]: itemName
            });
        }
        
        const statName = stat === 'strength' ? 'силы' : (stat === 'defense' ? 'защиты' : 'крита');
        showToast(`✅ Надето: ${itemName}! +${bonus} ${statName}`, 'success');
        showLoading(false);
        
        // Обновляем окно инвентаря
        closeInventoryModal();
        setTimeout(() => openInventoryModal(), 300);
        
        updateResources();
        
    } catch (e) {
        showLoading(false);
        showToast('❌ Ошибка: ' + e.message, 'error');
        console.error('Ошибка смены экипировки:', e);
    }
};

window.copyToClipboard = function(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function() {
            showToast('✅ Ссылка скопирована!', 'success');
        }).catch(function() {
            fallbackCopy(text);
        });
    } else {
        fallbackCopy(text);
    }
};

function fallbackCopy(text) {
    var textarea = document.createElement('textarea');
    textarea.value = text;
    textarea.style.position = 'fixed';
    textarea.style.opacity = '0';
    textarea.style.left = '-9999px';
    textarea.style.top = '-9999px';
    document.body.appendChild(textarea);
    textarea.select();
    try {
        document.execCommand('copy');
        showToast('✅ Ссылка скопирована!', 'success');
    } catch (e) {
        showToast('❌ Не удалось скопировать', 'error');
    }
    document.body.removeChild(textarea);
}

// 15.8. РАСЧЁТ МОЩИ ИГРОКА
// ============================================================
function calculatePlayerPower(player) {
    if (!player) return 0;
    
    var gangPower = 0;
    if (player.gang) {
        gangPower += (player.gang.blats?.fighters || 0) * 2;
        gangPower += (player.gang.muzhiks?.fighters || 0) * 1;
        gangPower += (player.gang.fraers?.fighters || 0) * 1;
    }
    
    return Math.floor(
        (player.level * 15) + 
        (player.authority / 100) + 
        ((player.strength || 10) * 2) + 
        ((player.defense || 5) * 1.5) + 
        (player.critical || 5) + 
        (player.energy / 20) + 
        gangPower
    );
}

// ============================================================
// 16.3. ПОЛУЧЕНИЕ РАСПРЕДЕЛЕНИЯ БОЙЦОВ
// ============================================================
function getGangDistribution() {
    if (!window.currentPlayer) {
        return { blats: 0, muzhiks: 0, fraers: 0, total: 0 };
    }
    
    const gang = window.currentPlayer.gang || {};
    const tab = window.currentProfileGangTab || 'city';
    
    // Если есть данные о распределении
    if (gang.distribution && gang.distribution[tab]) {
        const dist = gang.distribution[tab];
        return {
            blats: dist.blats || 0,
            muzhiks: dist.muzhiks || 0,
            fraers: dist.fraers || 0,
            total: (dist.blats || 0) + (dist.muzhiks || 0) + (dist.fraers || 0)
        };
    }
    
    // Если данных нет - показываем всё в городе
    const totalBlats = gang.blats?.fighters || 0;
    const totalMuzhiks = gang.muzhiks?.fighters || 0;
    const totalFraers = gang.fraers?.fighters || 0;
    
    if (tab === 'city') {
        return { 
            blats: totalBlats, 
            muzhiks: totalMuzhiks, 
            fraers: totalFraers, 
            total: totalBlats + totalMuzhiks + totalFraers 
        };
    }
    
    return { blats: 0, muzhiks: 0, fraers: 0, total: 0 };
}

window.switchProfileGangTab = function(tab) {

// 16.5. ОБНОВЛЕНИЕ СЕКЦИИ БАНДЫ В ПРОФИЛЕ
// ============================================================
function updateProfileGangSection() {
    const distribution = getGangDistribution();
    
    // Обновляем числа
    const blatsSpan = document.getElementById('profileGangBlatsCount');
    const muzhiksSpan = document.getElementById('profileGangMuzhiksCount');
    const fraersSpan = document.getElementById('profileGangFraersCount');
    
    if (blatsSpan) blatsSpan.textContent = distribution.blats;
    if (muzhiksSpan) muzhiksSpan.textContent = distribution.muzhiks;
    if (fraersSpan) fraersSpan.textContent = distribution.fraers;
    
    // Обновляем активные кнопки
    const tabNames = ['profileGangTabWar', 'profileGangTabRobbery', 'profileGangTabRecruit', 'profileGangTabCity'];
    const tabs = ['war', 'robbery', 'recruit', 'city'];
    
    for (let i = 0; i < tabs.length; i++) {
        const btn = document.getElementById(tabNames[i]);
        if (btn) {
            if (tabs[i] === window.currentProfileGangTab) {
                btn.style.color = '#c9a03d';
                btn.style.background = 'rgba(139,69,19,0.3)';
            } else {
                btn.style.color = '#8e8ea0';
                btn.style.background = 'transparent';
            }
        }
    }
}

// 16.6. ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ДЛЯ АВАТАРОВ
// ============================================================
function getAvatarUrl(avatarId) {
    const id = avatarId || window.currentPlayer?.currentAvatar || 1;
    const avatar = window.AVAATARS.find(a => a.id === id);
    return avatar ? avatar.url : window.AVAATARS[0].url;
}

function getAvatarName(id) {
    const avatar = window.AVAATARS.find(a => a.id === id);
    return avatar ? avatar.name : 'Блатной';
}

function getAvatarPrice(id) {
    const avatar = window.AVAATARS.find(a => a.id === id);
    return avatar ? avatar.price : 0;
}

function isAvatarPurchased(avatarId) {
    if (!window.currentPlayer) return false;
    const purchased = window.currentPlayer.purchasedAvatars || [];
    return purchased.includes(avatarId);
}

function updateAvatarEverywhere() {
    if (!window.currentPlayer) return;
    const avatarUrl = getAvatarUrl(window.currentPlayer.currentAvatar);
    
    const topAvatar = document.querySelector('.caste-avatar');
    if (topAvatar) topAvatar.src = avatarUrl;
    
    const profileAvatar = document.querySelector('.profile-avatar');
    if (profileAvatar) profileAvatar.src = avatarUrl;
}

// 16.7. ВЫБОР АВАТАРА
// ============================================================
window.selectAvatar = async function(avatarId) {
    if (!window.currentPlayer) {
        showToast('❌ Игрок не найден!', 'error');
        return;
    }
    
    if (!isAvatarPurchased(avatarId)) {
        showToast('❌ Этот аватар не куплен!', 'warning');
        return;
    }
    
    if (window.currentPlayer.currentAvatar === avatarId) {
        showToast('ℹ️ Этот аватар уже выбран', 'info');
        return;
    }
    
    const avatarName = getAvatarName(avatarId);
    if (!confirm(`Выбрать аватар "${avatarName}"?`)) {
        return;
    }
    
    try {
        showLoading(true, 'Установка аватара...');
        await dbUpdate('players/' + window.playerId, { currentAvatar: avatarId });
        window.currentPlayer.currentAvatar = avatarId;
        updateAvatarEverywhere();
        closeModal('avatarModal');
        closeProfileModal();
        showToast(`✅ Аватар "${avatarName}" установлен!`, 'success');
        showLoading(false);
        updateResources();
        setTimeout(() => openProfileModal(), 300);
    } catch (e) {
        showLoading(false);
        showToast('❌ Ошибка: ' + e.message, 'error');
    }
};

// ============================================================
window.buyAvatar = async function(avatarId) {
    if (!window.currentPlayer) {
        showToast('❌ Игрок не найден!', 'error');
        return;
    }
    
    if (isAvatarPurchased(avatarId)) {
        showToast('✅ Этот аватар уже куплен!', 'warning');
        return;
    }
    
    const price = getAvatarPrice(avatarId);
    const rubles = window.currentPlayer.rubles || 0;
    const avatarName = getAvatarName(avatarId);
    
    if (rubles < price) {
        const missing = price - rubles;
        showToast(`❌ Недостаточно средств! У вас: ${rubles}💰, не хватает: ${missing}💰`, 'error');
        return;
    }
    
    if (!confirm(`Купить аватар "${avatarName}" за ${price}💰?`)) {
        return;
    }
    
    try {
        showLoading(true, 'Покупка аватара...');
        const newRubles = rubles - price;
        const purchased = window.currentPlayer.purchasedAvatars || [];
        if (!purchased.includes(avatarId)) purchased.push(avatarId);
        
        await dbUpdate('players/' + window.playerId, {
            rubles: newRubles,
            purchasedAvatars: purchased,
            currentAvatar: avatarId
        });
        
        window.currentPlayer.rubles = newRubles;
        window.currentPlayer.purchasedAvatars = purchased;
        window.currentPlayer.currentAvatar = avatarId;
        
        updateAvatarEverywhere();
        closeModal('avatarModal');
        closeProfileModal();
        showToast(`✅ Куплен и установлен аватар "${avatarName}" за ${price}💰!`, 'success');
        showLoading(false);
        updateResources();
        setTimeout(() => openProfileModal(), 300);
    } catch (e) {
        showLoading(false);
        showToast('❌ Ошибка покупки: ' + e.message, 'error');
    }
};

// 16.10. СМЕНА ИМЕНИ

window.changeUsername = async function() {
    if (!window.currentPlayer) return;
    
    const newName = prompt('Введите новое имя (латиница/цифры, 3-10 символов):', window.currentPlayer.username);
    if (!newName) return;
    
    if (!/^[a-zA-Z0-9]{3,10}$/.test(newName)) {
        showToast('⚠️ Ник должен содержать 3-10 латинских букв или цифр', 'error');
        return;
    }
    
    if (newName === window.currentPlayer.username) {
        showToast('Имя не изменено', 'info');
        return;
    }
    
    if (!confirm(`Изменить имя с "${window.currentPlayer.username}" на "${newName}"?`)) return;

    try {
        showLoading(true, 'Смена имени...');
        const snapshot = await dbOnce('players');
        let exists = false;
        snapshot.forEach(child => {
            if (child.val().username === newName && child.key !== window.playerId) {
                exists = true;
            }
        });

        if (exists) {
            showToast('❌ Это имя уже занято!', 'error');
            showLoading(false);
            return;
        }

        await dbUpdate('players/' + window.playerId, { username: newName });
        window.currentPlayer.username = newName;
        localStorage.setItem('username', newName);
        showToast('✅ Имя изменено на ' + newName, 'success');
        showLoading(false);
        closeProfileModal();
        setTimeout(() => openProfileModal(), 300);
        updateResources();
    } catch (e) {
        showLoading(false);
        showToast('❌ Ошибка: ' + e.message, 'error');
    }
};

function getGangInfoString(player) {
    if (!player || !player.gang) return "👥 0 бойцов";
    const blats = player.gang.blats?.fighters || 0;
    const muzhiks = player.gang.muzhiks?.fighters || 0;
    const fraers = player.gang.fraers?.fighters || 0;
    const total = blats + muzhiks + fraers;
    return `👥 Всего: ${total} (👑${blats} 🔨${muzhiks} 🐑${fraers})`;
}

function getGangDisplayString(player) {
    if (!player || !player.gang) return "👥 Банда: 0 бойцов";
    const blats = player.gang.blats?.fighters || 0;
    const muzhiks = player.gang.muzhiks?.fighters || 0;
    const fraers = player.gang.fraers?.fighters || 0;
    return `👑 Блатные: ${blats} | 🔨 Мужики: ${muzhiks} | 🐑 Фраера: ${fraers}`;
}

        window.closeModal = function(id) {

                if (window.tg) window.tg.BackButton.hide();

            document.body.style.overflow = '';
            document.body.style.position = '';

        window.logoutAccount = function() {
            if (confirm('Вы уверены, что хотите выйти?')) {
                localStorage.removeItem('playerId');
                localStorage.removeItem('username');
                window.currentPlayer = null;
                window.playerId = null;
                document.getElementById('app').innerHTML = '';
                document.getElementById('authScreen').classList.remove('hidden');
                closeModal('profileModal');
                if (window.tg) window.tg.BackButton.hide();
                showToast('👋 Вы вышли из аккаунта', 'info');
                gameStarted = false;
            }
        };

        window.deleteAccount = async function() {
            if (!window.playerId) return;
            if (!confirm('⚠️ ВНИМАНИЕ! Удалить аккаунт навсегда? Восстановление невозможно!')) return;
            if (!confirm('Введите "ДА" для подтверждения')) return;

            const confirmWord = prompt('Введите "ДА" для подтверждения:');
            if (confirmWord !== 'ДА') {
                showToast('Удаление отменено', 'warning');
                return;
            }

            try {
                showLoading(true, 'Удаление аккаунта...');
                await dbRemove('players/' + window.playerId);
                localStorage.removeItem('playerId');
                localStorage.removeItem('username');
                window.currentPlayer = null;
                window.playerId = null;
                document.getElementById('app').innerHTML = '';
                document.getElementById('authScreen').classList.remove('hidden');
                closeModal('profileModal');
                if (window.tg) window.tg.BackButton.hide();
                showLoading(false);
                showToast('🗑️ Аккаунт удалён', 'success');
                gameStarted = false;
            } catch (e) {
                showLoading(false);
                showToast('❌ Ошибка удаления: ' + e.message, 'error');
            }
        };

        // 23. ПЕРЕКЛЮЧЕНИЕ ВКЛАДОК
        // ============================================================
        window.switchBottomTab = function(tab) {
            window.currentBottomTab = tab;
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            const navBtns = document.querySelectorAll('.nav-btn');
            const tabMap = { city: 0, treasury: 1, clan: 2, war: 3, quests: 4 };
            if (navBtns[tabMap[tab]]) {
                navBtns[tabMap[tab]].classList.add('active');
            }
            if (tab === 'city') {
                showToast('🏙️ Вы на зоне', 'success');

                showToast('📌 Вкладка "' + tab + '" в разработке', 'warning');
