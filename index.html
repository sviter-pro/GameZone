    function checkQuestsCompletion() {
        if (!currentPlayer) return 0;
        let newCount = 0;
        // Проверяем сюжетные задания
        const storyQuests = [
            { id: 'story_1', requirement: 5, current: currentPlayer.level || 1 },
            { id: 'story_2', requirement: 1000, current: currentPlayer.authority || 0 },
            { id: 'story_3', requirement: 1, current: currentPlayer.clanId ? 1 : 0 },
            { id: 'story_4', requirement: 3, current: currentPlayer.mine?.paperLevel || 1 },
            { id: 'story_5', requirement: 10, current: currentPlayer.level || 1 }
        ];
        for (const quest of storyQuests) {
            if (quest.current >= quest.requirement && !completedQuests.includes(quest.id)) {
                newCount++;
            }
        }
        // Проверяем ежедневные задания
        const dailyQuests = [
            { id: 'daily_1', requirement: 3, current: currentPlayer.mine?.lastMineTime ? Math.min(3, Math.floor((Date.now() - (currentPlayer.mine.lastMineTime || 0)) / 3600000) + 1) : 0 },
            { id: 'daily_2', requirement: 1, current: cardGameActive || (cardGameCooldownUntil > 0) ? 1 : 0 },
            { id: 'daily_3', requirement: 1, current: Object.keys(purchasedItemsCount).length > 0 ? 1 : 0 }
        ];
        for (const quest of dailyQuests) {
            if (quest.current >= quest.requirement && !completedQuests.includes(quest.id)) {
                newCount++;
            }
        }
        // Проверяем премиум задания
        const premiumQuests = [
            { id: 'premium_1', requirement: 5, current: currentPlayer.mine?.paperLevel || 1 },
            { id: 'premium_2', requirement: 10, current: currentPlayer.level || 1 },
            { id: 'premium_3', requirement: 1, current: (currentPlayer.clanId && currentPlayer.username === currentPlayer.clanLeader) ? 1 : 0 },
            { id: 'premium_4', requirement: 3, current: currentPlayer.tattoos?.length || 0 },
            { id: 'premium_5', requirement: 1, current: warHistory.filter(w => (w.attackerClanId === currentPlayer.clanId && w.attackerWon) || (w.defenderClanId === currentPlayer.clanId && !w.attackerWon)).length }
        ];
        for (const quest of premiumQuests) {
            if (quest.current >= quest.requirement && !completedQuests.includes(quest.id)) {
                newCount++;
            }
        }
        return newCount;
    }

	// Универсальная функция для предотвращения двойного открытия модальных окон
async function safeOpenModal(modalName, openFunction) {
    const now = Date.now();
    if (isOpeningModal || (now - modalOpenTime) < MODAL_OPEN_DELAY) {
        console.log(`[safeOpenModal] Блокировка: ${modalName} уже открывается`);
        return;
    }
    
    const existingModals = [
        'attackFullscreen', 'attackDetailFullscreen', 'clanFullscreen',
        'questsFullscreen', 'treasuryFullscreen', 'gangFullscreen',
        'shopFullscreen', 'cardgameFullscreen', 'mineFullscreen',
        'profileFullscreen', 'settingsFullscreen', 'inventoryFullscreen',
        'hospitalFullscreen', 'modal'
    ];
    
    for (const modalId of existingModals) {
        if (document.getElementById(modalId) || (modalId === 'modal' && document.querySelector('.modal'))) {
            console.log(`[safeOpenModal] Окно ${modalId} уже открыто`);
            return;
        }
    }
    
    isOpeningModal = true;
    modalOpenTime = now;
    
    try {
        await openFunction();
    } catch (error) {
        console.error(`Ошибка при открытии ${modalName}:`, error);
        showToast(`Ошибка открытия`, 'error');
    } finally {
        setTimeout(() => {
            isOpeningModal = false;
        }, MODAL_OPEN_DELAY);
    }
}

        if (currentPlayer && currentPlayer.level < 3) {
            showToast('Клан доступен с 3 уровня!', 'warning');
            return;
        }
        // Сбрасываем счетчик уведомлений при открытии клана

        // Сохраняем текущую вкладку, чтобы потом вернуть

        currentBottomTab = tab;
        renderUI();
        // Используем безопасное открытие
        safeOpenModal('clan', () => openClanFullModalWithReset(previousTab));
        return;
    }
    if (tab === 'quests') {
        questNotificationCount = 0;
        updateQuestsNotificationBadge();
        safeOpenModal('quests', () => openQuestsModalWithReset());
        return;
    }
    if (tab === 'treasury') {
        safeOpenModal('treasury', () => openTreasuryModalWithReset());
        return;
    }
    if (tab === 'war') {
        if (currentPlayer && currentPlayer.clanId && currentPlayer.username === currentPlayer.clanLeader) {
            safeOpenModal('war', () => openAttackMenuWithReset());
        } else if (currentPlayer && currentPlayer.clanId) {

        } else {
            showToast('Вступите в клан, чтобы участвовать в войнах!', 'warning');
        }
        return;
    }
    if (tab === 'city') {
        currentBottomTab = tab;
        renderUI();
        showToast('🏙️ Вы в Городе', 'success');
    }
}

            showToast('Имя не изменено', 'info');
            return;
        }
        const existing = await db.collection('players').where('username', '==', newName).get();
        if (!existing.empty) {
            showToast('Это имя уже занято!', 'error');
            return;
        }
        await playerDocRef.update({ username: newName });
        currentPlayer.username = newName;
        showToast(`Имя изменено на ${newName}`, 'success');
        closeProfileModal();
        renderUI();
    }

                        if (gameTimerInterval) clearInterval(gameTimerInterval);
                        if (gangTimers.interval) clearInterval(gangTimers.interval);
                        if (clanQuestsTimer) clearInterval(clanQuestsTimer);

    async function addWorkExperience(amount) {
        if (!currentPlayer) return;
        let newAuthority = currentPlayer.authority + amount;
        let newLevel = currentPlayer.level;
        let leveledUp = false;
        let newAuthorityToNext = currentPlayer.authorityToNext;
        let newMaxEnergy = currentPlayer.maxEnergy;
        let newStrength = currentPlayer.stats.strength;
        let newDefense = currentPlayer.stats.defense;
        
        if (newAuthority >= currentPlayer.authorityToNext) {
            newLevel++;
            newAuthority = 0;
            newAuthorityToNext = Math.floor(currentPlayer.authorityToNext * 1.5);
            newMaxEnergy = currentPlayer.maxEnergy + 5;
            newStrength = currentPlayer.stats.strength + 3;
            newDefense = currentPlayer.stats.defense + 2;

            if (cardGameActive) {

                await playerDocRef.update({ cardGameBonusPercent: cardGameBonusPercent });
            }
        }
        
        await playerDocRef.update({
            authority: newAuthority,
            level: newLevel,
            authorityToNext: newAuthorityToNext,
            maxEnergy: newMaxEnergy,
            'stats.strength': newStrength,
            'stats.defense': newDefense
        });
        
        currentPlayer.authority = newAuthority;
        currentPlayer.level = newLevel;
        currentPlayer.authorityToNext = newAuthorityToNext;
        currentPlayer.maxEnergy = newMaxEnergy;
        currentPlayer.stats.strength = newStrength;
        currentPlayer.stats.defense = newDefense;
        
        if (leveledUp) {
            showToast(`🎉 УРОВЕНЬ ${newLevel}! +5 энергии, +3 силы, +2 защиты!`, 'success');
        }
        
        await updateQuestProgress('authority', amount);
        renderUI();

    function isMineUpgradeActive(type) {
        if (type === 'paper') {
            return currentPlayer.mine?.paperUpgradeStartTime > 0 && (Date.now() - currentPlayer.mine.paperUpgradeStartTime) < (currentPlayer.mine.paperUpgradeDuration || 0);
        } else if (type === 'makhorka') {
            return currentPlayer.mine?.makhorkaUpgradeStartTime > 0 && (Date.now() - currentPlayer.mine.makhorkaUpgradeStartTime) < (currentPlayer.mine.makhorkaUpgradeDuration || 0);
        }
        return false;

        if (type === 'paper') {
            const start = currentPlayer.mine?.paperUpgradeStartTime || 0;
            const duration = currentPlayer.mine?.paperUpgradeDuration || 0;
            if (start === 0 || duration === 0) return 0;
            return Math.max(0, duration - (Date.now() - start));
        } else if (type === 'makhorka') {
            const start = currentPlayer.mine?.makhorkaUpgradeStartTime || 0;
            const duration = currentPlayer.mine?.makhorkaUpgradeDuration || 0;
            if (start === 0 || duration === 0) return 0;
            return Math.max(0, duration - (Date.now() - start));
        }
        return 0;
    }

    function getWorkRemaining(type) {
        if (type === 'mine') {
            const lastMine = currentPlayer.mine?.lastMineTime || 0;
            const paperLevel = currentPlayer.mine?.paperLevel || 1;
            let cooldownMs = 2 * 60 * 1000; // База 2 минуты
            cooldownMs = Math.floor(cooldownMs * (1 + (paperLevel - 1) * 0.05)); // +5% за уровень
            return Math.max(0, cooldownMs - (Date.now() - lastMine));
        } else if (type === 'lumber') {
            const lastGather = currentPlayer.lumber?.lastGatherTime || 0;
            const level = currentPlayer.lumber?.level || 1;
            let cooldownMs = 2 * 60 * 1000;
            cooldownMs = Math.floor(cooldownMs * (1 + (level - 1) * 0.05));
            return Math.max(0, cooldownMs - (Date.now() - lastGather));
        } else if (type === 'quarry') {
            const lastGather = currentPlayer.quarry?.lastGatherTime || 0;
            const level = currentPlayer.quarry?.level || 1;
            let cooldownMs = 2 * 60 * 1000;
            cooldownMs = Math.floor(cooldownMs * (1 + (level - 1) * 0.05));
            return Math.max(0, cooldownMs - (Date.now() - lastGather));
        }
        return 0;
    }

            if (quarryUpgradeTimer) quarryUpgradeTimer.textContent = formatTimerMinutes(quarryUpgradeRemaining);
            if (paperUpgradeTimerUpgrade) paperUpgradeTimerUpgrade.textContent = formatTimerMinutes(paperUpgradeRemaining);
            if (makhorkaUpgradeTimerUpgrade) makhorkaUpgradeTimerUpgrade.textContent = formatTimerMinutes(makhorkaUpgradeRemaining);
            if (lumberUpgradeTimerUpgrade) lumberUpgradeTimerUpgrade.textContent = formatTimerMinutes(lumberUpgradeRemaining);
            if (quarryUpgradeTimerUpgrade) quarryUpgradeTimerUpgrade.textContent = formatTimerMinutes(quarryUpgradeRemaining);
            
            const paperUpgradeActive = isMineUpgradeActive('paper');

    async function upgradeMineFromModal(type) {
        if (maintenanceMode) { showToast(maintenanceMessage, 'warning'); return; }
        
        if (isMineUpgradeActive(type)) {
            showToast('Прокачка уже идет! Дождитесь завершения.', 'warning');
            return;
        }
        
        if (getWorkRemaining('mine') > 0) {
            showToast('Невозможно улучшить во время работы! Дождитесь окончания работы.', 'warning');
            return;
        }
        
        const level = currentPlayer.mine[`${type}Level`] || 1;
        const cost = 50 * level;
        if (currentPlayer.cigarettes < cost) { showToast(`Не хватает ${cost - currentPlayer.cigarettes} 🚬!`, 'error'); return; }
        
        await playerDocRef.update({ cigarettes: firebase.firestore.FieldValue.increment(-cost) });
        currentPlayer.cigarettes -= cost;
        
        let upgradeDurationMs = 2 * 60 * 1000;
        upgradeDurationMs = Math.floor(upgradeDurationMs * (1 + (level - 1) * 0.1));
        const upgradeStartTime = Date.now();
        
        const updateObj = {};
        if (type === 'paper') {
            updateObj['mine.paperUpgradeStartTime'] = upgradeStartTime;
            updateObj['mine.paperUpgradeDuration'] = upgradeDurationMs;
        } else {
            updateObj['mine.makhorkaUpgradeStartTime'] = upgradeStartTime;
            updateObj['mine.makhorkaUpgradeDuration'] = upgradeDurationMs;
        }
        await playerDocRef.update(updateObj);
        
        if (type === 'paper') {
            currentPlayer.mine.paperUpgradeStartTime = upgradeStartTime;
            currentPlayer.mine.paperUpgradeDuration = upgradeDurationMs;
        } else {
            currentPlayer.mine.makhorkaUpgradeStartTime = upgradeStartTime;
            currentPlayer.mine.makhorkaUpgradeDuration = upgradeDurationMs;
        }
        
        showToast(`⏳ Начата прокачка ${type === 'paper' ? 'бумаги' : 'махорки'}! Уровень повысится через ${Math.round(upgradeDurationMs / 60000)} мин.`, 'success');
        renderMineModal();
        renderUI();
    }
    
    async function mineResourcesFromModal() {
        if (maintenanceMode) { showToast(maintenanceMessage, 'warning'); return; }
        
        if (isMineUpgradeActive('paper') || isMineUpgradeActive('makhorka')) {
            showToast('Невозможно работать во время прокачки!', 'warning');
            return;
        }
        
        const now = Date.now();
        const lastMine = currentPlayer.mine?.lastMineTime || 0;
        const paperLevel = currentPlayer.mine?.paperLevel || 1;
        let cooldownMs = 2 * 60 * 1000;
        cooldownMs = Math.floor(cooldownMs * (1 + (paperLevel - 1) * 0.05));
        if ((now - lastMine) < cooldownMs) { showToast('Работа еще не доступна!', 'warning'); return; }
        
        // Убираем расход энергии
        // if (!await spendEnergyForWork(energyCost)) return;
        
        let paperGain = 5 * paperLevel;
        let makhorkaGain = 3 * (currentPlayer.mine?.makhorkaLevel || 1);
        if (currentPlayer.caste === 'Мужики') { paperGain = Math.floor(paperGain * 1.05); makhorkaGain = Math.floor(makhorkaGain * 1.05); }
        
        await playerDocRef.update({
            'mine.paper': (currentPlayer.mine?.paper || 0) + paperGain,
            'mine.makhorka': (currentPlayer.mine?.makhorka || 0) + makhorkaGain,
            'mine.lastMineTime': now
        });
        currentPlayer.mine.paper += paperGain;
        currentPlayer.mine.makhorka += makhorkaGain;
        currentPlayer.mine.lastMineTime = now;
        
        const workExp = 25 + (paperLevel * 3) + ((currentPlayer.mine?.makhorkaLevel || 1) * 2);
        await addWorkExperience(workExp);
        
        await updateQuestProgress('mine', paperGain + makhorkaGain);
        showToast(`⛏️ Работа выполнена! +${paperGain}📄, +${makhorkaGain}🌿, +${workExp}⭐ опыта`, 'success');
        renderMineModal();
        renderUI();
    }
    
    async function exchangeToCigarettesFromModal() {
        if (maintenanceMode) { showToast(maintenanceMessage, 'warning'); return; }
        const paper = currentPlayer.mine?.paper || 0;
        const makhorka = currentPlayer.mine?.makhorka || 0;
        if (paper === 0 && makhorka === 0) { showToast('Нет ресурсов!', 'warning'); return; }
        const paperRate = getExchangeRate(currentPlayer.mine?.paperLevel || 1, 'paper');
        const makhorkaRate = getExchangeRate(currentPlayer.mine?.makhorkaLevel || 1, 'makhorka');
        const gain = (paper * paperRate) + (makhorka * makhorkaRate);
        await playerDocRef.update({ cigarettes: firebase.firestore.FieldValue.increment(gain), 'mine.paper': 0, 'mine.makhorka': 0 });
        currentPlayer.cigarettes += gain;
        currentPlayer.mine.paper = 0;
        currentPlayer.mine.makhorka = 0;
        showToast(`🔄 Обмен: +${gain}🚬`, 'success');
        renderMineModal();
        renderUI();
    }

    // Функция генерации рандомных товаров с новыми типами
    function generateRandomShopItems() {
        const items = [];
        const resourceTypes = [
            { type: 'cigarettes', name: 'Папиросы', icon: '🚬', desc: 'Пачка папирос', stat: null, bonus: 0 },
            { type: 'paper', name: 'Бумага', icon: '📄', desc: 'Стопка бумаги', stat: null, bonus: 0 },
            { type: 'makhorka', name: 'Махорка', icon: '🌿', desc: 'Самосад', stat: null, bonus: 0 },
            { type: 'wood', name: 'Древесина', icon: '🪵', desc: 'Сосновый брус', stat: null, bonus: 0 },
            { type: 'stone', name: 'Камень', icon: '🪨', desc: 'Гранитная глыба', stat: null, bonus: 0 },
            { type: 'rubles', name: 'Деньги', icon: '💰', desc: 'Пачка рублей', stat: null, bonus: 0 },
            { type: 'blats', name: 'Блатной авторитет', icon: '👑', desc: 'Уважение блатных', stat: 'strength', bonus: 1 },
            { type: 'muzhiks', name: 'Мужицкая сила', icon: '🔨', desc: 'Трудовые мозоли', stat: 'strength', bonus: 1 },
            { type: 'fraers', name: 'Фраерская удача', icon: '🐑', desc: 'Везение', stat: 'critical', bonus: 1 }
        ];
        
        for (let i = 0; i < 12; i++) {
            const resource = resourceTypes[Math.floor(Math.random() * resourceTypes.length)];
            const priceType = Math.random() > 0.5 ? 'rubles' : 'cigarettes';
            let price = 0;
            if (priceType === 'rubles') {
                price = Math.floor(Math.random() * (50 + currentPlayer.level * 10)) + 10 + currentPlayer.level * 2;
            } else {
                price = Math.floor(Math.random() * (30 + currentPlayer.level * 8)) + 5 + currentPlayer.level;
            }
            
            let amount = Math.floor(Math.random() * (20 + currentPlayer.level * 3)) + 5 + Math.floor(currentPlayer.level / 2);
            
            items.push({
                id: `random_${Date.now()}_${i}_${Math.random()}`,
                name: resource.name,
                desc: resource.desc,
                price: price,
                currency: priceType,
                type: 'resource',
                category: 'random',
                resourceType: resource.type,
                amount: amount,
                icon: resource.icon,
                stat: resource.stat,
                bonus: resource.bonus,
                imageUrl: ''
            });
        }
        return items;
    }
    
    // Функция обновления рандомного магазина
    function updateRandomShopIfNeeded(force = false) {
        const now = Date.now();
        if (force || randomShopItems.length === 0 || now - randomShopLastUpdate >= RANDOM_SHOP_UPDATE_INTERVAL) {
            if (force && currentPlayer.rubles < 200) {
                showToast('Не хватает 200💰 для принудительного обновления!', 'error');
                return false;
            }
            randomShopItems = generateRandomShopItems();
            randomShopLastUpdate = now;
            purchasedRandomItems = {}; // Сбрасываем покупки при обновлении
            // Сохраняем в localStorage
            localStorage.setItem(`randomShopItems_${currentPlayer.id}`, JSON.stringify(randomShopItems));
            localStorage.setItem(`randomShopLastUpdate_${currentPlayer.id}`, randomShopLastUpdate);
            localStorage.setItem(`purchasedRandomItems_${currentPlayer.id}`, JSON.stringify(purchasedRandomItems));
            if (currentShopCategory === 'random' && document.getElementById('shopFullscreen')) {
                renderShopModal();
            }
            if (force) {
                currentPlayer.rubles -= 200;
                playerDocRef.update({ rubles: currentPlayer.rubles });
                showToast('🎲 Ассортимент РАНДОМ обновлён! -200💰', 'success');
            } else {
                showToast('🎲 Ассортимент РАНДОМ обновлён!', 'success');
            }
            renderUI();
            return true;
        }
        return false;
    }
    
    // Функция загрузки рандомных товаров из localStorage
    function loadRandomShopFromStorage() {
        if (currentPlayer && currentPlayer.id) {
            const savedItems = localStorage.getItem(`randomShopItems_${currentPlayer.id}`);
            const savedLastUpdate = localStorage.getItem(`randomShopLastUpdate_${currentPlayer.id}`);
            const savedPurchased = localStorage.getItem(`purchasedRandomItems_${currentPlayer.id}`);
            
            if (savedItems) {
                randomShopItems = JSON.parse(savedItems);
            }
            if (savedLastUpdate) {
                randomShopLastUpdate = parseInt(savedLastUpdate);
            }
            if (savedPurchased) {
                purchasedRandomItems = JSON.parse(savedPurchased);
            }
            
            // Проверяем, не устарели ли товары
            if (randomShopItems.length === 0 || (Date.now() - randomShopLastUpdate) >= RANDOM_SHOP_UPDATE_INTERVAL) {
                updateRandomShopIfNeeded(false);
            }
        }
    }
    
    // Функция получения времени до следующего обновления
    function getRandomShopUpdateRemaining() {
        const elapsed = Date.now() - randomShopLastUpdate;
        return Math.max(0, RANDOM_SHOP_UPDATE_INTERVAL - elapsed);
    }
    
    // Функции прокачки магазина
    function isShopUpgradeActive() {
        return shopUpgradeStartTime > 0 && (Date.now() - shopUpgradeStartTime) < shopUpgradeDuration;
    }
    
    function getShopUpgradeRemaining() {
        if (shopUpgradeStartTime === 0 || shopUpgradeDuration === 0) return 0;
        return Math.max(0, shopUpgradeDuration - (Date.now() - shopUpgradeStartTime));
    }
    
    async function checkAndCompleteShopUpgrade() {
        const remaining = getShopUpgradeRemaining();
        if (remaining === 0 && shopUpgradeStartTime > 0) {
            await playerDocRef.update({
                shopLevel: shopLevel + 1,
                shopUpgradeStartTime: 0,
                shopUpgradeDuration: 0
            });
            shopLevel++;
            shopUpgradeStartTime = 0;
            shopUpgradeDuration = 0;
            showToast(`✅ Уровень магазина повышен до ${shopLevel}!`, 'success');
            if (document.getElementById('shopFullscreen')) renderShopModal();
            renderUI();
            return true;
        }
        return false;
    }
    
    async function upgradeShop() {
        if (maintenanceMode) { showToast(maintenanceMessage, 'warning'); return; }
        if (isShopUpgradeActive()) {
            showToast('Прокачка уже идет! Дождитесь завершения.', 'warning');
            return;
        }
        const costCigarettes = 100 * shopLevel;
        const costWood = 50 * shopLevel;
        const costStone = 30 * shopLevel;
        
        if (currentPlayer.cigarettes < costCigarettes) { showToast(`Не хватает ${costCigarettes - currentPlayer.cigarettes} 🚬!`, 'error'); return; }
        if ((currentPlayer.lumber?.wood || 0) < costWood) { showToast(`Не хватает ${costWood - (currentPlayer.lumber?.wood || 0)} 🪵!`, 'error'); return; }
        if ((currentPlayer.quarry?.stone || 0) < costStone) { showToast(`Не хватает ${costStone - (currentPlayer.quarry?.stone || 0)} 🪨!`, 'error'); return; }
        
        await playerDocRef.update({
            cigarettes: firebase.firestore.FieldValue.increment(-costCigarettes),
            'lumber.wood': firebase.firestore.FieldValue.increment(-costWood),
            'quarry.stone': firebase.firestore.FieldValue.increment(-costStone)
        });
        currentPlayer.cigarettes -= costCigarettes;
        if (currentPlayer.lumber) currentPlayer.lumber.wood -= costWood;
        if (currentPlayer.quarry) currentPlayer.quarry.stone -= costStone;
        
        let upgradeDurationMs = 2 * 60 * 1000;
        upgradeDurationMs = Math.floor(upgradeDurationMs * (1 + (shopLevel - 1) * 0.1));
        const upgradeStartTime = Date.now();
        
        await playerDocRef.update({
            shopUpgradeStartTime: upgradeStartTime,
            shopUpgradeDuration: upgradeDurationMs
        });
        shopUpgradeStartTime = upgradeStartTime;
        shopUpgradeDuration = upgradeDurationMs;
        
        showToast(`⏳ Начата прокачка магазина! Уровень повысится через ${Math.round(upgradeDurationMs / 60000)} мин.`, 'success');
        renderShopModal();
        renderUI();
    }

                    timerEl.textContent = formatTimerMinutes(getShopUpgradeRemaining());
                }

        }, 1000);
        
        // Запускаем таймер прокачки магазина
        if (window.shopUpgradeTimerInterval) clearInterval(window.shopUpgradeTimerInterval);

            const modal = document.getElementById('shopFullscreen');
            if (!modal) {
                if (window.shopUpgradeTimerInterval) clearInterval(window.shopUpgradeTimerInterval);
                return;
            }
            checkAndCompleteShopUpgrade();
            if (currentShopTab === 'upgrade') {
                const costCigarettes = 100 * shopLevel;
                const costWood = 50 * shopLevel;
                const costStone = 30 * shopLevel;
                const upgradeBtn = document.getElementById('upgradeShopBtn');
                const upgradeActive = isShopUpgradeActive();
                const upgradeRemaining = getShopUpgradeRemaining();
                const timerEl = document.getElementById('shopUpgradeTimer');
                
                if (upgradeActive && timerEl) {
                    timerEl.textContent = formatTimerMinutes(upgradeRemaining);
                    if (upgradeBtn) upgradeBtn.disabled = true;
                } else if (!upgradeActive) {
                    if (timerEl) timerEl.textContent = 'Готово!';
                    if (upgradeBtn) {
                        upgradeBtn.disabled = (currentPlayer.cigarettes < costCigarettes || (currentPlayer.lumber?.wood || 0) < costWood || (currentPlayer.quarry?.stone || 0) < costStone);
                    }
                }
            }
        }, 1000);
    }

    // Функция покупки рандомного товара (только один раз)
    async function buyRandomItemFromModal(item) {
        if (maintenanceMode) { showToast(maintenanceMessage, 'warning'); return; }
        if (purchasedRandomItems[item.id]) {
            showToast('Этот товар уже куплен!', 'warning');
            return;
        }
        if (item.currency === 'rubles' && currentPlayer.rubles < item.price) {
            showToast(`Не хватает ${item.price - currentPlayer.rubles} 💰!`, 'error');
            return;
        }
        if (item.currency === 'cigarettes' && currentPlayer.cigarettes < item.price) {
            showToast(`Не хватает ${item.price - currentPlayer.cigarettes} 🚬!`, 'error');
            return;
        }
        
        purchasedRandomItems[item.id] = true;
        // Сохраняем в localStorage
        localStorage.setItem(`purchasedRandomItems_${currentPlayer.id}`, JSON.stringify(purchasedRandomItems));
        
        if (item.resourceType === 'cigarettes') {
            currentPlayer.cigarettes += item.amount;
            await playerDocRef.update({ cigarettes: firebase.firestore.FieldValue.increment(item.amount) });
        } else if (item.resourceType === 'rubles') {
            currentPlayer.rubles += item.amount;
            await playerDocRef.update({ rubles: firebase.firestore.FieldValue.increment(item.amount) });
        } else if (item.resourceType === 'paper') {
            if (!currentPlayer.mine) currentPlayer.mine = { paper: 0 };
            currentPlayer.mine.paper += item.amount;
            await playerDocRef.update({ 'mine.paper': currentPlayer.mine.paper });
        } else if (item.resourceType === 'makhorka') {
            if (!currentPlayer.mine) currentPlayer.mine = { makhorka: 0 };

    function getGymDuration() {

        let additionalHours = Math.floor(gymLevel / 5);
        return (baseHours + additionalHours) * 60 * 60 * 1000;
    }
    
    function getGymUpgradeCost() {
        let costCigarettes = 100 * gymLevel;
        let costWood = 20 * gymLevel;
        let costStone = 15 * gymLevel;
        return { cigarettes: costCigarettes, wood: costWood, stone: costStone };
    }
    
    async function upgradeGymFromModal() {
        if (maintenanceMode) { showToast(maintenanceMessage, 'warning'); return; }
        if (currentPlayer.level < 2) { showToast('Качалка доступна с 2 уровня!', 'warning'); return; }
        
        if (isGymUpgradeActive()) {
            showToast('Прокачка уже идет! Дождитесь завершения.', 'warning');
            return;
        }
        
        if (gymActive) {
            showToast('Невозможно улучшить во время тренировки!', 'warning');
            return;
        }
        
        const cost = getGymUpgradeCost();
        if (currentPlayer.cigarettes < cost.cigarettes) { showToast(`Не хватает ${cost.cigarettes - currentPlayer.cigarettes} 🚬!`, 'error'); return; }
        if ((currentPlayer.lumber?.wood || 0) < cost.wood) { showToast(`Не хватает ${cost.wood - (currentPlayer.lumber?.wood || 0)} 🪵!`, 'error'); return; }
        if ((currentPlayer.quarry?.stone || 0) < cost.stone) { showToast(`Не хватает ${cost.stone - (currentPlayer.quarry?.stone || 0)} 🪨!`, 'error'); return; }
        
        await playerDocRef.update({
            cigarettes: firebase.firestore.FieldValue.increment(-cost.cigarettes),
            'lumber.wood': firebase.firestore.FieldValue.increment(-cost.wood),
            'quarry.stone': firebase.firestore.FieldValue.increment(-cost.stone)
        });
        currentPlayer.cigarettes -= cost.cigarettes;
        if (currentPlayer.lumber) currentPlayer.lumber.wood -= cost.wood;
        if (currentPlayer.quarry) currentPlayer.quarry.stone -= cost.stone;
        
        let upgradeDurationMs = 2 * 60 * 1000;
        upgradeDurationMs = Math.floor(upgradeDurationMs * (1 + (gymLevel - 1) * 0.1));
        const upgradeStartTime = Date.now();
        
        await playerDocRef.update({
            gymUpgradeStartTime: upgradeStartTime,
            gymUpgradeDuration: upgradeDurationMs
        });
        gymUpgradeStartTime = upgradeStartTime;
        gymUpgradeDuration = upgradeDurationMs;
        
        showToast(`⏳ Начата прокачка качалки! Уровень повысится через ${Math.round(upgradeDurationMs / 60000)} мин.`, 'success');
        renderGameModal();
        renderUI();
    }
    
    async function startGymTraining() {
        if (maintenanceMode) { showToast(maintenanceMessage, 'warning'); return; }
        if (gymActive) { showToast('Тренировка уже идет!', 'warning'); return; }
        if (currentPlayer.level < 2) { showToast('Качалка доступна с 2 уровня!', 'warning'); return; }
        
        if (isGymUpgradeActive()) {
            showToast('Невозможно тренироваться во время прокачки качалки!', 'warning');
            return;
        }
        
        if (gymCooldownUntil > Date.now()) {
            showToast(`Тренировка доступна через ${formatTimerMinutes(gymCooldownUntil - Date.now())}`, 'warning');
            return;
        }
        
        const totalFighters = (currentPlayer.gang?.blats?.fighters || 0) + (currentPlayer.gang?.muzhiks?.fighters || 0) + (currentPlayer.gang?.fraers?.fighters || 0);
        if (totalFighters === 0) {
            showToast('У вас нет нанятых зеков в СИЗО! Сначала наймите бойцов.', 'warning');
            return;
        }
        
        gymActive = true;
        gymStartTime = Date.now();
        gymLastUpdateTime = Date.now();
        gymStrengthBonus = 0;
        gymDefenseBonus = 0;
        
        await playerDocRef.update({
            gymActive: true,
            gymStartTime: gymStartTime,
            gymLevel: gymLevel
        });
        
        if (gymInterval) clearInterval(gymInterval);
        gymInterval = setInterval(() => updateGymTraining(), 60000);
        
        showToast(`💪 Начата тренировка! Каждый час ваши бойцы будут увеличивать силу и защиту.`, 'success');
        renderGameModal();
        renderUI();
    }
    
    async function updateGymTraining() {
        if (!gymActive || !currentPlayer) return;
        const elapsed = Date.now() - gymStartTime;
        const totalDuration = getGymDuration();
        
        if (elapsed >= totalDuration) {
            await endGymTraining();
            return;
        }
        
        const minutesPassed = Math.floor((Date.now() - gymLastUpdateTime) / 60000);
        if (minutesPassed >= 1) {
            const totalFighters = (currentPlayer.gang?.blats?.fighters || 0) + (currentPlayer.gang?.muzhiks?.fighters || 0) + (currentPlayer.gang?.fraers?.fighters || 0);
            if (totalFighters === 0) {
                await endGymTraining();
                return;
            }
            
            let strengthIncrease = Math.floor(totalFighters * (0.5 + gymLevel * 0.1));
            let defenseIncrease = Math.floor(totalFighters * (0.3 + gymLevel * 0.05));
            
            gymStrengthBonus += strengthIncrease;
            gymDefenseBonus += defenseIncrease;
            
            currentPlayer.stats.strength += strengthIncrease;
            currentPlayer.stats.defense += defenseIncrease;
            
            await playerDocRef.update({
                'stats.strength': firebase.firestore.FieldValue.increment(strengthIncrease),
                'stats.defense': firebase.firestore.FieldValue.increment(defenseIncrease)
            });
            
            showToast(`💪 +${strengthIncrease} силы, +${defenseIncrease} защиты от тренировки!`, 'success');
            gymLastUpdateTime = Date.now();
            renderGameModal();
            renderUI();
        }
    }
    
    async function endGymTraining() {
        if (!gymActive) return;
        gymActive = false;
        if (gymInterval) { clearInterval(gymInterval); gymInterval = null; }
        gymCooldownUntil = Date.now() + 2 * 60 * 60 * 1000;
        if (gymCooldownInterval) clearInterval(gymCooldownInterval);
        gymCooldownInterval = setInterval(() => {
            if (gymCooldownUntil > 0 && Date.now() >= gymCooldownUntil) {
                gymCooldownUntil = 0;
                if (gymCooldownInterval) clearInterval(gymCooldownInterval);
                showToast('💪 Тренировка снова доступна!', 'success');
                renderUI();
            }
        }, 1000);
        await playerDocRef.update({ gymActive: false, gymStartTime: 0, gymCooldownUntil: gymCooldownUntil });
        showToast(`💪 Тренировка завершена! Следующая через 2 часа.`, 'success');
        renderGameModal();
        renderUI();
    }
    
    async function restoreGym() {
        if (!currentPlayer) return;
        if (currentPlayer.gymActive) {
            const elapsed = Date.now() - (currentPlayer.gymStartTime || 0);
            if (elapsed < getGymDuration()) {
                gymActive = true;
                gymStartTime = currentPlayer.gymStartTime;
                gymLevel = currentPlayer.gymLevel || 1;
                gymLastUpdateTime = currentPlayer.gymLastUpdateTime || gymStartTime;
                if (gymInterval) clearInterval(gymInterval);
                gymInterval = setInterval(() => updateGymTraining(), 60000);
                showToast('💪 Тренировка восстановлена!', 'success');
            } else {
                await playerDocRef.update({ gymActive: false, gymStartTime: 0 });
            }
        }
        if (currentPlayer.gymCooldownUntil && currentPlayer.gymCooldownUntil > Date.now()) {
            gymCooldownUntil = currentPlayer.gymCooldownUntil;
            if (gymCooldownInterval) clearInterval(gymCooldownInterval);
            gymCooldownInterval = setInterval(() => {
                if (gymCooldownUntil > 0 && Date.now() >= gymCooldownUntil) {
                    gymCooldownUntil = 0;
                    if (gymCooldownInterval) clearInterval(gymCooldownInterval);
                    showToast('💪 Тренировка снова доступна!', 'success');
                    renderUI();
                }
            }, 1000);
        }
        gymLevel = currentPlayer.gymLevel || 1;

    async function startCardGameFromModal() {
        if (maintenanceMode) { showToast(maintenanceMessage, 'warning'); return; }
        if (cardGameActive) { showToast('Игра уже активна!', 'warning'); return; }
        if (!currentPlayer) return;
        
        if (isCardGameUpgradeActive()) {
            showToast('Невозможно играть во время прокачки карт!', 'warning');
            return;
        }
        
        if (cardGameCooldownUntil > Date.now()) {
            showToast(`Игра в карты доступна через ${formatTimerMinutes(cardGameCooldownUntil - Date.now())}`, 'warning');
            return;
        }
        if (currentPlayer.level < 2) {
            showToast(`Игра в карты доступна с 2 уровня! Ваш уровень: ${currentPlayer.level}`, 'warning');
            return;
        }
        const minEnergyRequired = Math.floor(currentPlayer.maxEnergy * 0.7);
        if (currentPlayer.energy < minEnergyRequired) {
            showToast(`Для игры нужно не менее 70% энергии! Сейчас: ${Math.floor(currentPlayer.energy / currentPlayer.maxEnergy * 100)}%`, 'warning');
            return;
        }
        const cigarettesCost = 200;
        if (currentPlayer.cigarettes < cigarettesCost) {
            showToast(`Не хватает ${cigarettesCost - currentPlayer.cigarettes} 🚬 для игры!`, 'error');
            return;
        }
        await playerDocRef.update({ cigarettes: firebase.firestore.FieldValue.increment(-cigarettesCost) });
        currentPlayer.cigarettes -= cigarettesCost;
        cardGameBonusPercent = getCardGameBonusFromLevel(currentPlayer.level);
        cardGameActive = true;
        cardGameStartTime = Date.now();
        currentCardImage = getRandomCardImage();
        await playerDocRef.update({
            cardGameActive: true, cardGameStartTime: cardGameStartTime,
            cardGameBonusPercent: cardGameBonusPercent, cardGameUpgradeLevel: cardGameUpgradeLevel
        });
        showToast(`🎴 Игра началась! Списано ${cigarettesCost}🚬. Бонус опыта: +${cardGameBonusPercent}%`, 'success');
        if (cardGameInterval) clearInterval(cardGameInterval);
        cardGameInterval = setInterval(() => updateCardGameExperience(), 10000);
        showActiveGameBadge();
        renderGameModal();
        renderUI();
    }
    
    async function upgradeCardGameFromModal() {
        if (maintenanceMode) { showToast(maintenanceMessage, 'warning'); return; }
        if (cardGameUpgradeLevel >= 10) { showToast('Максимальный уровень прокачки!', 'warning'); return; }
        
        if (isCardGameUpgradeActive()) {
            showToast('Прокачка уже идет! Дождитесь завершения.', 'warning');
            return;
        }
        
        if (cardGameActive) {
            showToast('Невозможно улучшить во время игры!', 'warning');
            return;
        }
        
        const upgradeCost = 100 * cardGameUpgradeLevel;
        if (currentPlayer.cigarettes < upgradeCost) { showToast(`Не хватает ${upgradeCost - currentPlayer.cigarettes} 🚬!`, 'error'); return; }
        
        await playerDocRef.update({ cigarettes: firebase.firestore.FieldValue.increment(-upgradeCost) });
        currentPlayer.cigarettes -= upgradeCost;
        
        let upgradeDurationMs = 2 * 60 * 1000;
        upgradeDurationMs = Math.floor(upgradeDurationMs * (1 + (cardGameUpgradeLevel - 1) * 0.1));
        const upgradeStartTime = Date.now();
        
        await playerDocRef.update({
            cardGameUpgradeStartTime: upgradeStartTime,
            cardGameUpgradeDuration: upgradeDurationMs
        });
        cardGameUpgradeStartTime = upgradeStartTime;
        cardGameUpgradeDuration = upgradeDurationMs;
        
        showToast(`⏳ Начата прокачка карт! Уровень повысится через ${Math.round(upgradeDurationMs / 60000)} мин.`, 'success');
        renderGameModal();
        renderUI();
    }

    async function donateToTreasuryFromModal() {
        if (maintenanceMode) { showToast(maintenanceMessage, 'warning'); return; }
        const amount = parseInt(document.getElementById('donateAmountInput')?.value || 0);
        if (amount <= 0) { showToast('Введите сумму', 'error'); return; }
        if (currentPlayer.rubles < amount) { showToast(`Не хватает ${amount - currentPlayer.rubles} 💰!`, 'error'); return; }
        await playerDocRef.update({ rubles: firebase.firestore.FieldValue.increment(-amount) });
        const treasuryRef = db.collection('config').doc('treasury');
        const treasuryDoc = await treasuryRef.get();
        if (treasuryDoc.exists) await treasuryRef.update({ totalRubles: firebase.firestore.FieldValue.increment(amount) });
        else await treasuryRef.set({ totalRubles: amount });
        const playerClanName = allClans.find(c => c.id === currentPlayer.clanId)?.name || '—';
        await db.collection('treasuryHistory').add({ type: 'player_donate', amount: amount, playerName: currentPlayer.username, clanName: playerClanName, timestamp: Date.now() });
        currentPlayer.rubles -= amount;
        showToast(`💰 +${amount}₽ в общак!`, 'success');
        closeTreasuryModal();
        renderUI();
    }

    async function startWarFromModal(targetClanId) {
        if (maintenanceMode) { showToast(maintenanceMessage, 'warning'); return; }
        if (!currentPlayer.clanId || currentPlayer.username !== currentPlayer.clanLeader) {
            showToast('Только главарь клана может начать войну!', 'error');
            closeAttackModal();
            return;
        }
        if (activeWar) {
            showToast('Уже идет война!', 'warning');
            closeAttackModal();
            return;
        }
        const now = Date.now();
        if (lastAttackTime && (now - lastAttackTime) < attackCooldownHours * 60 * 60 * 1000) {
            showToast(`Атака доступна раз в ${attackCooldownHours} часов.`, 'warning');
            closeAttackModal();
            return;
        }
        const targetClan = allClans.find(c => c.id === targetClanId);
        if (!targetClan) return;
        if (targetClan.defenseUntil && targetClan.defenseUntil > Date.now()) {
            showToast(`Клан ${targetClan.name} под защитой!`, 'warning');
            closeAttackModal();
            return;
        }
        const myClan = allClans.find(c => c.id === currentPlayer.clanId);
        const myPower = myClan.totalPower || 0;
        const enemyPower = targetClan.totalPower || 0;
        let attackerWon = myPower > enemyPower;
        let stolenCigarettes = Math.floor((targetClan.cigarettes || 0) * (attackerWon ? 0.3 : 0.1));
        let stolenRubles = Math.floor((targetClan.rubles || 0) * (attackerWon ? 0.2 : 0.05));
        activeWar = {
            attackerClanId: currentPlayer.clanId,
            attackerClanName: myClan.name,
            defenderClanId: targetClan.id,
            defenderClanName: targetClan.name,
            attackerWon: attackerWon,
            stolenCigarettes: stolenCigarettes,
            stolenRubles: stolenRubles,
            endTime: Date.now() + warDurationHours * 60 * 60 * 1000
        };
        await db.collection('activeWars').doc('current').set(activeWar);
        await playerDocRef.update({ lastAttackTime: now });
        lastAttackTime = now;
        await notifyClanMembers(targetClan.id, `⚠️ Клан "${myClan.name}" объявил войну вашему клану!`);
        await notifyClanMembers(currentPlayer.clanId, `⚔️ Ваш клан атакует клан "${targetClan.name}"!`);
        showToast(`⚔️ Война объявлена клану ${targetClan.name}!`, 'success');
        closeAttackModal();
        renderUI();
    }

    async function loadClanFast() {
        if (!currentPlayer.clanId) { clanMembers = []; return; }
        const clanDoc = await db.collection('clans').doc(currentPlayer.clanId).get();
        if (clanDoc.exists) {
            const clan = clanDoc.data();
            const members = [];
            for (const memberId of clan.membersIds || []) {
                const memberDoc = await db.collection('players').doc(memberId).get();
                if (memberDoc.exists) {
                    const m = memberDoc.data();
                    members.push({
                        username: m.username, level: m.level, power: calculatePlayerPower(m),
                        strength: m.stats?.strength || 10, defense: m.stats?.defense || 5,
                        isLeader: m.username === clan.leader, isYou: m.username === currentPlayer.username,
                        gangDisplay: getGangDisplayString(m)
                    });
                }
            }
            clanMembers = members.sort((a,b) => b.power - a.power);
            return clan;
        }
        return null;
    }

    function loadClanQuests() {
        if (currentPlayer && currentPlayer.clanId) {
            const saved = localStorage.getItem(`clanQuests_${currentPlayer.clanId}`);
            if (saved) {
                try {

    function generateRandomReward() {
        const levelBonus = Math.floor(currentPlayer.level / 2);
        const rewards = [
            { type: 'cigarettes', min: 10 + levelBonus * 2, max: 30 + levelBonus * 4, icon: '🚬', name: 'папирос' },
            { type: 'rubles', min: 5 + levelBonus, max: 20 + levelBonus * 2, icon: '💰', name: 'рублей' },
            { type: 'wood', min: 5 + levelBonus, max: 25 + levelBonus * 3, icon: '🪵', name: 'дерева' },
            { type: 'stone', min: 3 + levelBonus, max: 15 + levelBonus * 2, icon: '🪨', name: 'камня' },
            { type: 'paper', min: 5 + levelBonus, max: 20 + levelBonus * 3, icon: '📄', name: 'бумаги' },
            { type: 'makhorka', min: 3 + levelBonus, max: 12 + levelBonus * 2, icon: '🌿', name: 'махорки' }
        ];
        const randomReward = rewards[Math.floor(Math.random() * rewards.length)];
        const amount = Math.floor(Math.random() * (randomReward.max - randomReward.min + 1) + randomReward.min);
        return { ...randomReward, amount };
    }
    
    function startClanQuests(clanLevel) {
        const now = Date.now();
        let changed = false;
        for (let i = 0; i < clanQuests.length; i++) {
            const questId = i + 1;
            if (questId <= clanLevel && clanQuests[i].startTime === 0 && !clanQuests[i].ready && !clanQuests[i].claimed) {
                clanQuests[i].reward = generateRandomReward();
                clanQuests[i].startTime = now;
                clanQuests[i].ready = false;
                clanQuests[i].claimed = false;
                changed = true;
            }
        }
        if (changed) saveClanQuests();
    }
    
function checkClanQuestsReady() {
    let readyCount = 0;
    const now = Date.now();
    let changed = false;
    
    for (let i = 0; i < clanQuests.length; i++) {
        const quest = clanQuests[i];
        if (quest.startTime > 0 && !quest.ready && !quest.claimed) {
            const endTime = quest.startTime + (quest.hours * 60 * 60 * 1000);
            if (now >= endTime) {
                if (!quest.ready) {
                    quest.ready = true;
                    readyCount++;
                    changed = true;
                    saveClanQuests();
                    if (settingsNotifications) {
                        sendTelegramNotification(`🏆 В клане выполнено задание на ${quest.hours} час(а)! Забери награду!`);
                    }
                } else {
                    readyCount++;
                }
            }
        } else if (quest.ready && !quest.claimed) {
            readyCount++;
        }
    }
    
    // Обновляем глобальный счетчик
    const oldCount = clanQuestReadyCount;
    clanQuestReadyCount = readyCount;
    
    // Обновляем бейдж только если изменилось значение И приложение активно
    if (changed || oldCount !== readyCount) {
        // Используем setTimeout для безопасного обновления DOM
        setTimeout(() => {
            if (currentPlayer && document.getElementById('app')) {
                updateClanNotificationBadge();
            }
        }, 50);
    }
    
    return readyCount;
}
    
    async function claimClanQuestInternal(questId, clanLevel) {
    const quest = clanQuests.find(q => q.id === questId);
    if (!quest) return false;
    if (questId > clanLevel) {
        showToast(`Задание требует уровень клана ${questId}!`, 'warning');
        return false;
    }
    if (!quest.ready) {
        showToast('Задание ещё не выполнено!', 'warning');
        return false;
    }
    if (quest.claimed) {
        showToast('Награда уже получена!', 'warning');
        return false;
    }
    
    const reward = quest.reward;
    if (!reward) return false;
    
    try {
        let updateObj = {};
        if (reward.type === 'cigarettes') {
            currentPlayer.cigarettes += reward.amount;
            updateObj = { cigarettes: firebase.firestore.FieldValue.increment(reward.amount) };
        } else if (reward.type === 'rubles') {
            currentPlayer.rubles += reward.amount;
            updateObj = { rubles: firebase.firestore.FieldValue.increment(reward.amount) };
        } else if (reward.type === 'wood') {
            if (!currentPlayer.lumber) currentPlayer.lumber = { wood: 0 };
            currentPlayer.lumber.wood += reward.amount;
            updateObj = { 'lumber.wood': currentPlayer.lumber.wood };
        } else if (reward.type === 'stone') {
            if (!currentPlayer.quarry) currentPlayer.quarry = { stone: 0 };
            currentPlayer.quarry.stone += reward.amount;
            updateObj = { 'quarry.stone': currentPlayer.quarry.stone };
        } else if (reward.type === 'paper') {
            if (!currentPlayer.mine) currentPlayer.mine = { paper: 0 };
            currentPlayer.mine.paper += reward.amount;
            updateObj = { 'mine.paper': currentPlayer.mine.paper };
        } else if (reward.type === 'makhorka') {
            if (!currentPlayer.mine) currentPlayer.mine = { makhorka: 0 };
            currentPlayer.mine.makhorka += reward.amount;
            updateObj = { 'mine.makhorka': currentPlayer.mine.makhorka };
        }
        
        if (Object.keys(updateObj).length > 0) {
            await playerDocRef.update(updateObj);
        }
        
        // Помечаем задание как полученное
        quest.claimed = true;
        saveClanQuests();
        
        showToast(`🎁 Задание ${quest.hours}ч выполнено! +${reward.amount} ${reward.icon} ${reward.name}`, 'success');
        
        // Обновляем счетчик готовых заданий
        clanQuestReadyCount = checkClanQuestsReady();
        updateClanNotificationBadge();
        
        if (document.getElementById('clanFullscreen') && currentClanTab === 'quests') {
            const clan = allClans.find(c => c.id === currentPlayer.clanId);
            const clanLevelCurrent = clan?.level || 1;
            renderClanQuestsHTML(clanLevelCurrent);
        }
        renderUI();
        return true;
    } catch(e) {
        console.error('Ошибка получения награды:', e);
        showToast('Ошибка при получении награды!', 'error');
        return false;
    }
}
    
    function renderClanQuestsHTML(clanLevel) {
        const container = document.getElementById('clanQuestsContainer');
        if (!container) return;
        
        clanQuestReadyCount = 0;
        for (let i = 0; i < clanQuests.length; i++) {
            if (clanQuests[i].ready && !clanQuests[i].claimed && (i + 1) <= clanLevel) {
                clanQuestReadyCount++;
            }
        }
        updateClanNotificationBadge();
        
        let html = '<h3 style="margin-bottom:15px;">📋 Задания клана</h3><div style="display:flex; flex-direction:column; gap:12px;">';
        
        for (let i = 0; i < clanQuests.length; i++) {
            const quest = clanQuests[i];
            const questId = i + 1;
            const isActive = questId <= clanLevel;
            
            let remainingMs = 0;
            let isRunning = false;
            let canClaim = false;
            
            if (isActive && quest.startTime > 0 && !quest.ready && !quest.claimed) {
                const endTime = quest.startTime + (quest.hours * 60 * 60 * 1000);
                remainingMs = Math.max(0, endTime - Date.now());
                isRunning = true;
            }
            
            if (isActive && quest.ready && !quest.claimed) {
                canClaim = true;
            }
            
            const formattedTime = isRunning ? formatTimeDetailedWithSeconds(remainingMs) : (quest.ready ? 'Готов к получению!' : (quest.startTime === 0 ? 'Не начато' : 'Завершено'));
            const progressPercent = isRunning ? Math.min(100, ((quest.hours * 60 * 60 * 1000 - remainingMs) / (quest.hours * 60 * 60 * 1000)) * 100) : (quest.ready ? 100 : 0);
            
            let rewardHtml = '';
            if (quest.reward && quest.ready) {
                rewardHtml = `<div class="clan-quest-reward">🎁 Награда готова: ${quest.reward.amount} ${quest.reward.icon} ${quest.reward.name}</div>`;
            } else if (quest.reward && isRunning) {
                rewardHtml = `<div class="clan-quest-reward">🎲 Награда: ${quest.reward.amount} ${quest.reward.icon} ${quest.reward.name}</div>`;
            } else if (quest.reward && quest.startTime > 0) {
                rewardHtml = `<div class="clan-quest-reward">🎁 Награда: ${quest.reward.amount} ${quest.reward.icon} ${quest.reward.name}</div>`;
            }
            
            html += `
                <div class="clan-quest-card" style="opacity: ${isActive ? 1 : 0.6}; filter: ${isActive ? 'none' : 'grayscale(0.5)'};">
                    <div class="clan-quest-header">
                        <div class="clan-quest-title">🔰 Задание ${quest.hours} час(а)</div>
                        <div class="clan-quest-timer">${formattedTime}</div>
                    </div>
                    ${rewardHtml}
                    ${isRunning ? `<div class="quest-progress" style="margin:8px 0;"><div class="quest-progress-fill" style="width: ${progressPercent}%"></div></div>` : ''}
                    ${!isActive ? `<div class="bonus-info" style="background:#e94560; padding:8px; border-radius:16px; margin-top:10px;">🔒 Требуется уровень клана ${questId}</div>` : ''}
                    ${canClaim ? `<button class="clan-claim-btn" onclick="claimClanQuestExternal(${questId})">🎁 Забрать награду</button>` : ''}
                </div>
            `;
        }
        
        html += '</div>';
        container.innerHTML = html;
    }
    
    async function claimClanQuestExternal(questId) {

}

    async function createClanFromModal() {
        if (maintenanceMode) { showToast(maintenanceMessage, 'warning'); return; }
        if (currentPlayer.clanId) { showToast('Вы уже в клане!', 'error'); return; }
        if (currentPlayer.level < 3) { showToast('Создать клан можно только с 3 уровня!', 'warning'); return; }
        if (currentPlayer.cigarettes < clanCreationCost) { showToast(`Не хватает ${clanCreationCost - currentPlayer.cigarettes} 🚬!`, 'error'); return; }
        const clanName = prompt('Название клана (латиница, 3-15 символов):');
        if (!clanName || !/^[a-zA-Z0-9]{3,15}$/.test(clanName)) { showToast('Латиница/цифры, 3-15 символов', 'error'); return; }
        if (allClans.find(c => c.name === clanName)) { showToast('Клан существует!', 'error'); return; }
        try {
            await playerDocRef.update({ cigarettes: firebase.firestore.FieldValue.increment(-clanCreationCost) });
            currentPlayer.cigarettes -= clanCreationCost;
            const newClan = { name: clanName, leader: currentPlayer.username, leaderId: playerId, members: [currentPlayer.username], membersIds: [playerId], cigarettes: 0, rubles: 0, level: 1, defenseUntil: 0, createdAt: Date.now(), inviteCode: currentPlayer.inviteCode };
            const clanRef = await db.collection('clans').add(newClan);
            await playerDocRef.update({ clanId: clanRef.id, clanLeader: currentPlayer.username });
            currentPlayer.clanId = clanRef.id;
            currentPlayer.clanLeader = currentPlayer.username;
            cachedClanData.lastUpdate = 0;
            showToast(`Клан "${clanName}" создан!`, 'success');
            await loadAllClans();
            renderUI();
        } catch(e) { showToast('Ошибка: ' + e.message, 'error'); }
    }
    
    async function joinClanFromModal(clanId) {
        if (maintenanceMode) { showToast(maintenanceMessage, 'warning'); return; }
        if (currentPlayer.level < 3) { showToast('Вступать в клан можно только с 3 уровня!', 'warning'); return; }
        if (!confirm('Вступить в этот клан?')) return;

            showToast('Вы вступили в клан!', 'success');
            renderUI();

    async function leaveClanFromModal() {

        if (!currentPlayer.clanId) return;
        if (!confirm('Точно выйти из клана?')) return;
        try {
            await db.collection('clans').doc(currentPlayer.clanId).update({ members: firebase.firestore.FieldValue.arrayRemove(currentPlayer.username), membersIds: firebase.firestore.FieldValue.arrayRemove(playerId) });

            currentPlayer.clanId = null;
            currentPlayer.clanLeader = null;
            cachedClanData.lastUpdate = 0;
            showToast('Вы вышли из клана', 'success');

            renderUI();
        } catch(e) { showToast('Ошибка: ' + e.message, 'error'); }

    async function toggleDefenseFromModal() {
        if (maintenanceMode) { showToast(maintenanceMessage, 'warning'); return; }
        if (!currentPlayer.clanId || currentPlayer.username !== currentPlayer.clanLeader) { showToast('Только главарь', 'error'); return; }
        const clanRef = db.collection('clans').doc(currentPlayer.clanId);
        const clanDoc = await clanRef.get();
        const currentDefense = clanDoc.data()?.defenseUntil || 0;
        if (currentDefense > Date.now()) {
            await clanRef.update({ defenseUntil: 0 });
            showToast('🛡️ Защита отключена!', 'success');
            currentPlayer.defenseUntil = 0;
        } else {
            const hours = parseInt(prompt('На сколько часов включить защиту? (1-48 часов)', '12'));
            if (hours && hours >= 1 && hours <= 48) {
                const defenseUntil = Date.now() + (hours * 60 * 60 * 1000);
                await clanRef.update({ defenseUntil: defenseUntil });
                showToast(`🛡️ Защита включена на ${hours} часов!`, 'success');
                currentPlayer.defenseUntil = defenseUntil;
            } else {
                showToast('Некорректное значение (1-48 часов)', 'error');
            }
        }
        renderUI();
    }

        const gameUrl = window.location.href.split('?')[0];

    async function donateToClanFromModal() {
        if (maintenanceMode) { showToast(maintenanceMessage, 'warning'); return; }
        if (!currentPlayer.clanId) {
            showToast('Вы не состоите в клане!', 'warning');
            return;
        }
        
        const amount = parseInt(document.getElementById('clanDonateAmount')?.value || 0);
        if (amount <= 0) {
            showToast('Введите сумму', 'error');
            return;
        }
        if (currentPlayer.rubles < amount) {
            showToast(`Не хватает ${amount - currentPlayer.rubles} 💰!`, 'error');
            return;
        }
        
        await playerDocRef.update({ rubles: firebase.firestore.FieldValue.increment(-amount) });
        const clanRef = db.collection('clans').doc(currentPlayer.clanId);
        await clanRef.update({ rubles: firebase.firestore.FieldValue.increment(amount) });
        
        currentPlayer.rubles -= amount;
        showToast(`💰 +${amount}₽ в казну клана!`, 'success');
        
        await autoUpgradeClanLevel();
        
        if (document.getElementById('clanFullscreen')) {
            openClanFullModal();
        }
        renderUI();
    }
    
    async function autoUpgradeClanLevel() {
        if (!currentPlayer.clanId) return;
        
        const clanRef = db.collection('clans').doc(currentPlayer.clanId);
        const clanDoc = await clanRef.get();
        if (!clanDoc.exists) return;
        
        const clan = clanDoc.data();
        let currentLevel = clan.level || 1;
        const requiredRubles = 1000 * currentLevel;
        const clanRubles = clan.rubles || 0;
        
        let upgraded = false;
        while (clanRubles >= requiredRubles) {
            await clanRef.update({
                rubles: firebase.firestore.FieldValue.increment(-requiredRubles),
                level: currentLevel + 1
            });
            currentLevel++;
            upgraded = true;
            const updatedClanDoc = await clanRef.get();
            const updatedClan = updatedClanDoc.data();
            if (updatedClan.rubles < (1000 * updatedClan.level)) break;
        }
        
        if (upgraded) {
            showToast(`🏆 Уровень клана повышен до ${currentLevel}!`, 'success');
            await loadClanDataFast();
            if (document.getElementById('clanFullscreen')) {
                openClanFullModal();
            }
            renderUI();
        }
    }

    function handleTouchStart(e) {
        touchStartX = e.changedTouches[0].screenX;
    }
    function handleTouchEnd(e) {
        touchEndX = e.changedTouches[0].screenX;
        const diff = touchStartX - touchEndX;
        if (Math.abs(diff) < 50) return;
        if (diff > 0 && currentQuestsTab < 3) switchQuestsTab(currentQuestsTab + 1);
        if (diff < 0 && currentQuestsTab > 1) switchQuestsTab(currentQuestsTab - 1);
    }

    function formatCooldownTime(ms) {
        if (ms <= 0) return "Готово!";
        const hours = Math.floor(ms / 3600000);
        const minutes = Math.floor((ms % 3600000) / 60000);
        const seconds = Math.floor((ms % 60000) / 1000);
        if (hours > 0) return `${hours}ч ${minutes}м`;
        if (minutes > 0) return `${minutes}м ${seconds}с`;
        return `${seconds}с`;
    }
    function formatGameTime(ms) {
        if (ms <= 0) return "00:00";
        const totalSeconds = Math.floor(ms / 1000);
        const minutes = Math.floor(totalSeconds / 60);
        const seconds = totalSeconds % 60;
        return `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
    }
    
    // Форматирование времени с часами, минутами, секундами
    function formatTimeDetailedWithSeconds(ms) {
        if (ms <= 0) return "0:00:00";
        const totalSeconds = Math.floor(ms / 1000);
        const hours = Math.floor(totalSeconds / 3600);
        const minutes = Math.floor((totalSeconds % 3600) / 60);
        const seconds = totalSeconds % 60;
        if (hours > 0) {
            return `${hours}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }
        return `${minutes}:${seconds.toString().padStart(2, '0')}`;
    }
    
    function formatTimerMinutes(ms) {
        if (ms <= 0) return "Готово!";
        const totalSeconds = Math.floor(ms / 1000);
        const minutes = Math.floor(totalSeconds / 60);
        const seconds = totalSeconds % 60;
        if (minutes > 0) {
            return `${minutes} мин ${seconds} сек`;
        }
        return `${seconds} сек`;
    }

    async function updateCardGameExperience() {
        if (!cardGameActive || !currentPlayer) return;
        const elapsed = Date.now() - cardGameStartTime;
        if (elapsed >= cardGameDuration) { await endCardGame(); return; }
        const energyCost = getCardGameEnergyCost();
        if (currentPlayer.energy >= energyCost) {
            currentPlayer.energy -= energyCost;
            await playerDocRef.update({ energy: currentPlayer.energy });
            let baseExp = 15 + Math.floor(Math.random() * 20);
            let bonusExp = Math.floor(baseExp * (cardGameBonusPercent / 100));
            let totalExp = baseExp + bonusExp;
            const rewardBonus = getCardGameRewardBonus();
            if (Math.random() * 100 < rewardBonus.chance) {
                const rewardType = Math.floor(Math.random() * 6);
                let gain = 0;
                let resourceName = '';
                let updateObj = {};
                if (rewardType === 0) {
                    gain = Math.floor(Math.random() * (rewardBonus.cigarettesMax - rewardBonus.cigarettesMin + 1) + rewardBonus.cigarettesMin);
                    resourceName = '🚬';
                    updateObj = { cigarettes: firebase.firestore.FieldValue.increment(gain) };
                    currentPlayer.cigarettes += gain;
                } else if (rewardType === 1) {
                    gain = Math.floor(Math.random() * (rewardBonus.rublesMax - rewardBonus.rublesMin + 1) + rewardBonus.rublesMin);
                    resourceName = '💰';
                    updateObj = { rubles: firebase.firestore.FieldValue.increment(gain) };
                    currentPlayer.rubles += gain;
                } else if (rewardType === 2) {
                    gain = Math.floor(Math.random() * (rewardBonus.woodMax - rewardBonus.woodMin + 1) + rewardBonus.woodMin);
                    resourceName = '🪵';
                    if (!currentPlayer.lumber) currentPlayer.lumber = { wood: 0 };
                    currentPlayer.lumber.wood = (currentPlayer.lumber.wood || 0) + gain;
                    updateObj = { 'lumber.wood': currentPlayer.lumber.wood };
                } else if (rewardType === 3) {
                    gain = Math.floor(Math.random() * (rewardBonus.stoneMax - rewardBonus.stoneMin + 1) + rewardBonus.stoneMin);
                    resourceName = '🪨';
                    if (!currentPlayer.quarry) currentPlayer.quarry = { stone: 0 };
                    currentPlayer.quarry.stone = (currentPlayer.quarry.stone || 0) + gain;
                    updateObj = { 'quarry.stone': currentPlayer.quarry.stone };
                } else if (rewardType === 4) {
                    gain = Math.floor(Math.random() * (rewardBonus.paperMax - rewardBonus.paperMin + 1) + rewardBonus.paperMin);
                    resourceName = '📄';
                    if (!currentPlayer.mine) currentPlayer.mine = { paper: 0 };
                    currentPlayer.mine.paper = (currentPlayer.mine.paper || 0) + gain;
                    updateObj = { 'mine.paper': currentPlayer.mine.paper };
                } else {
                    gain = Math.floor(Math.random() * (rewardBonus.makhorkaMax - rewardBonus.makhorkaMin + 1) + rewardBonus.makhorkaMin);
                    resourceName = '🌿';
                    if (!currentPlayer.mine) currentPlayer.mine = { makhorka: 0 };
                    currentPlayer.mine.makhorka = (currentPlayer.mine.makhorka || 0) + gain;
                    updateObj = { 'mine.makhorka': currentPlayer.mine.makhorka };
                }
                await playerDocRef.update(updateObj);
                showToast(`🎉 ВЫИГРЫШ! +${gain} ${resourceName}`, 'success');
            }
            await addWorkExperience(totalExp);
            renderUI();
            if (document.getElementById('cardgameFullscreen') && currentGameSection === 'cards' && currentCardsSubTab === 'game') {
                const timerEl = document.getElementById('cardGameTimerFull');
                if (timerEl) {
                    const remaining = Math.max(0, cardGameDuration - (Date.now() - cardGameStartTime));
                    timerEl.textContent = formatGameTime(remaining);
                }

        }

        // ========== НОВАЯ СИСТЕМА СИЗО (ПОЛНОСТЬЮ ПЕРЕПИСАННАЯ) ==========
    
    // Получение количества добавляемых зеков за вербовку (уровень = количество)
    function getRecruitGain(type) {
        const level = currentPlayer.gang[type].level;
        return level; // 1 ур = +1 зек, 2 ур = +2 зека
    }
    
    // Получение стоимости улучшения банды
    function getUpgradeCost(type) {
        const level = currentPlayer.gang[type].level;
        let woodCost = 50 * level;
        let stoneCost = 30 * level;
        let cigarettesCost = 0;
        if (level >= 10) {
            cigarettesCost = 100 * (level - 9);
        }
        return { wood: woodCost, stone: stoneCost, cigarettes: cigarettesCost };
    }
    
    // Получение стоимости найма
    function getRecruitCost(type) {
        const level = currentPlayer.gang[type].level;
        let cigarettesCost = 0, woodCost = 0, stoneCost = 0;
        if (type === 'blats') {
            cigarettesCost = 25 + (level - 1) * 5;
            woodCost = 10 + (level - 1) * 3;
            stoneCost = 8 + (level - 1) * 2;
        } else if (type === 'muzhiks') {
            cigarettesCost = 15 + (level - 1) * 3;
            woodCost = 20 + (level - 1) * 5;
            stoneCost = 10 + (level - 1) * 2;
        } else {
            cigarettesCost = 12 + (level - 1) * 2;
            woodCost = 8 + (level - 1) * 2;
            stoneCost = 18 + (level - 1) * 4;
        }
        return { cigarettes: cigarettesCost, wood: woodCost, stone: stoneCost };
    }
    
    // Проверка активна ли прокачка
    function isUpgradeActive(gangType) {
        const upgradeStart = currentPlayer.gang[gangType].upgradeStartTime || 0;
        const upgradeDuration = currentPlayer.gang[gangType].upgradeDuration || 0;
        if (upgradeStart === 0 || upgradeDuration === 0) return false;
        const elapsed = Date.now() - upgradeStart;
        return elapsed < upgradeDuration;
    }
    
    // Оставшееся время прокачки
    function getUpgradeRemaining(gangType) {
        const upgradeStart = currentPlayer.gang[gangType].upgradeStartTime || 0;
        const upgradeDuration = currentPlayer.gang[gangType].upgradeDuration || 0;
        if (upgradeStart === 0 || upgradeDuration === 0) return 0;
        const elapsed = Date.now() - upgradeStart;
        return Math.max(0, upgradeDuration - elapsed);
    }
    
    // ЗАВЕРШЕНИЕ ПРОКАЧКИ - ПОВЫШАЕТ УРОВЕНЬ БАНДЫ И ИГРОКА
    async function checkAndCompleteUpgrade(gangType) {
        if (!currentPlayer) return false;
        
        const upgradeStart = currentPlayer.gang[gangType].upgradeStartTime || 0;
        const upgradeDuration = currentPlayer.gang[gangType].upgradeDuration || 0;
        
        // Если нет активной прокачки - выходим
        if (upgradeStart === 0 || upgradeDuration === 0) return false;
        
        const elapsed = Date.now() - upgradeStart;
        const remaining = upgradeDuration - elapsed;
        
        console.log(`Проверка ${gangType}: осталось ${Math.floor(remaining/1000)} сек, активно: ${remaining > 0}`);
        
        // Если время вышло
        if (remaining <= 0) {
            const oldLevel = currentPlayer.gang[gangType].level;
            const newLevel = oldLevel + 1;
            
            console.log(`🟢 ЗАВЕРШАЕМ ПРОКАЧКУ ${gangType}: ${oldLevel} -> ${newLevel}`);
            
            try {
                // Обновляем банду
                await playerDocRef.update({
                    [`gang.${gangType}.level`]: newLevel,
                    [`gang.${gangType}.upgradeStartTime`]: 0,
                    [`gang.${gangType}.upgradeDuration`]: 0
                });
                currentPlayer.gang[gangType].level = newLevel;
                currentPlayer.gang[gangType].upgradeStartTime = 0;
                currentPlayer.gang[gangType].upgradeDuration = 0;
                
                // Повышаем уровень игрока
                const newPlayerLevel = currentPlayer.level + 1;
                const newMaxEnergy = currentPlayer.maxEnergy + 5;
                const newStrength = currentPlayer.stats.strength + 3;
                const newDefense = currentPlayer.stats.defense + 2;
                
                await playerDocRef.update({
                    level: newPlayerLevel,
                    maxEnergy: newMaxEnergy,
                    'stats.strength': newStrength,
                    'stats.defense': newDefense
                });
                currentPlayer.level = newPlayerLevel;
                currentPlayer.maxEnergy = newMaxEnergy;
                currentPlayer.stats.strength = newStrength;
                currentPlayer.stats.defense = newDefense;
                
                const typeName = gangType === 'blats' ? 'Блатные' : (gangType === 'muzhiks' ? 'Мужики' : 'Фраера');
                showToast(`✅ ${typeName} улучшены до ${newLevel} уровня! Ваш уровень повышен до ${newPlayerLevel}!`, 'success');
                
                if (document.getElementById('gangFullscreen')) {
                    renderGangModal();
                }
                renderUI();
                return true;
            } catch(e) {
                console.error('Ошибка:', e);
                showToast('Ошибка при завершении прокачки!', 'error');
            }
        }
        return false;
    }
    
    function getRecruitRemaining(gangType) {
        const lastGather = currentPlayer.gang[gangType].lastGatherTime || 0;
        let cooldownMs = 2 * 60 * 1000; // 2 минуты база
        // Увеличиваем время с каждым уровнем на 5%
        cooldownMs = Math.floor(cooldownMs * (1 + (currentPlayer.gang[gangType].level - 1) * 0.05));
        const remaining = cooldownMs - (Date.now() - lastGather);
        return Math.max(0, remaining);
    }
    
    // Можно ли нанимать
    function canRecruit(type) {
        if (isUpgradeActive(type)) return false;
        return getRecruitRemaining(type) <= 0;
    }
    
    function canUpgrade(type) {
        // Проверяем, не идет ли прокачка
        if (isUpgradeActive(type)) return false;
        // Проверяем, не идет ли найм (ожидание найма)
        const recruitRemaining = getRecruitRemaining(type);
        if (recruitRemaining > 0) return false;
        // Если всё ок - можно улучшать
        return true;
    }
    
    // ВЕРБОВКА (НАЙМ)
    async function collectGangIncome(type) {
        if (maintenanceMode) { showToast(maintenanceMessage, 'warning'); return; }
        if (!currentPlayer.gang) currentPlayer.gang = {};
        const gang = currentPlayer.gang;
        if (!gang[type]) gang[type] = { level: 1, lastGatherTime: 0, fighters: 0, upgradeStartTime: 0, upgradeDuration: 0 };
        
        if (isUpgradeActive(type)) {
            showToast('Невозможно нанять во время прокачки!', 'warning');
            return;
        }
        
        const now = Date.now();
        const lastGather = gang[type].lastGatherTime || 0;
        let cooldownMs = 2 * 60 * 1000;
        cooldownMs = Math.floor(cooldownMs * (1 + (gang[type].level - 1) * 0.05));
        
        if ((now - lastGather) < cooldownMs) {
            showToast('Банда еще не набрала новых зеков!', 'warning');
            return;
        }
        
        const cost = getRecruitCost(type);
        if (currentPlayer.cigarettes < cost.cigarettes) {
            showToast(`Не хватает ${cost.cigarettes - currentPlayer.cigarettes} 🚬!`, 'error');
            return;
        }
        if ((currentPlayer.lumber?.wood || 0) < cost.wood) {
            showToast(`Не хватает ${cost.wood - (currentPlayer.lumber?.wood || 0)} 🪵!`, 'error');
            return;
        }
        if ((currentPlayer.quarry?.stone || 0) < cost.stone) {
            showToast(`Не хватает ${cost.stone - (currentPlayer.quarry?.stone || 0)} 🪨!`, 'error');
            return;
        }
        
        currentPlayer.cigarettes -= cost.cigarettes;
        currentPlayer.lumber.wood -= cost.wood;
        currentPlayer.quarry.stone -= cost.stone;
        
        await playerDocRef.update({
            cigarettes: currentPlayer.cigarettes,
            'lumber.wood': currentPlayer.lumber.wood,
            'quarry.stone': currentPlayer.quarry.stone
        });
        
        const gain = getRecruitGain(type);
        gang[type].fighters = (gang[type].fighters || 0) + gain;
        
        const authorityGain = gain * 50;
        const cigarettesGain = gain * 10;
        
        currentPlayer.authority += authorityGain;
        currentPlayer.cigarettes += cigarettesGain;
        
        await playerDocRef.update({
            authority: currentPlayer.authority,
            cigarettes: firebase.firestore.FieldValue.increment(cigarettesGain),
            [`gang.${type}.fighters`]: gang[type].fighters,
            [`gang.${type}.lastGatherTime`]: now
        });
        
        gang[type].lastGatherTime = now;
        
        const typeName = type === 'blats' ? 'блатных' : (type === 'muzhiks' ? 'мужиков' : 'фраеров');
        showToast(`👥 +${gain} ${typeName}! (-${cost.cigarettes}🚬 -${cost.wood}🪵 -${cost.stone}🪨) Теперь в команде: ${gang[type].fighters}. +${authorityGain}⭐ +${cigarettesGain}🚬`, 'success');

    // ПРОКАЧКА БАНДЫ
    async function upgradeGangCaste(type) {
        if (maintenanceMode) { showToast(maintenanceMessage, 'warning'); return; }
        
        if (!currentPlayer.gang) {
            currentPlayer.gang = {
                blats: { level: 1, lastGatherTime: 0, fighters: 0, upgradeStartTime: 0, upgradeDuration: 0 },
                muzhiks: { level: 1, lastGatherTime: 0, fighters: 0, upgradeStartTime: 0, upgradeDuration: 0 },
                fraers: { level: 1, lastGatherTime: 0, fighters: 0, upgradeStartTime: 0, upgradeDuration: 0 }
            };
            await playerDocRef.update({ gang: currentPlayer.gang });
        }
        
        const gang = currentPlayer.gang;
        if (!gang[type]) {
            gang[type] = { level: 1, lastGatherTime: 0, fighters: 0, upgradeStartTime: 0, upgradeDuration: 0 };
            await playerDocRef.update({ [`gang.${type}`]: gang[type] });
        }
        
        if (isUpgradeActive(type)) {
            showToast('Прокачка уже идет! Дождитесь завершения.', 'warning');
            return;
        }
        
        const recruitRemaining = getRecruitRemaining(type);
        if (recruitRemaining > 0) {
            showToast('Невозможно улучшить во время найма!', 'warning');
            return;
        }
        
        const currentLevel = gang[type].level;
        const cost = getUpgradeCost(type);
        
        if ((currentPlayer.lumber?.wood || 0) < cost.wood) {
            showToast(`Не хватает ${cost.wood - (currentPlayer.lumber?.wood || 0)} 🪵!`, 'error');
            return;
        }
        if ((currentPlayer.quarry?.stone || 0) < cost.stone) {
            showToast(`Не хватает ${cost.stone - (currentPlayer.quarry?.stone || 0)} 🪨!`, 'error');
            return;
        }
        if (cost.cigarettes > 0 && currentPlayer.cigarettes < cost.cigarettes) {
            showToast(`Не хватает ${cost.cigarettes - currentPlayer.cigarettes} 🚬!`, 'error');
            return;
        }
        
        if (cost.cigarettes > 0) {
            await playerDocRef.update({ cigarettes: firebase.firestore.FieldValue.increment(-cost.cigarettes) });
            currentPlayer.cigarettes -= cost.cigarettes;
        }
        await playerDocRef.update({
            'lumber.wood': firebase.firestore.FieldValue.increment(-cost.wood),
            'quarry.stone': firebase.firestore.FieldValue.increment(-cost.stone)
        });
        currentPlayer.lumber.wood -= cost.wood;
        currentPlayer.quarry.stone -= cost.stone;
        
        // Время прокачки: 2 минуты + 5% за уровень
        let upgradeDurationMs = 2 * 60 * 1000;
        upgradeDurationMs = Math.floor(upgradeDurationMs * (1 + (currentLevel - 1) * 0.05));
        const upgradeStartTime = Date.now();
        
        await playerDocRef.update({
            [`gang.${type}.upgradeStartTime`]: upgradeStartTime,
            [`gang.${type}.upgradeDuration`]: upgradeDurationMs
        });
        gang[type].upgradeStartTime = upgradeStartTime;
        gang[type].upgradeDuration = upgradeDurationMs;
        
        const minutes = Math.floor(upgradeDurationMs / 60000);
        const seconds = Math.floor((upgradeDurationMs % 60000) / 1000);
        showToast(`⏳ Начата прокачка! Завершится через ${minutes} мин ${seconds} сек.`, 'success');
        
        if (document.getElementById('gangFullscreen')) renderGangModal();
        renderUI();
    }
